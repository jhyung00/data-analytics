<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Foundations Lab - ACCT 311</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom Scrollbar for inner content */
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        /* Animation Classes */
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        .slide-up { animation: slideUp 0.3s ease-out; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Draggable cursor */
        .draggable { cursor: move; user-select: none; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-gray-900 h-screen flex overflow-hidden select-none">

    <!-- Sidebar -->
    <aside class="w-72 bg-white border-r border-gray-200 flex flex-col shadow-sm z-20 flex-shrink-0">
        <div class="p-6 border-b border-gray-100 bg-slate-50">
            <div class="flex items-center space-x-2 text-blue-700 mb-1">
                <i data-lucide="file-spreadsheet" class="w-6 h-6"></i>
                <span class="font-bold text-xl tracking-tight">Data Foundations</span>
            </div>
            <p class="text-slate-500 text-xs">ACCT 311</p>
        </div>
        
        <nav id="module-nav" class="flex-1 overflow-y-auto py-6 px-4 space-y-2 custom-scroll">
            <!-- Navigation Items Injected via JS -->
        </nav>

        <div class="p-4 bg-slate-50 border-t border-gray-200">
            <div class="bg-white p-3 rounded border border-gray-200 shadow-sm">
                <div class="text-xs font-semibold text-gray-500 uppercase mb-2">Course Progress</div>
                <div class="w-full bg-gray-100 rounded-full h-2 overflow-hidden">
                    <div id="progress-bar" class="bg-green-500 h-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
        
        <!-- Header -->
        <header class="bg-white px-8 py-6 border-b border-gray-200 flex justify-between items-center sticky top-0 z-10 shadow-sm">
            <div>
                <div class="flex items-center space-x-2 text-sm text-blue-600 font-semibold uppercase tracking-wider mb-1">
                    <span id="module-number">Module 1</span>
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    <span>Concept Phase</span>
                </div>
                <h1 id="module-title" class="text-3xl font-bold text-gray-900">Data Terminology</h1>
            </div>
            
            <button id="download-btn" onclick="app.downloadFiles()" class="hidden flex items-center space-x-2 bg-slate-800 text-white px-4 py-2 rounded-lg hover:bg-slate-700 transition-colors shadow-sm hover:shadow-md">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span class="text-sm font-medium">Download Practice Files</span>
            </button>
        </header>

        <!-- Main Scroll Area -->
        <main class="flex-1 overflow-y-auto p-8 custom-scroll bg-slate-50">
            <div class="max-w-7xl mx-auto space-y-8">
                
                <!-- Top Row: Concept & Project -->

                            <h4 class="font-semibold text-green-800 text-sm uppercase tracking-wide mb-3">Your Mission Steps:</h4>

    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // --- DATA ---
        const FLAMIN_MAVEN_CSV = `Journal ID,Date,Account,Description,Debit,Credit,Tax Rate,Status,Approved By
JE-1001,2025-01-15,Office Supplies,Staples Order,125.50,0.00,0.08,Posted,J.Doe
JE-1002,2025-01-15,Utilities,Electric Bill,450.00,0.00,0.00,Posted,J.Doe
JE-1002,2025-01-15,Utilities,Electric Bill,450.00,0.00,0.00,Posted,J.Doe
JE-1003,2025-01-16,Revenue,Consulting Fees,0.00,1500.00,0.00,Pending,
JE-1004,2025-01-16,Travel,Flight to NY,650.00,0.00,0.08,Pending,
JE-1005,2025-01-17,Software,SaaS Subscription,99.00,0.00,0.00,Posted,M.Smith
JE-1006,2025-01-18,Revenue,Service Contract,0.00,2200.00,0.00,Draft,
JE-1007,2025-01-19,Rent,January Office Rent,3000.00,0.00,0.00,Posted,J.Doe`;

        const MODULES = [
            {
                id: 'intro',
                title: '1. Data Terminology',
                concept: `
                    <p class="mb-2">In accounting, precise navigation is key. We organize data into ledgers using the grid system.</p>
                    <ul class="space-y-2 text-sm text-gray-600 list-disc pl-5">
                        <li><span class="font-bold text-blue-700">Columns</span>: Vertical stacks (A, B, C) representing fields like "Account" or "Debit".</li>
                        <li><span class="font-bold text-blue-700">Rows</span>: Horizontal lines (1, 2, 3) representing individual transactions.</li>
                        <li><span class="font-bold text-blue-700">Cells</span>: The intersection of a row and column (e.g., C4).</li>
                    </ul>`,
                project: {
                    title: 'Mission 1: The Ledger',
                    brief: 'Open "Accounting_Journal_2025.csv". This contains the raw transaction export for January.',
                    steps: [
                        'Open the downloaded file.',
                        'Navigate to Row 8. Identify the account used.',
                        'Click the "Debit" column header (Column E) to select all debit amounts.'
                    ]
                },
                renderDemo: renderTerminologyDemo
            },
            {
                id: 'types',
                title: '2. Data Types & Dates',
                concept: `
                    <p class="mb-2">Excel stores dates as <strong>serial numbers</strong>. Day 1 is Jan 1, 1900.</p>
                    <p class="mb-2">Numbers can also be stored as <strong>Text</strong> (Strings). These align left and cause formula errors.</p>
                    <div class="bg-yellow-50 p-3 rounded border border-yellow-100 text-sm mb-2">
                        <p><strong>Warning:</strong> A "Number stored as Text" will not be included in SUM calculations.</p>
                    </div>`,
                project: {
                    title: 'Mission 2: Formatting',
                    brief: 'Standardize the date and currency formats.',
                    steps: [
                        'Select Column B (Date). Set format to "Short Date".',
                        'Select Columns E & F. Set format to "Currency".'
                    ]
                },
                renderDemo: renderDataTypeDemo
            },
            {
                id: 'validation',
                title: '3. Data Validation',
                concept: `
                    <p class="mb-2"><strong>Data Validation</strong> restricts user input to ensure accuracy.</p>
                    <ul class="space-y-1 text-sm text-gray-600 list-disc pl-5">
                        <li><strong>List:</strong> Dropdown menus.</li>
                        <li><strong>Whole Number:</strong> Integers only (Quantity).</li>
                        <li><strong>Text Length:</strong> Specific character counts (State Codes).</li>
                    </ul>
                    <p class="mt-2 text-sm">You can also set custom <strong>Error Alerts</strong> to guide users.</p>`,
                project: {
                    title: 'Mission 3: Safe Entry',
                    brief: 'Secure the Status column.',
                    steps: [
                        'Select H2. Go to Data > Validation.',
                        'Allow: List. Source: "Pending, Posted, Void".',
                        'Drag to apply to all rows.'
                    ]
                },
                renderDemo: renderValidationDemo
            },
            {
                id: 'cleaning',
                title: '4. Remove Duplicates',
                concept: `
                    <p class="mb-2">Duplicate entries distort financial reports. The <strong>Remove Duplicates</strong> tool helps clean this up.</p>
                    <p class="text-sm bg-gray-100 p-2 rounded"><strong>Tip:</strong> Be careful! If "Select All Columns" is checked, only rows that match EXACTLY will be removed.</p>`,
                project: {
                    title: 'Mission 4: Audit',
                    brief: 'Remove double-entry errors.',
                    steps: [
                        'Select columns A-I.',
                        'Data Tab > Remove Duplicates.',
                        'Select All Columns. Click OK.'
                    ]
                },
                renderDemo: renderCleanupDemo
            },
            {
                id: 'conditional',
                title: '5. Conditional Formatting',
                concept: `
                    <p>Use <strong>Conditional Formatting</strong> to create heatmaps or flag high-value items automatically.</p>
                    <p class="text-sm mt-2">Found on the Home Tab. Popular options include Color Scales (Heatmaps) and Highlight Cell Rules.</p>`,
                project: {
                    title: 'Mission 5: High Value',
                    brief: 'Flag expenses over $500.',
                    steps: [
                        'Select Debit column data.',
                        'Conditional Formatting > Highlight Rules > Greater Than.',
                        'Enter 500. Choose Red Fill.'
                    ]
                },
                renderDemo: renderCondFormatDemo
            },
            {
                id: 'sorting',
                title: '6. Sorting & Filtering',
                concept: `
                    <p><strong>Sorting</strong> organizes data (A-Z, High-Low). <strong>Filtering</strong> hides irrelevant rows.</p>`,
                project: {
                    title: 'Mission 6: Report',
                    brief: 'Finalize the view.',
                    steps: [
                        'Filter for "Pending" status.',
                        'Sort Account Name A-Z.',
                        'Sort Amount High-Low.'
                    ]
                },
                renderDemo: renderSortingDemo
            },
            {
                id: 'refs',
                title: '7. Absolute vs Relative',
                concept: `
                    <p class="mb-2"><strong>Relative References (A1)</strong> change when you drag a formula.</p>
                    <p class="mb-2"><strong>Absolute References ($A$1)</strong> stay locked to a specific cell.</p>
                    <p class="text-xs text-gray-500">Press <strong>F4</strong> to toggle locking.</p>`,
                project: {
                    title: 'Mission 7: Tax Calc',
                    brief: 'Calculate tax using a fixed rate cell.',
                    steps: [
                        'Type 5% in cell K1.',
                        'In L2, type =E2*$K$1.',
                        'Drag down. Ensure K1 stays fixed.'
                    ]
                },
                renderDemo: renderReferencesDemo
            }
        ];

        // --- APP STATE ---
        const app = {
            activeModule: 0,
            completed: {}, // { 'intro': true, ... }
            
            init() {
                this.renderNav();
                this.loadModule(0);
                lucide.createIcons();
            },

            loadModule(index) {
                this.activeModule = index;
                const mod = MODULES[index];
                
                // Update Header
                document.getElementById('module-number').textContent = `Module ${index + 1}`;
                document.getElementById('module-title').textContent = mod.title;
                
                // Show/Hide Download Button
                const dlBtn = document.getElementById('download-btn');
                if (index === 0) dlBtn.classList.remove('hidden');
                else dlBtn.classList.add('hidden');

                // Update Content
                document.getElementById('concept-content').innerHTML = mod.concept;
                
                // Update Project Card
                document.getElementById('project-title').textContent = mod.project.title;
                document.getElementById('project-brief').textContent = mod.project.brief;
                const stepsList = document.getElementById('project-steps');
                stepsList.innerHTML = mod.project.steps.map((s, i) => `
                    <li class="flex items-start">
                        <span class="flex-shrink-0 w-6 h-6 rounded-full bg-green-600 text-white flex items-center justify-center text-xs font-bold mr-3 mt-0.5 shadow-sm">${i+1}</span>
                        <span class="text-sm text-gray-800 leading-tight pt-1">${s}</span>
                    </li>
                `).join('');

                this.updateUIState(); // Lock/Unlock Project

                // Render Demo
                const container = document.getElementById('demo-container');
                container.innerHTML = ''; // Clear prev
                mod.renderDemo(container, () => this.markComplete(mod.id));
                
                this.renderNav(); // Re-render nav to update active state
                lucide.createIcons();
            },

            updateUIState() {
                // Logic separated to avoid full reload on complete
                const mod = MODULES[this.activeModule];
                const isComplete = this.completed[mod.id];
                const projCard = document.getElementById('project-card');
                const lock = document.getElementById('project-lock');
                const demoStatus = document.getElementById('demo-status');

                if (isComplete) {
                    projCard.classList.replace('opacity-90', 'opacity-100');
                    projCard.classList.replace('bg-gray-50', 'bg-white');
                    projCard.classList.replace('border-gray-200', 'border-blue-200');
                    lock.classList.add('hidden');
                    demoStatus.classList.remove('hidden');
                } else {
                    projCard.classList.replace('opacity-100', 'opacity-90');
                    projCard.classList.replace('bg-white', 'bg-gray-50');
                    projCard.classList.replace('border-blue-200', 'border-gray-200');
                    lock.classList.remove('hidden');
                    demoStatus.classList.add('hidden');
                }
            },

            markComplete(id) {
                if (!this.completed[id]) {
                    this.completed[id] = true;
                    this.updateProgress();
                    this.renderNav();
                    
                    // If we are currently on this module, just update UI elements
                    // instead of reloading the whole module (which kills demo state)
                    if (MODULES[this.activeModule].id === id) {
                        this.updateUIState();
                    }
                }
            },

            updateProgress() {
                const percent = (Object.keys(this.completed).length / MODULES.length) * 100;
                document.getElementById('progress-bar').style.width = `${percent}%`;
            },

            renderNav() {
                const nav = document.getElementById('module-nav');
                nav.innerHTML = MODULES.map((m, i) => {
                    const isActive = i === this.activeModule;
                    const isDone = this.completed[m.id];
                    return `
                        <button onclick="app.loadModule(${i})" class="w-full text-left px-4 py-3 rounded-lg flex items-center justify-between group transition-all duration-200 ${isActive ? 'bg-blue-600 text-white shadow-md' : 'text-gray-600 hover:bg-slate-100 hover:text-blue-600'}">
                            <div class="flex items-center space-x-3">
                                <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold border ${isActive ? 'bg-white/20 border-transparent text-white' : 'bg-white border-gray-300 text-gray-500'}">${i+1}</div>
                                <span class="text-sm font-medium truncate">${m.title.split('. ')[1]}</span>
                            </div>
                            ${isDone ? `<i data-lucide="check-circle" class="w-4 h-4 ${isActive ? 'text-white' : 'text-green-500'}"></i>` : ''}
                        </button>
                    `;
                }).join('');
            },

            downloadFiles() {
                const blob = new Blob([FLAMIN_MAVEN_CSV], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'Accounting_Journal_2025.csv';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        };

        // --- GLOBAL DRAG HANDLER ---
        // Simple drag logic for elements with 'draggable' class
        document.addEventListener('mousedown', function(e) {
            if (e.target.closest('.draggable')) {
                const el = e.target.closest('.draggable');
                let offsetX = e.clientX - el.getBoundingClientRect().left;
                let offsetY = e.clientY - el.getBoundingClientRect().top;
                
                // Allow absolute positioning if not set
                if (window.getComputedStyle(el).position !== 'absolute') {
                    el.style.position = 'absolute';
                }

                function onMouseMove(e) {
                    // Calculate positions relative to parent container
                    const parentRect = el.parentElement.getBoundingClientRect();
                    const newLeft = e.clientX - parentRect.left - offsetX;
                    const newTop = e.clientY - parentRect.top - offsetY;
                    
                    el.style.left = newLeft + 'px';
                    el.style.top = newTop + 'px';
                    // clear any bottom/right constraints from CSS classes if they interfere
                    el.style.bottom = 'auto'; 
                    el.style.right = 'auto';
                }

                function onMouseUp() {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                }

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            }
        });


        // --- DEMO RENDERERS ---

        // 1. Terminology
        function renderTerminologyDemo(container, onComplete) {
            let stage = 0;
            const messages = ["Select Column C (Account)", "Select Row 3", "Select Cell G2 (Tax Rate)", "Done!"];
            
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full py-8">
                    <div id="term-msg" class="text-xl font-bold text-blue-700 mb-6">${messages[0]}</div>
                    <div class="bg-gray-100 p-4 rounded shadow-inner grid grid-cols-4 gap-1 select-none">
                        <div class="bg-gray-200 p-2 text-center text-xs text-gray-400 font-bold"></div>
                        <div id="col-A" class="bg-gray-200 p-2 text-center text-xs font-bold cursor-pointer hover:bg-blue-100">A</div>
                        <div id="col-B" class="bg-gray-200 p-2 text-center text-xs font-bold cursor-pointer hover:bg-blue-100">B</div>
                        <div id="col-C" class="bg-gray-200 p-2 text-center text-xs font-bold cursor-pointer hover:bg-blue-100">C</div>
                        
                        <!-- Row 1 -->
                        <div class="bg-gray-200 p-2 text-center text-xs font-bold cursor-pointer hover:bg-blue-100">1</div>
                        <div class="bg-white border h-8"></div><div class="bg-white border h-8"></div><div class="bg-white border h-8"></div>
                        
                        <!-- Row 2 -->
                        <div class="bg-gray-200 p-2 text-center text-xs font-bold cursor-pointer hover:bg-blue-100">2</div>
                        <div class="bg-white border h-8"></div><div class="bg-white border h-8 text-xs flex items-center justify-center text-gray-400">G2</div><div class="bg-white border h-8"></div>

                        <!-- Row 3 -->
                        <div id="row-3" class="bg-gray-200 p-2 text-center text-xs font-bold cursor-pointer hover:bg-blue-100">3</div>
                        <div class="bg-white border h-8"></div><div class="bg-white border h-8"></div><div class="bg-white border h-8"></div>
                    </div>
                </div>
            `;

            // Logic
            document.getElementById('col-C').onclick = () => { if(stage===0) { stage=1; update(); } };
            document.getElementById('row-3').onclick = () => { if(stage===1) { stage=2; update(); } };
            // Simulate G2 by clicking anywhere in middle of row 2 col 2
            const cells = container.querySelectorAll('.bg-white');
            cells.forEach(c => c.onclick = () => { if(stage===2 && c.textContent === 'G2') { stage=3; update(); onComplete(); } });

            function update() {
                document.getElementById('term-msg').innerText = messages[stage];
            }
        }

        // 2. Data Types
        function renderDataTypeDemo(container, onComplete) {
            let format = 'Number';
            let stringNumFixed = false;

            const render = () => {
                let display = '45672';
                if (format === 'Short Date') display = '1/15/2025';
                if (format === 'Long Date') display = 'Wednesday, Jan 15, 2025';

                container.innerHTML = `
                    <div class="flex flex-row h-full py-8 space-x-12 px-8">
                        <!-- Left: Date Format -->
                        <div class="flex-1 flex flex-col items-center">
                            <h4 class="font-bold text-gray-700 mb-4">Date Formatting</h4>
                            <div class="text-4xl font-mono font-bold text-green-700 bg-green-50 border-2 border-green-200 px-8 py-4 rounded shadow-sm mb-6">${display}</div>
                            <div class="space-y-3 w-64">
                                <button onclick="window.setFormat('Number')" class="w-full text-left px-4 py-3 rounded border ${format==='Number'?'bg-blue-100 border-blue-500':'bg-white hover:bg-gray-50'}">Number (Raw)</button>
                                <button onclick="window.setFormat('Short Date')" class="w-full text-left px-4 py-3 rounded border ${format==='Short Date'?'bg-blue-100 border-blue-500':'bg-white hover:bg-gray-50'}">Short Date</button>
                                <button onclick="window.setFormat('Long Date')" class="w-full text-left px-4 py-3 rounded border ${format==='Long Date'?'bg-green-100 border-green-500 ring-2 ring-green-500 font-bold':'bg-white hover:bg-gray-50'}">Long Date</button>
                            </div>
                        </div>

                        <div class="w-px bg-gray-200 h-full"></div>

                        <!-- Right: Number Stored as Text -->
                        <div class="flex-1 flex flex-col items-center">
                            <h4 class="font-bold text-gray-700 mb-4">Numbers stored as Text</h4>
                            <div class="bg-white border rounded shadow-sm p-4 w-64">
                                <div class="flex justify-between border-b pb-2 mb-2 font-bold text-xs text-gray-500">
                                    <span>Values</span>
                                </div>
                                <div class="space-y-1 text-sm font-mono border p-2 bg-gray-50">
                                    <div class="relative group cursor-pointer" onclick="window.fixStringNum()">
                                        <!-- Green Flag -->
                                        ${!stringNumFixed ? `<div class="absolute top-0 left-0 w-2 h-2 bg-green-500 clip-triangle"></div>` : ''}
                                        <div class="${!stringNumFixed ? 'text-left' : 'text-right'} bg-white px-1 border border-transparent hover:border-gray-300">
                                            100
                                        </div>
                                        ${!stringNumFixed ? 
                                            `<div class="hidden group-hover:block absolute left-full top-0 ml-2 bg-yellow-100 border border-yellow-300 text-[10px] p-2 rounded w-32 shadow-lg z-10 text-yellow-800">
                                                Number stored as text. Click to Convert.
                                            </div>` : ''
                                        }
                                    </div>
                                    <div class="relative group cursor-pointer" onclick="window.fixStringNum()">

        // 7. References (Tiny Excel Engine)
        function renderReferencesDemo(container, onComplete) {
            // State
            let inputFormula = "";
            let c2_display = ""; 
            let c3_val = "";
            let c4_val = "";
            let status = "init"; // init, calculated_c2, filled, error, success
            let errorMsg = "";

            // "Mini Excel" Data Model
            const data = {
                rows: [
                    {B: 100, C: 0},
                    {B: 200, C: 0},
                    {B: 300, C: 0}
                ],
                K1: 0.05
            };

            // Improved parser with relative row shift support
            // Formula assumed to be entered in Row 2 (index 0)
            const evaluate = (formula, currentRowIndex) => {
                // normalize
                let f = formula.toUpperCase().replace(/\s/g, '');
                if (!f.startsWith('=')) return { value: "#ERR", isError: true };
                f = f.substring(1); // remove =

                // 1. Circular Ref Check
                if (f.includes("C2") || f.includes("C3") || f.includes("C4")) {
                    return { value: "#CIRC!", isError: true };
                }

                // 2. Parse References
                // Regex for standard refs like $B$2, B2, $B2, B$2
                // We only care about rows mainly for this vertical drag demo
                // $?([A-Z])\$?(\d+)
                
                // We reconstruct the formula by replacing references with values
                let mathStr = f;
                
                // Replace pattern: (Optional $)(Col Letter)(Optional $)(Row Number)
                mathStr = mathStr.replace(/(\$?)([A-Z])(\$?)(\d+)/g, (match, colAbs, col, rowAbs, rowNumStr) => {
                    const rowNum = parseInt(rowNumStr); // 1-based index from reference
                    const isRowAbs = (rowAbs === '$');
                    
                    // The source formula is always written as if it's in Row 2 (Index 0).
                    // So "K1" means Row 1. "K2" means Row 2.
                    // If isRowAbs ($1), it stays Row 1.
                    // If relative:
                    //   Delta = ReferencedRow - SourceRow(2).
                    //   TargetRow = CurrentRowIndex(0,1,2) + SourceRow(2) + Delta
                    //   Actually simpler: TargetRow = CurrentRowIndex + ReferencedRow.
                    //   Wait. If source is C2 (Row 2) and ref is K1. Delta is -1.
                    //   In Row 2 (Index 0): Target = 2 + -1 = 1. (Row 1).
                    //   In Row 3 (Index 1): Target = 3 + -1 = 2. (Row 2).
                    
                    // Let's calc the target Row Index (0-based) for lookup.
                    // Data K1 is row "0" conceptually if we had a full grid, but we treat K1 as special.
                    // Data B2 is index 0. B3 is index 1.
                    
                    let targetRowIndex;
                    
                    if (isRowAbs) {
                        // Absolute Row
                        // If it's K1 ($K$1 or K$1), we map to our special data.K1
                        if (col === 'K' && rowNum === 1) return data.K1;
                        
                        // If it's B2 ($B$2), it maps to index 0
                        targetRowIndex = rowNum - 2; 
                    } else {
                        // Relative Row
                        // Calculate shift relative to Row 2
                        const shift = rowNum - 2; 
                        targetRowIndex = currentRowIndex + shift;
                    }
                    
                    // Lookup Value
                    if (col === 'K') {
                        // Only K1 exists (which would be targetRowIndex = -1 relative to B2 start?)
                        // Let's map "Row 1" to K1 value, anything else 0
                        // Since B2 is Row 2. Row 1 is rowNum 1.
                        // If targetRowIndex was calculated based on B2=0, then Row 1 is -1.
                        // Let's standardise on row numbers.
                        
                        const actualRowNum = (currentRowIndex + 2) + (rowNum - 2); // logic check? 
                        // If current is Row 2 (0). Ref is K1 (1). 2 + (1-2) = 1. Correct.
                        // If current is Row 3 (1). Ref is K1 (1). 3 + (1-2) = 2. Correct.
                        // Wait, if it was absolute, actualRowNum = rowNum.
                        
                        const effectiveRowNum = isRowAbs ? rowNum : (currentRowIndex + 2) + (rowNum - 2);
                        
                        if (effectiveRowNum === 1) return data.K1;
                        return 0; // K2, K3 etc are empty
                    }
                    
                    if (col === 'B') {
                        const effectiveRowNum = isRowAbs ? rowNum : (currentRowIndex + 2) + (rowNum - 2);
                        const idx = effectiveRowNum - 2;
                        if (data.rows[idx]) return data.rows[idx].B;
                        return 0; 
                    }
                    
                    return 0; // Default empty
                });

                // Safety
                if (/[A-Z]/.test(mathStr)) return { value: "#NAME?", isError: true };

                try {
                    const val = new Function('return ' + mathStr)();
                    if (!isFinite(val) || isNaN(val)) return { value: "#NUM!", isError: true };
                    return { value: "$" + val.toFixed(0), isError: false, raw: val };
                } catch (e) {
                    return { value: "#VALUE!", isError: true };
                }
            };

            const render = () => {
                container.innerHTML = `
                <div class="h-full flex flex-col">
                    <div class="p-4 bg-blue-50 text-center text-sm border-b border-blue-100 text-blue-800">
                        Type the formula in <strong>C2</strong> to calculate Tax (Sales * Rate). Rate is fixed in K1 (5%).
                        <br><span class="text-xs text-gray-500">Press ENTER to calculate C2, then Drag Handle to fill.</span>
                    </div>
                    <div class="flex-1 bg-slate-100 flex justify-center items-center p-8 flex-col">
                        
                        <div class="bg-white border shadow-lg rounded select-none w-96">
                            <!-- Headers -->
                            <div class="flex text-center text-xs font-bold bg-gray-100 border-b">
                                <div class="w-8 py-2 border-r"></div>
                                <div class="flex-1 py-2 border-r">B (Sales)</div>
                                <div class="flex-1 py-2 border-r bg-yellow-50">C (Tax)</div>
                                <div class="w-16 py-2 bg-green-50">K (Rate)</div>
                            </div>
                            
                            <!-- Row 1 -->
                            <div class="flex border-b h-10 items-center text-sm">
                                <div class="w-8 bg-gray-50 text-center text-xs text-gray-400 border-r h-full flex items-center justify-center">1</div>
                                <div class="flex-1 px-2 border-r text-right bg-gray-50"></div>
                                <div class="flex-1 px-2 border-r bg-gray-50"></div>
                                <div class="w-16 px-2 text-center font-bold text-green-700 bg-green-50">5%</div>
                            </div>

                            <!-- Row 2 (Input) -->
                            <div class="flex border-b h-10 items-center text-sm">
                                <div class="w-8 bg-gray-50 text-center text-xs text-gray-400 border-r h-full flex items-center justify-center">2</div>
                                <div class="flex-1 px-2 border-r text-right">$100</div>
                                <div class="flex-1 border-r bg-yellow-50 relative h-full flex items-center px-1 group cursor-text" 
                                     onclick="window.editFormula()">
                                    
                                    ${status === 'init' || status === 'error' ? 
                                    `<input id="formula-in" 
                                        class="w-full h-full bg-transparent px-1 outline-none font-mono text-xs" 
                                        placeholder="=..." 
                                        value="${inputFormula}" 
                                        oninput="window.updateFormula(this.value)"
                                        onkeydown="if(event.key==='Enter') window.calculateC2(this.value)"
                                        onclick="event.stopPropagation()"
                                        autofocus
                                    >` : 
                                    `<div class="w-full text-right font-mono select-none">${c2_display}</div>`
                                    }
                                    
                                    <!-- Fill Handle (Only shown after calc) -->
                                    ${status !== 'init' && status !== 'error' ? 
                                    `<div onclick="event.stopPropagation(); window.doFill()" class="absolute -bottom-1 -right-1 w-2 h-2 bg-green-600 border border-white cursor-pointer hover:scale-150 transition-transform shadow-sm z-20"></div>` 
                                    : ''}
                                </div>
                                <div class="w-16 bg-gray-50"></div>
                            </div>

                            <!-- Row 3 -->
                            <div class="flex border-b h-10 items-center text-sm">
                                <div class="w-8 bg-gray-50 text-center text-xs text-gray-400 border-r h-full flex items-center justify-center">3</div>
                                <div class="flex-1 px-2 border-r text-right">$200</div>
                                <div class="flex-1 px-2 border-r bg-gray-50 text-right font-mono text-gray-600">${c3_val}</div>
                                <div class="w-16 bg-gray-50"></div>
                            </div>

                             <!-- Row 4 -->
                            <div class="flex border-b h-10 items-center text-sm">
                                <div class="w-8 bg-gray-50 text-center text-xs text-gray-400 border-r h-full flex items-center justify-center">4</div>
                                <div class="flex-1 px-2 border-r text-right">$300</div>
                                <div class="flex-1 px-2 border-r bg-gray-50 text-right font-mono text-gray-600">${c4_val}</div>
                                <div class="w-16 bg-gray-50"></div>
                            </div>
                        </div>
                        
                        <!-- Error Toast for Input Phase -->
                        ${errorMsg ? `<div class="mt-4 text-xs text-red-600 bg-red-100 px-2 py-1 rounded animate-bounce">${errorMsg}</div>` : ''}

                    </div>
                    ${status === 'error' ? `
                    <div class="bg-red-100 p-2 text-center text-red-800 text-sm font-bold border-t border-red-200 animate-in slide-in-from-bottom">
                        Oops! That result looks wrong (probably $0 or Error). Did you lock the reference?
                        <button onclick="window.resetRef()" class="ml-2 underline text-xs">Try Again</button>
                    </div>` : ''}
                    ${status === 'success' ? `
                    <div class="bg-green-100 p-2 text-center text-green-800 text-sm font-bold border-t border-green-200 animate-in slide-in-from-bottom">
                        Success! Locking K1 ($K$1) kept the tax rate fixed for all rows.
                    </div>` : ''}
                </div>`;
            };

            window.updateFormula = (v) => { inputFormula = v; errorMsg = ""; };

            window.calculateC2 = (v) => {
                inputFormula = v;
                const res = evaluate(v, 0); // Row 2 is index 0
                
                if (res.isError && res.value === "#ERR") {
                     errorMsg = "Start with '=' to write a formula.";
                } else {
                    c2_display = res.value;
                    status = 'calculated_c2';
                    errorMsg = "";
                }
                render();
            };
            
            window.doFill = () => {
                const res3 = evaluate(inputFormula, 1);
                const res4 = evaluate(inputFormula, 2);
                
                c3_val = res3.value;
                c4_val = res4.value;
                
                if (c3_val === "$10" && c4_val === "$15") {
                    status = 'success';
                    onComplete();
                } else {
                    status = 'error';
                }
                render();
            };
            
            window.resetRef = () => {
                status = 'init';
                inputFormula = '';
                c2_display = '';
                c3_val = '';
                c4_val = '';
                errorMsg = '';
                render();
            }

            window.editFormula = () => {
                if(status === 'calculated_c2' || status === 'error') {
                    status = 'init';
                    // keep inputFormula same
                    c2_display = '';
                    c3_val = '';
                    c4_val = '';
                    render();
                }
            }
            
            render();
        }

        // Initialize
        app.init();
    </script>
</body>
</html>
