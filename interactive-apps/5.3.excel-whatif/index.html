<head>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* --- BASE EXCEL STYLES --- */
        .excel-grid {
            border-collapse: collapse;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 0.85rem;
            background: white;
            cursor: default;
        }
        .excel-grid th {
            background-color: #f3f4f6;
            border: 1px solid #d1d5db;
            padding: 4px 12px;
            text-align: center;
            font-weight: 600;
            color: #374151;
            white-space: nowrap;
        }
        .excel-grid td {
            border: 1px solid #e5e7eb;
            padding: 4px 12px;
            color: #1f2937;
            white-space: nowrap;
            position: relative; /* Essential for tooltip positioning */
        }
        /* Row Headers (1, 2, 3...) */
        .excel-row-header {
            background-color: #f3f4f6;
            font-weight: 600;
            color: #6b7280;
            text-align: center;
            width: 30px;
            border-right: 2px solid #d1d5db !important;
        }
        /* Highlight specific cells */
        .cell-highlight {
            background-color: #fffbeb !important; /* amber-50 */
            border: 2px solid #f97316 !important; /* Orange-500 */
        }
        .cell-input {
            background-color: #fff;
            color: #ec4899; /* Pink-500 */
            font-weight: bold;
        }
        .cell-formula {
            background-color: #f8fafc;
            color: #333;
        }
        .cell-objective {
            background-color: #ffedd5 !important; /* Orange-100 */
            border: 2px solid #ea580c !important; /* Orange-600 */
            font-weight: bold;
        }
        
        /* --- ANIMATED TUTORIAL HIGHLIGHTS --- */
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 2px #ec4899, 0 0 0 4px rgba(236, 72, 153, 0.5); }
            50% { box-shadow: 0 0 0 2px #ec4899, 0 0 0 8px rgba(236, 72, 153, 0); }
            100% { box-shadow: 0 0 0 2px #ec4899, 0 0 0 4px rgba(236, 72, 153, 0.5); }
        }

        .tutorial-highlight {
            animation: pulse-border 2s infinite;
            z-index: 50;
            background-color: #fdf2f8 !important; /* Pink-50 */
        }
        
        .highlight-green {
            box-shadow: 0 0 0 3px #16a34a !important; 
            z-index: 60;
            background-color: #dcfce7 !important;
            transform: scale(1.02);
            transition: transform 0.2s;
        }
        .highlight-blue {
            box-shadow: 0 0 0 3px #2563eb !important;
            z-index: 60;
            background-color: #eff6ff !important;
            transform: scale(1.02);
            transition: transform 0.2s;
        }

        /* Formula Tooltip (Hidden by default, shown on hover) */
        .formula-tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 120%; /* Positioned well above the cell */
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a; /* slate-900 */
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            white-space: nowrap;
            z-index: 100;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            transition: all 0.2s ease-in-out;
        }
        
        /* Show Tooltip on Cell Hover */
        td:hover .formula-tooltip {
            visibility: visible;
            opacity: 1;
            bottom: 110%; /* Slight drop effect */
        }

        /* The Arrow */
        .formula-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -6px;
            border-width: 6px;
            border-style: solid;
            border-color: #0f172a transparent transparent transparent;
        }

        /* --- SOLVER DIALOG STYLES --- */
        .solver-window {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f0f0;
            border: 1px solid #999;
            box-shadow: 4px 4px 15px rgba(0,0,0,0.15);
            border-radius: 4px;
        }
        .solver-header {
            background: white;
            padding: 6px 10px;
            font-size: 11px;
            border-bottom: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* --- UI COMPONENTS --- */
        .module-item {
            transition: all 0.2s;
            border-left: 4px solid transparent;
        }
        .module-item:hover {
            background-color: #fff7ed; /* Orange-50 */
        }
        .module-item.active {
            background-color: #fff7ed; /* Orange-50 */
            border-left-color: #f97316; /* Orange-500 */
            color: #c2410c; /* Orange-800 */
        }

        /* Resizers */
        .resizer {
            position: absolute;
            z-index: 50;
            background: transparent;
            transition: background 0.2s;
        }
        .resizer:hover, .resizer:active {
            background: #94a3b8; /* slate-400 */
        }
        /* Sidebar Resizer (Vertical) */
        #resizer-sidebar {
            top: 0; right: 0; width: 5px; height: 100%; cursor: col-resize;
        }
        /* Panel Resizer (Vertical between grid and interaction) */
        #resizer-panel {
            top: 0; left: 0; width: 6px; height: 100%; cursor: col-resize; border-left: 1px solid #e2e8f0;
        }

        /* Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .animate-slide-in {
            animation: slideIn 0.3s ease-out forwards;
        }

        canvas {
            pointer-events: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
        }
    </style>
</head>

    <script>
        // --- DATA MODELS ---

        // 1. Goal Seek Model (Break-Even)
        const goalSeekData = {
            name: "Break_Even",
            headers: ["", "A", "B"],
            rows: [
                { id: 1, cells: ["Item", "Value"] },
                { id: 2, cells: ["Price", "$50"] },
                { id: 3, cells: ["Cost", "$30"] },
                { id: 4, cells: ["Quantity", "100"] }, // Changing cell
                { id: 5, cells: ["Fixed Costs", "$5,000"] },
                { id: 6, cells: ["Profit", "-$3,000"] } // Formula: (50-30)*100 - 5000 = 2000 - 5000 = -3000
            ],
            highlights: {
                "B6": "cell-objective",
                "B4": "cell-input"
            }
        };

        // 2. Solver Model: Product Mix (Manufacturing)
        const solverData = {
            name: "Production_Plan",
            headers: ["", "A", "B", "C", "D", "E", "F"], // Added Column F
            rows: [
                { id: 1, cells: ["Parameters", "Standard", "Deluxe", "", "Total", "Limit"] }, // Row 1
                { id: 2, cells: ["Unit Price", "$45.00", "$75.00", "", "", ""] },
                { id: 3, cells: ["Unit Cost", "$25.00", "$40.00", "", "", ""] },
                { id: 4, cells: ["Unit Margin", "$20.00", "$35.00", "", "", ""] }, // Calculated
                { id: 5, cells: ["", "", "", "", "", ""] }, // Spacer
                { id: 6, cells: ["Quantity (Make)", "0", "0", "", "", ""] }, // Variable Cells (B6, C6)
                { id: 7, cells: ["", "", "", "", "", ""] }, // Spacer
                { id: 8, cells: ["Labor Hrs/Unit", "2.0", "4.0", "", "0", "2,000"] }, // Constraint 1
                { id: 9, cells: ["Machine Hrs", "1.5", "1.5", "", "0", "1,200"] }, // Constraint 2
                { id: 10, cells: ["Total Profit", "", "", "", "$0.00", ""] } // Objective (E10)
            ],
            highlights: {
                "E10": "cell-objective", // Objective
                "B6": "cell-input",      // Variable
                "C6": "cell-input",      // Variable
                "E8": "cell-formula",    // Constraint LHS
                "E9": "cell-formula"     // Constraint LHS
            }
        };

        // 3. Scenario Model: Budget (Forecasting)
        const scenarioData = {
            name: "Budget_2024",
            headers: ["", "A", "B", "C"],
            rows: [
                { id: 1, cells: ["INPUTS", "Values", "Notes"] },
                { id: 2, cells: ["Sales Growth", "5%", "Base Case"] },
                { id: 3, cells: ["COGS %", "40%", "Of Sales"] },
                { id: 4, cells: ["", "", ""] },
                { id: 5, cells: ["INCOME STATEMENT", "Year 1", "Year 2 (Proj)"] },
                { id: 6, cells: ["Revenue", "$1,000,000", "$1,050,000"] },
                { id: 7, cells: ["COGS", "(400,000)", "(420,000)"] },
                { id: 8, cells: ["Gross Profit", "600,000", "630,000"] },
                { id: 9, cells: ["Fixed Ops", "(250,000)", "(250,000)"] },
                { id: 10, cells: ["Net Income", "$350,000", "$380,000"] }
            ],
            formulas: {
                "C6": "=B6*(1+B2)",        // Rev Year 2 = Rev Year 1 * (1 + Growth)
                "C7": "=-C6*B3",          // COGS = -Rev * COGS %
                "C8": "=C6+C7",           // Gross Profit
                "C10": "=C8+C9"           // Net Income
            },
            scenarios: {
                base: { growth: "5%", cogs: "40%", rev: "$1,050,000", cost: "(420,000)", gp: "630,000", ni: "$380,000", note: "Base Case" },
                best: { growth: "15%", cogs: "38%", rev: "$1,150,000", cost: "(437,000)", gp: "713,000", ni: "$463,000", note: "Best Case (Boom)" },
                worst: { growth: "-10%", cogs: "45%", rev: "$900,000", cost: "(405,000)", gp: "495,000", ni: "$245,000", note: "Recession" }
            }
        };

        // --- COURSE SEQUENCE ---
        const sequence = [
            // 0. INTRO TO WHAT-IF ANALYSIS
            {
                type: 'lesson',
                title: "Intro to What-If Analysis",
                content: `
                    <h3 class="text-xl font-bold text-slate-800 mb-2">Unlocking Business Intelligence</h3>
                    <p class="mb-4 text-slate-600">In the real world, the future is never certain. Prices fluctuate, demand changes, and costs rise. <strong>What-If Analysis</strong> is the set of tools in Excel that allows businesses to explore different future realities.</p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 my-6">
                        <div class="bg-indigo-50 p-5 rounded-lg border border-indigo-200">
                            <h4 class="font-bold text-indigo-800 mb-2"><i class="fas fa-chart-pie mr-2"></i>Finance Application</h4>
                            <p class="text-sm text-slate-700">"What if inflation hits 5%?"<br>Used for budgeting, forecasting cash flows, and risk management.</p>
                        </div>
                        <div class="bg-emerald-50 p-5 rounded-lg border border-emerald-200">
                            <h4 class="font-bold text-emerald-800 mb-2"><i class="fas fa-industry mr-2"></i>Operations Application</h4>
                            <p class="text-sm text-slate-700">"What if we have a labor shortage?"<br>Used for production scheduling, supply chain optimization, and inventory management.</p>
                        </div>
                    </div>

                    <p class="text-slate-600">In this course, we will master three power tools: <strong>Goal Seek</strong> (Working backwards), <strong>Solver</strong> (Optimization), and <strong>Scenario Manager</strong> (Comparing cases).</p>
                `
            },
            // 1. GOAL SEEK INTRO
            {
                type: 'lesson',
                title: "What is Goal Seek?",
                content: `
                    <h3 class="text-xl font-bold text-slate-800 mb-2">Working Backwards</h3>
                    <p class="mb-4">Imagine you know exactly how much profit you need to make this month ($10,000), but you don't know how many units you need to sell to get there.</p>
                    
                    <div class="bg-orange-50 border-l-4 border-orange-500 p-4 rounded-r mb-6">
                        <p class="text-orange-900 font-medium">Standard Formulas work forward:</p>
                        <p class="font-mono text-sm text-slate-600 mt-1">Inputs (Price, Qty) <i class="fas fa-arrow-right mx-1"></i> Result (Profit)</p>
                    </div>

                    <div class="bg-pink-50 border-l-4 border-pink-500 p-4 rounded-r mb-6">
                        <p class="text-pink-900 font-medium">Goal Seek works backward:</p>
                        <p class="font-mono text-sm text-slate-600 mt-1">Desired Result (Profit) <i class="fas fa-arrow-right mx-1"></i> Required Input (Qty)</p>
                    </div>

                    <p>Goal Seek is a "What-If Analysis" tool that finds the right input value to achieve a specific goal.</p>
                `
            },
            // 2. GOAL SEEK PRACTICE
            {
                type: 'goal-seek',
                title: "Goal Seek: Break-Even",
                desc: "We are currently losing money ($3,000 loss). We need to find exactly how many units to sell to Break Even ($0 Profit). Configure the Goal Seek parameters.",
                taskBadge: "Goal Seek Practice",
                data: goalSeekData,
                options: [
                    {
                        label: "Option A",
                        setCell: "B6", toValue: "0", changeCell: "B4",
                        text: "Set Cell B6 (Profit) to 0 by changing B4 (Qty)",
                        correct: true,
                        feedback: "Correct! Goal Seek will iterate values in B4 until B6 equals 0."
                    },
                    {
                        label: "Option B",
                        setCell: "B4", toValue: "0", changeCell: "B6",
                        text: "Set Cell B4 (Qty) to 0 by changing B6 (Profit)",
                        correct: false,
                        feedback: "Incorrect. B6 is a formula; you cannot just 'change' it directly. You must change the input (Qty)."
                    },
                     {
                        label: "Option C",
                        setCell: "B6", toValue: "5000", changeCell: "B4",
                        text: "Set Cell B6 (Profit) to 5000 by changing B4 (Qty)",
                        correct: false,
                        feedback: "Incorrect. We want to Break Even, which means Profit should be 0, not equal to Fixed Costs."
                    }
                ]
            },
            // 3. SOLVER INTRO
            {
                type: 'lesson',
                title: "What is Solver?",
                content: `
                    <h3 class="text-xl font-bold text-slate-800 mb-2">Beyond Goal Seek</h3>
                    <p class="mb-4">Goal Seek is great for one variable. But what if you have <strong>multiple</strong> products, limited resources, and need to maximize profit?</p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 my-6">
                        <div class="bg-blue-50 p-4 rounded-lg border border-blue-100 opacity-60">
                            <h4 class="font-bold text-blue-800 mb-2"><i class="fas fa-bullseye mr-2"></i>Goal Seek</h4>
                            <p class="text-sm">Finds <strong>one</strong> input to reach a target.</p>
                        </div>
                        <div class="bg-orange-50 p-4 rounded-lg border border-orange-200 shadow-sm">
                            <h4 class="font-bold text-orange-800 mb-2"><i class="fas fa-network-wired mr-2"></i>Solver</h4>
                            <p class="text-sm">Finds <strong>many</strong> inputs to Maximize/Minimize a result, subject to <strong>constraints</strong>.</p>
                            <p class="text-xs text-slate-500 mt-2">Example: "Maximize Profit without running out of labor or machine hours."</p>
                        </div>
                    </div>
                    
                    <p>In this module, we will act as the Production Manager. We need to decide the optimal manufacturing mix.</p>
                `
            },

                                <li><strong>Scenarios:</strong> 
                                    <ul class="list-disc ml-5 mt-1 text-xs text-slate-500">
                                        <li><strong>Viral:</strong> Low CPC ($1.50), High Conv (6%)</li>

        ];

        // --- STATE ---
        let currentIndex = 0;
        let activeScenario = 'base';
        let currentWalkthroughStep = 0;

        // --- CORE FUNCTIONS ---
        function init() {
            renderModuleList();
            loadItem(0);
            animateConfetti();
            initResizers();
        }

        function initResizers() {
            // Sidebar Resizer
            const sidebarResizer = document.getElementById('resizer-sidebar');
            const sidebar = document.getElementById('sidebar');
            
            sidebarResizer.addEventListener('mousedown', (e) => {
                e.preventDefault();
                document.body.style.cursor = 'col-resize';
                
                const onMouseMove = (e) => {
                    const newWidth = e.clientX;
                    if (newWidth > 200 && newWidth < 500) {
                        sidebar.style.width = newWidth + 'px';
                    }
                };
                
                const onMouseUp = () => {
                    document.body.style.cursor = 'default';
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };
                
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });

            // Panel Resizer
            const panelResizer = document.getElementById('resizer-panel');
            const interactionPane = document.getElementById('interaction-pane');
            const gridPane = document.getElementById('grid-pane');
            
            panelResizer.addEventListener('mousedown', (e) => {
                e.preventDefault();
                document.body.style.cursor = 'col-resize';
                
                const onMouseMove = (e) => {
                    // Right pane width = Window width - mouse X position
                    const newWidth = window.innerWidth - e.clientX;
                    if (newWidth > 300 && newWidth < window.innerWidth - 300) {
                        interactionPane.style.width = newWidth + 'px';
                    }
                };
                
                const onMouseUp = () => {
                    document.body.style.cursor = 'default';
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };
                
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
        }

        function renderModuleList() {
            const list = document.getElementById('module-list');
            list.innerHTML = '';
            
            sequence.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = `module-item px-5 py-4 cursor-pointer flex items-center gap-3 ${idx === currentIndex ? 'active' : ''}`;
                
                let icon = 'fa-circle';
                if(item.type === 'lesson') icon = 'fa-book-open';
                if(item.type === 'solver-quiz') icon = 'fa-calculator';
                if(item.type === 'scenario-playground') icon = 'fa-chart-line';
                if(item.type === 'scenario-walkthrough' || item.type === 'solver-walkthrough') icon = 'fa-shoe-prints';
                if(item.title === 'Capstone Project') icon = 'fa-graduation-cap';
                if(item.type === 'goal-seek') icon = 'fa-crosshairs';

                div.innerHTML = `
                    <i class="fas ${icon} text-xs ${idx === currentIndex ? 'text-orange-500' : 'text-slate-300'}"></i>
                    <div>
                        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${item.type.replace('-quiz','').replace('-playground','').replace('-walkthrough', ' Walkthrough').replace('-seek', '')}</div>
                        <div class="text-sm font-medium text-slate-700">${item.title}</div>
                    </div>
                `;
                div.onclick = () => loadItem(idx);
                list.appendChild(div);
            });
            document.getElementById('progress-text').innerText = `${currentIndex + 1}/${sequence.length}`;
        }

        function loadItem(index) {
            currentIndex = index;
            renderModuleList();
            
            const item = sequence[index];
            const views = ['lesson-view', 'simulation-view', 'completion-view'];
            views.forEach(v => document.getElementById(v).classList.add('hidden'));

            // Toggle Global Back Button Visibility
            const prevBtn = document.getElementById('global-prev-btn');
            if (currentIndex > 0) {
                prevBtn.classList.remove('hidden');
                prevBtn.classList.add('flex');
            } else {
                prevBtn.classList.add('hidden');
                prevBtn.classList.remove('flex');
            }

            if (item.type === 'lesson') {
                document.getElementById('lesson-view').classList.remove('hidden');
                document.getElementById('lesson-title').innerText = item.title;
                document.getElementById('lesson-content').innerHTML = item.content;
            } 
            else {
                // Shared logic for solver-quiz, scenario-playground, and scenario-walkthrough
                document.getElementById('simulation-view').classList.remove('hidden');
                document.getElementById('sim-title').innerText = item.title;
                document.getElementById('sim-desc').innerText = item.desc;
                document.getElementById('sim-task-badge').innerText = item.taskBadge || "Task";
                document.getElementById('sheet-name').innerText = item.data.name;

                // Reset Feedback Area
                document.getElementById('feedback-area').classList.add('hidden');
                
                // Render Table
                // Pass false initially, renderInteractionArea will trigger updates if needed
                renderExcelTable(item.data, false); 

                // Render Interactions
                if (item.type === 'scenario-walkthrough' || item.type === 'solver-walkthrough') {
                    currentWalkthroughStep = 0; // Reset
                }
                renderInteractionArea(item);
            }
        }

        function renderExcelTable(data, showFormulas = false) {
            const table = document.getElementById('data-table');
            table.innerHTML = '';
            
            // Header Row (A, B, C...)
            const thead = document.createElement('thead');
            const rowHeader = document.createElement('tr');
            
            // Corner
            const corner = document.createElement('th');
            corner.className = "w-8 border-r-2 border-gray-300 bg-gray-100";
            rowHeader.appendChild(corner);

            data.headers.forEach((h, i) => {
                if (i===0) return; // Skip empty first index used for corner alignment
                const th = document.createElement('th');
                th.innerText = h;
                rowHeader.appendChild(th);
            });
            thead.appendChild(rowHeader);
            table.appendChild(thead);

            // Body
            const tbody = document.createElement('tbody');
            data.rows.forEach(row => {
                const tr = document.createElement('tr');
                
                // Row Number (1, 2, 3...)
                const rowNum = document.createElement('td');
                rowNum.className = "excel-row-header";
                rowNum.innerText = row.id;
                tr.appendChild(rowNum);

                row.cells.forEach((cellContent, cellIndex) => {
                    const td = document.createElement('td');
                    
                    // Determine Cell Address (e.g., B6)
                    const colLetter = data.headers[cellIndex + 1]; // +1 due to offset
                    const cellAddress = colLetter ? colLetter + row.id : null;
                    
                    // Assign ID to ALL cells for highlighting logic
                    if (cellAddress) {
                        td.id = `cell-${cellAddress}`;
                    }

                    // Content Logic: Check for Formula
                    if (showFormulas && data.formulas && data.formulas[cellAddress]) {
                        td.innerText = data.formulas[cellAddress];
                        td.classList.add("text-blue-600", "font-mono", "text-[10px]", "bg-blue-50");
                    } else {
                        td.innerText = cellContent;
                    }

                    // Apply styling from data model
                    if (data.highlights && data.highlights[cellAddress]) {
                        td.className += " " + data.highlights[cellAddress];
                    }

                    // Bold first column labels
                    if (cellIndex === 0) td.style.fontWeight = 'bold';
                    if (cellIndex === 0) td.style.backgroundColor = '#fafafa';

                    // Update values if Scenario Mode
                    if (data.name === "Budget_2024" && cellAddress && !showFormulas) {
                        updateScenarioCell(cellAddress, td);
                    }

                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
        }

        function updateScenarioCell(address, element) {
            // Mapping for dynamic updates based on current scenario
            const vals = sequence[currentIndex].data.scenarios?.[activeScenario];
            // If in walkthrough mode, force 'base' scenario initially or logic specific
            // But reuse 'base' is fine for tutorial start
            const safeVals = vals || sequence[currentIndex].data.scenarios['base'];

            if (!safeVals) return;

            if (address === 'B2') element.innerText = safeVals.growth;
            if (address === 'B3') element.innerText = safeVals.cogs;
            if (address === 'C2') element.innerText = safeVals.note;
            if (address === 'C6') element.innerText = safeVals.rev;
            if (address === 'C7') element.innerText = safeVals.cost;
            if (address === 'C8') element.innerText = safeVals.gp;
            if (address === 'C10') {
                element.innerText = safeVals.ni;
                element.classList.add('transition-colors', 'duration-500');
            }
        }

        function updateGridHighlights(cellIds, tooltips = null) {
            // Clear custom highlights & tooltips
            document.querySelectorAll('.tutorial-highlight').forEach(el => el.classList.remove('tutorial-highlight'));
            document.querySelectorAll('.highlight-green').forEach(el => el.classList.remove('highlight-green'));
            document.querySelectorAll('.highlight-blue').forEach(el => el.classList.remove('highlight-blue'));
            document.querySelectorAll('.formula-tooltip').forEach(el => el.remove());
            
            // Add new highlights
            if (cellIds) {
                cellIds.forEach(item => {
                    let id, className;
                    // Check if item is object (custom color) or string (default)
                    if (typeof item === 'object') {
                        id = item.id;
                        className = item.class;
                    } else {
                        id = item;
                        className = 'tutorial-highlight';
                    }

                    const cell = document.getElementById('cell-' + id);
                    if(cell) {
                        cell.classList.add(className);
                    }
                });
            }

            // Add tooltip logic (Supports Array of Tooltips)
            if (tooltips) {
                // Ensure tooltips is an array
                const tooltipArray = Array.isArray(tooltips) ? tooltips : [tooltips];
                
                tooltipArray.forEach(tooltip => {
                    if (tooltip.target) {
                        const cell = document.getElementById('cell-' + tooltip.target);
                        if (cell) {
                            const tip = document.createElement('div');
                            tip.className = 'formula-tooltip animate-slide-in';
                            tip.innerText = tooltip.content;
                            cell.appendChild(tip);
                        }
                    }
                });
            }
        }

        function renderInteractionArea(item) {
            const container = document.getElementById('interaction-area');
            container.innerHTML = '';

            if (item.type === 'scenario-walkthrough' || item.type === 'solver-walkthrough') {
                const step = item.steps[currentWalkthroughStep];
                
                // RE-RENDER TABLE if formula mode changed
                renderExcelTable(item.data, step.showFormulas);

                // Highlight Grid Cells for this step AND Show Tooltip
                updateGridHighlights(step.highlights, step.tooltips); // Note: Changed to step.tooltips (plural)

                const wrapper = document.createElement('div');

                        <span class="text-xs font-bold text-blue-600 bg-blue-100 px-2 py-1 rounded uppercase tracking-wider">${step.stepInfo}</span>
                        <h4 class="text-lg font-bold text-slate-800 mt-2">${step.title}</h4>
                        <p class="text-sm text-slate-600 mt-1">${step.text}</p>

                    <div class="bg-slate-50 border border-slate-200 rounded p-4 mb-6 flex-1 flex items-center justify-center">

                            <i class="fas fa-arrow-left mr-2"></i> Back

                    prevBtn.onclick = () => {
                        if (currentWalkthroughStep > 0) {
                            currentWalkthroughStep--;
                            renderInteractionArea(item);

                    };
                }

                if (nextBtn) {
                    nextBtn.onclick = () => {
                        if (currentWalkthroughStep < item.steps.length - 1) {
                            currentWalkthroughStep++;
                            renderInteractionArea(item);
                        } else {
                            nextItem();

                             <div class="flex items-center gap-2 justify-between">

                            </div>
                            <div class="flex items-center gap-2 justify-between">
                                <span>To value:</span>
                                <div class="bg-white border border-gray-300 px-2 py-0.5 w-16 font-mono text-right">${opt.toValue}</div>
                            </div>
                            <div class="flex items-center gap-2 justify-between">
                                <span>By changing cell:</span>
                                <div class="bg-white border border-gray-300 px-2 py-0.5 w-16 font-mono text-right">${opt.changeCell}</div>
                            </div>
                        </div>
                        <div class="bg-gray-200 p-2 text-center text-xs text-gray-500 italic border-t border-gray-300">
                            ${opt.text}
                        </div>
                    `;
                    btn.innerHTML = content;
                    container.appendChild(btn);
                });
                return;
            }

            // ... Existing Logic for other types ...
            if (item.type === 'solver-quiz') {
                // Render Fake Solver Dialog Buttons
                item.options.forEach((opt, idx) => {
                    const btn = document.createElement('div');

                    btn.onclick = () => handleAnswer(opt, btn, item);

                    const content = `

                                <div class="bg-white border border-gray-300 px-2 py-0.5 w-24 font-mono">${opt.change || ''}</div>

            else if (item.type === 'scenario-playground') {

                    if(scen === 'worst') label = "Recession";
                    if(scen === 'best') label = "Boom";
                    
                    btn.className = `flex-1 py-2 px-3 rounded text-sm font-bold border transition-colors ${activeScenario === scen ? 'bg-orange-500 text-white border-orange-500 shadow-md' : 'bg-white text-slate-600 border-gray-300 hover:bg-gray-50'}`;

                    btn.onclick = () => {

                    optBtn.onclick = () => handleAnswer(opt, optBtn, item);

                container.appendChild(qBlock);
            }
        }

        function handleAnswer(opt, btnElement, item) {
            const fbArea = document.getElementById('feedback-area');
            const fbTitle = document.getElementById('feedback-title');
            const fbMsg = document.getElementById('feedback-msg');
            const fbIcon = document.getElementById('feedback-icon');
            const nextBtn = document.getElementById('feedback-next-btn');

            fbArea.classList.remove('hidden', 'bg-red-50', 'border-red-200', 'text-red-800', 'bg-green-50', 'border-green-200', 'text-green-800');

            if (opt.correct) {
                fbArea.classList.add('bg-green-50', 'border-green-200', 'text-green-800');
                fbIcon.innerHTML = '<i class="fas fa-check-circle"></i>';
                fbTitle.innerText = "Correct!";
                nextBtn.classList.remove('hidden');
                
                // If interactive buttons, highlight specific one
                if (btnElement) {
                   btnElement.classList.add('ring-2', 'ring-green-500', 'bg-green-50');
                }

                fbArea.classList.add('bg-red-50', 'border-red-200', 'text-red-800');

                fbTitle.innerText = "Try Again";
                nextBtn.classList.add('hidden');
            }
            fbMsg.innerText = opt.feedback;

                document.getElementById('simulation-view').classList.add('hidden');

                     border: { top: {style:"thin", color:{rgb:"FDBA74"}}, bottom: {style:"thin", color:{rgb:"FDBA74"}}, left: {style:"thin", color:{rgb:"FDBA74"}}, right: {style:"thin", color:{rgb:"FDBA74"}} }
                 }
             };

             const applyStyle = (ws, range, styleName) => {
                 const rangeObj = XLSX.utils.decode_range(range);
                 for (let R = rangeObj.s.r; R <= rangeObj.e.r; ++R) {
                     for (let C = rangeObj.s.c; C <= rangeObj.e.c; ++C) {
                         const cell_address = XLSX.utils.encode_cell({r:R, c:C});
                         if (!ws[cell_address]) ws[cell_address] = { t: 's', v: '' }; 
                         if (!ws[cell_address].s) ws[cell_address].s = {};
                         Object.assign(ws[cell_address].s, styles[styleName]);
                     }
                 }
             };

             const setCols = (ws, widths) => {
                 ws['!cols'] = widths.map(w => ({wch: w}));
             };

             // 1. Goal Seek Data
             const goalSeekArr = [
                ["GOAL SEEK: BREAK-EVEN ANALYSIS", ""],
                ["Find Quantity to reach Profit $0", ""],
                [],
                ["Item", "Value"],
                ["Price", 50],
                ["Cost", 30],
                ["Quantity", 100],
                ["Fixed Costs", 5000],
                ["Profit", { t: 'n', f: "(B5-B6)*B7 - B8" }] 
             ];
             const wsGoal = XLSX.utils.aoa_to_sheet(goalSeekArr);
             if(wsGoal['A1']) wsGoal['A1'].s = { font: { bold: true, sz: 14, color: { rgb: "BE185D" } } };
             applyStyle(wsGoal, "A4:B4", "header");
             applyStyle(wsGoal, "B7", "input");
             applyStyle(wsGoal, "B9", "objective");
             ["B5", "B6", "B8", "B9"].forEach(ref => { if(wsGoal[ref]) wsGoal[ref].z = "$#,##0"; });
             setCols(wsGoal, [20, 15]);

             // 2. Solver Data
             const solverArr = [
                ["SOLVER: PRODUCT MIX", "", "", "", ""],
                [],
                ["Product", "Standard", "Deluxe", "Total", "Limit"],
                ["Unit Price", 45, 75, "", ""],
                ["Unit Cost", 25, 40, "", ""],
                ["Unit Margin", {t:'n', f:"B4-B5"}, {t:'n', f:"C4-C5"}, "", ""],
                [],

        // --- VISUALS ---
        function animateConfetti() {
            // Simple confetti implementation
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            let w = window.innerWidth;
            let h = window.innerHeight;
            canvas.width = w;
            canvas.height = h;

            const particles = [];
            for(let i=0; i<100; i++) {
                particles.push({
                    x: Math.random()*w, y: Math.random()*h - h,
                    c: ['#f97316', '#ec4899', '#3b82f6'][Math.floor(Math.random()*3)], // Orange, Pink, Blue
                    s: Math.random()*5+2, d: Math.random()*2+1
                });
            }

            function draw() {
                ctx.clearRect(0,0,w,h);
                particles.forEach(p => {
                    p.y += p.d;
                    if(p.y > h) p.y = -10;
                    ctx.fillStyle = p.c;
                    ctx.fillRect(p.x, p.y, p.s, p.s);
                });
                requestAnimationFrame(draw);
            }
            
            window.fireConfetti = () => {
                requestAnimationFrame(draw);
            }
        }

        init();
