<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Alteryx Lesson: Combining Data</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body { -webkit-tap-highlight-color: transparent; }
        
        .target-row {
            outline: 2px solid #ef4444; 
            outline-offset: -1px;
        }
        
        .anim-element {
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .draw-line {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 1s forwards;
        }

        @keyframes draw {
            to {
                stroke-dashoffset: 0;
            }
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 h-screen overflow-hidden flex flex-col">

    <div id="root" class="flex-1 overflow-hidden flex flex-col"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // ==========================================
        // ICON FACTORY
        // ==========================================
        const createIcon = (paths) => ({ size = 24, className = '', strokeWidth = 2 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{ __html: paths }} />
        );

        const Monitor = createIcon('<rect width="20" height="14" x="2" y="3" rx="2" /><line x1="8" x2="16" y1="21" y2="21" /><line x1="12" x2="12" y1="17" y2="21" />');
        const TableIcon = createIcon('<path d="M12 3v18" /><rect width="18" height="18" x="3" y="3" rx="2" /><path d="M3 9h18" /><path d="M3 15h18" />');
        const Trophy = createIcon('<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>');
        const ArrowRight = createIcon('<path d="M5 12h14" /><path d="m12 5 7 7-7 7" />');
        const ArrowDown = createIcon('<path d="M12 5v14" /><path d="m19 12-7 7-7-7" />');
        const Settings = createIcon('<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" />');
        const Info = createIcon('<circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" />');
        const CheckCircle = createIcon('<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>');
        const XCircle = createIcon('<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>');
        const RefreshCw = createIcon('<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>');
        const Link = createIcon('<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" /><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />');
        const Layers = createIcon('<polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" />');
        const Grid = createIcon('<rect width="18" height="18" x="3" y="3" rx="2" /><path d="M3 9h18" /><path d="M9 21V9" />');
        const Network = createIcon('<rect x="16" y="16" width="6" height="6" rx="1" /><rect x="2" y="16" width="6" height="6" rx="1" /><rect x="9" y="2" width="6" height="6" rx="1" /><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3" /><path d="M12 12V8" />');
        const Combine = createIcon('<rect width="8" height="8" x="2" y="8" rx="2"/><rect width="8" height="8" x="14" y="8" rx="2"/><path d="M10 12h4"/>');

        // ==========================================
        // DATA PROCESSING ENGINES
        // ==========================================
        const executeJoin = (left, right, keyLeft, keyRight, joinType) => {
            let j = [];
            let l = [];
            let r = [...right];

            left.forEach(leftRow => {
                const matches = r.filter(rightRow => String(rightRow[keyRight]) === String(leftRow[keyLeft]));
                if (matches.length > 0) {
                    matches.forEach(match => {
                        const { [keyRight]: omit, ...restRight } = match;
                        j.push({ ...leftRow, ...restRight });
                        // Remove from unjoined right list
                        const idx = r.findIndex(item => item === match);
                        if(idx > -1) r.splice(idx, 1);
                    });
                } else {
                    l.push(leftRow);
                }
            });

            // Format padded data for displaying Unions of anchors properly
            const padL = l.map(row => {
                const newRow = { ...row };
                Object.keys(right[0] || {}).filter(c => c !== keyRight).forEach(c => newRow[c] = null);
                return newRow;
            });
            const padR = r.map(row => {
                const mappedRow = {};
                mappedRow[keyLeft] = row[keyRight]; // Align keys visually
                Object.keys(left[0] || {}).filter(c => c !== keyLeft).forEach(c => mappedRow[c] = null);
                Object.keys(row).filter(c => c !== keyRight).forEach(c => mappedRow[c] = row[c]);
                return mappedRow;
            });

            if (joinType === 'Inner (J Anchor)') return j;
            if (joinType === 'Left Unjoined (L Anchor)') return l;
            if (joinType === 'Right Unjoined (R Anchor)') return r;
            if (joinType === 'Left Outer Join (Union L and J)') return [...padL, ...j];
            if (joinType === 'Right Outer Join (Union J and R)') return [...j, ...padR];
            if (joinType === 'Full Outer Join (Union L, J, R)') return [...padL, ...j, ...padR];
            return j;
        };

        const executeUnion = (tables, config) => {
            let result = [];
            if (config === 'Auto Config by Name') {
                tables.forEach(table => {
                    table.forEach(row => {
                        result.push({ ...row });
                    });
                });
                const allKeys = [...new Set(result.flatMap(Object.keys))];
                return result.map(row => {
                    const newRow = {};
                    allKeys.forEach(k => newRow[k] = row.hasOwnProperty(k) ? row[k] : null);
                    return newRow;
                });
            } else if (config === 'Auto Config by Position') {
                const colNames = Object.keys(tables[0][0]);
                tables.forEach(table => {
                    table.forEach(row => {
                        const newRow = {};
                        const values = Object.values(row);
                        colNames.forEach((col, idx) => {
                            newRow[col] = values[idx] !== undefined ? values[idx] : null;
                        });
                        result.push(newRow);
                    });
                });
                return result;
            }
            return result;
        };

        const executeAppend = (target, source) => {
            let result = [];
            target.forEach(tRow => {
                source.forEach(sRow => {
                    result.push({ ...tRow, ...sRow });
                });
            });
            return result;
        };

        const executeJoinMultiple = (tables, key) => {
            if (tables.length === 0) return [];
            let result = [...tables[0]];
            
            for (let i = 1; i < tables.length; i++) {
                const rightTable = tables[i];
                let newResult = [];
                result.forEach(leftRow => {
                    const match = rightTable.find(rRow => String(rRow[key]) === String(leftRow[key]));
                    if (match) {
                        const { [key]: omit, ...restRight } = match;
                        newResult.push({ ...leftRow, ...restRight });
                    }
                });
                result = newResult;
            }
            return result;
        };

        // ==========================================
        // DATASETS (Real world bakery examples)
        // ==========================================
        const BAKERY_DATA = {
            employees: [
                { Emp_ID: 101, Name: 'Alice' },
                { Emp_ID: 102, Name: 'Bob' },
                { Emp_ID: 103, Name: 'Charlie' }
            ],
            roles: [
                { Emp_ID: 102, Dept: 'Kitchen' },
                { Emp_ID: 103, Dept: 'Counter' },
                { Emp_ID: 104, Dept: 'Manager' } // ID 104 does not exist in employees
            ],
            // Union Scenario A: Scrambled Headers
            monOrders: [
                { Date: 'Monday', Sales: 450, Staff: 'Alice' },
                { Date: 'Monday', Sales: 320, Staff: 'Bob' }
            ],
            tueOrdersScrambled: [
                { Staff: 'Charlie', Date: 'Tuesday', Sales: 510 },
                { Sales: 400, Staff: 'Alice', Date: 'Tuesday' }
            ],
            // Union Scenario B: Different Header Names
            tueOrdersDiffNames: [
                { Day: 'Tuesday', Revenue: 510, Employee: 'Charlie' }, 
                { Day: 'Tuesday', Revenue: 400, Employee: 'Alice' }
            ],
            // Append
            menuItems: [
                { Drink: 'Latte' },
                { Drink: 'Cappuccino' }
            ],
            milkOptions: [
                { Milk: 'Whole' },
                { Milk: 'Oat' },
                { Milk: 'Almond' }
            ],
            // Join Multiple - Consistent Attributes
            multipleName: [
                { Cust_ID: 1, Name: 'Alice' },
                { Cust_ID: 2, Name: 'Bob' }
            ],
            multiplePhone: [
                { Cust_ID: 1, Phone: '555-0100' },
                { Cust_ID: 2, Phone: '555-0200' }
            ],
            multipleCity: [
                { Cust_ID: 1, City: 'Seattle' },
                { Cust_ID: 2, City: 'Portland' }
            ]
        };

        // ==========================================
        // VIEW 1: VISUAL METAPHOR
        // ==========================================
        function VisualMetaphorView({ onNext }) {
            const [mode, setMode] = useState('join');
            const [step, setStep] = useState(0);

            useEffect(() => { setStep(0); }, [mode]);

            const nextStep = () => {
                if (mode === 'append' && step < 3) setStep(step + 1);
                else if (mode === 'join' && step < 2) setStep(step + 1);
                else setStep(1);
            };
            const resetStep = () => setStep(0);

            const renderJoinMetaphor = () => {
                return (
                    <div className="relative h-[460px] w-full bg-slate-50 border-2 border-slate-200 rounded-xl overflow-y-auto overflow-x-hidden hide-scrollbar flex flex-col p-4">
                        <div className="text-sm font-bold text-slate-500 bg-white px-3 py-1 rounded-full shadow-sm z-20 self-center mb-2 shrink-0">
                            {step < 2 ? "Alteryx Anchor System: Separating matched and unmatched data" : "Creating an Outer Join requires a Union tool"}
                        </div>
                        
                        <div className={`flex justify-between w-full mt-2 relative transition-all duration-700 ${step === 2 ? 'h-24 opacity-50' : 'flex-1'}`}>
                            {/* Left Input */}
                            <div className="flex flex-col items-center z-10 w-1/2">
                                <div className="text-xs font-bold text-blue-600 mb-2">Input 1 (Employees)</div>
                                <div className={`flex flex-col gap-2 anim-element ${step >= 1 ? 'opacity-0 scale-90' : 'opacity-100'}`}>
                                    <div className="bg-white border-2 border-blue-400 px-3 py-1.5 rounded shadow text-xs font-bold w-40 flex items-center justify-between"><span>Alice</span> <span className="bg-blue-100 text-blue-800 px-1.5 rounded">101</span></div>
                                    <div className="bg-white border-2 border-blue-400 px-3 py-1.5 rounded shadow text-xs font-bold w-40 flex items-center justify-between"><span>Bob</span> <span className="bg-blue-100 text-blue-800 px-1.5 rounded">102</span></div>
                                    <div className="bg-white border-2 border-blue-400 px-3 py-1.5 rounded shadow text-xs font-bold w-40 flex items-center justify-between"><span>Charlie</span> <span className="bg-blue-100 text-blue-800 px-1.5 rounded">103</span></div>
                                </div>
                            </div>

                            {/* Right Input */}
                            <div className="flex flex-col items-center z-10 w-1/2">
                                <div className="text-xs font-bold text-orange-600 mb-2">Input 2 (Roles)</div>
                                <div className={`flex flex-col gap-2 anim-element ${step >= 1 ? 'opacity-0 scale-90' : 'opacity-100'}`}>
                                    <div className="bg-white border-2 border-orange-400 px-3 py-1.5 rounded shadow text-xs font-bold w-40 flex items-center justify-between"><span className="bg-orange-100 text-orange-800 px-1.5 rounded">102</span> <span>Kitchen</span></div>
                                    <div className="bg-white border-2 border-orange-400 px-3 py-1.5 rounded shadow text-xs font-bold w-40 flex items-center justify-between"><span className="bg-orange-100 text-orange-800 px-1.5 rounded">103</span> <span>Counter</span></div>
                                    <div className="bg-white border-2 border-orange-400 px-3 py-1.5 rounded shadow text-xs font-bold w-40 flex items-center justify-between"><span className="bg-orange-100 text-orange-800 px-1.5 rounded">104</span> <span>Manager</span></div>
                                </div>
                            </div>
                        </div>

                        {/* Alteryx Tool Anchors Output */}
                        <div className={`mt-auto flex justify-between gap-4 anim-element relative z-20 ${step >= 1 ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10 pointer-events-none'}`}>
                            
                            {/* Lines connecting L and J to Union block (Step 2) */}
                            {step === 2 && (
                                <svg className="absolute inset-0 w-full h-[150px] pointer-events-none z-0 overflow-visible" style={{ top: '100%' }}>
                                    <path d="M 16.6% 0 C 16.6% 40, 50% 40, 50% 60" fill="none" stroke="#3b82f6" strokeWidth="3" strokeDasharray="5,5" className="draw-line" />
                                    <path d="M 50% 0 L 50% 60" fill="none" stroke="#10b981" strokeWidth="3" strokeDasharray="5,5" className="draw-line" />
                                </svg>
                            )}

                            {/* L Anchor */}
                            <div className={`flex-1 flex flex-col items-center bg-blue-50 border-2 border-blue-200 rounded-lg p-2 transition-all ${step === 2 ? 'shadow-[0_0_15px_rgba(59,130,246,0.5)] border-blue-400' : ''}`}>
                                <div className="w-8 h-8 bg-blue-600 text-white rounded-md font-bold flex items-center justify-center shadow-md mb-2">L</div>
                                <div className="text-[10px] text-slate-500 font-bold mb-2">Unjoined Left</div>
                                <div className="bg-white border border-blue-300 px-2 py-1 rounded shadow-sm text-xs w-full text-center">Alice (101)</div>
                            </div>

                            {/* J Anchor */}
                            <div className={`flex-1 flex flex-col items-center bg-emerald-50 border-2 border-emerald-200 rounded-lg p-2 transition-all ${step === 2 ? 'shadow-[0_0_15px_rgba(16,185,129,0.5)] border-emerald-400' : ''}`}>
                                <div className="w-8 h-8 bg-emerald-600 text-white rounded-md font-bold flex items-center justify-center shadow-md mb-2">J</div>
                                <div className="text-[10px] text-slate-500 font-bold mb-2">Inner Join (Matches)</div>
                                <div className="flex flex-col gap-1 w-full">
                                    <div className="bg-white border border-emerald-300 px-2 py-1 rounded shadow-sm text-[10px] w-full text-center">Bob (102) : Kitchen</div>
                                    <div className="bg-white border border-emerald-300 px-2 py-1 rounded shadow-sm text-[10px] w-full text-center">Charlie (103) : Counter</div>
                                </div>
                            </div>

                            {/* R Anchor */}
                            <div className={`flex-1 flex flex-col items-center bg-orange-50 border-2 border-orange-200 rounded-lg p-2 transition-all ${step === 2 ? 'opacity-30 scale-95' : ''}`}>
                                <div className="w-8 h-8 bg-orange-600 text-white rounded-md font-bold flex items-center justify-center shadow-md mb-2">R</div>
                                <div className="text-[10px] text-slate-500 font-bold mb-2">Unjoined Right</div>
                                <div className="bg-white border border-orange-300 px-2 py-1 rounded shadow-sm text-xs w-full text-center">Manager (104)</div>
                            </div>
                        </div>

                        {/* Union Block & Left Outer Join Result (Step 2) */}
                        <div className={`mt-4 flex flex-col items-center justify-center gap-2 anim-element transition-all duration-700 w-full shrink-0 ${step === 2 ? 'opacity-100 h-auto pb-4' : 'opacity-0 h-0 overflow-hidden'}`}>
                            <div className="bg-slate-700 text-white px-3 py-1 rounded shadow flex items-center gap-2 text-xs font-bold mt-4 z-10 relative">
                                <Layers size={14} /> Union Tool
                            </div>
                            <div className="bg-indigo-50 border-2 border-indigo-300 p-2 rounded-lg w-[60%] flex flex-col items-center shadow-md z-10 relative">
                                <div className="text-[10px] font-bold text-indigo-800 mb-1">Result: Left Outer Join</div>
                                <div className="bg-white border border-indigo-200 px-2 py-0.5 rounded text-[10px] w-full text-center mb-1">Alice (101) : <i className="text-slate-400">Null</i></div>
                                <div className="bg-white border border-indigo-200 px-2 py-0.5 rounded text-[10px] w-full text-center mb-1">Bob (102) : Kitchen</div>
                                <div className="bg-white border border-indigo-200 px-2 py-0.5 rounded text-[10px] w-full text-center">Charlie (103) : Counter</div>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderUnionMetaphor = () => {
                return (
                    <div className="relative h-[360px] w-full bg-slate-50 border-2 border-slate-200 rounded-xl overflow-hidden flex flex-col p-4">
                        <div className="text-sm font-bold text-slate-500 bg-white px-3 py-1 rounded-full shadow-sm z-20 self-center mb-2 shrink-0">
                            Stacking rows vertically
                        </div>
                        
                        <div className="relative flex-1 w-full mt-2">
                            <div className={`anim-element flex flex-col items-center absolute w-[200px] ${step === 1 ? 'top-[15px] left-1/2 -translate-x-1/2' : 'top-[20px] left-[10%]'}`}>
                                <div className="text-xs font-bold text-blue-500 mb-1">Stream 1 (Monday)</div>
                                <div className="bg-blue-100 border-2 border-blue-400 text-blue-800 w-full py-2 rounded shadow text-sm font-bold text-center mb-1">Record A</div>
                                <div className="bg-blue-100 border-2 border-blue-400 text-blue-800 w-full py-2 rounded shadow text-sm font-bold text-center">Record B</div>
                            </div>

                            <div className={`anim-element flex flex-col items-center absolute w-[200px] ${step === 1 ? 'top-[125px] left-1/2 -translate-x-1/2' : 'bottom-[20px] right-[10%]'}`}>
                                <div className={`text-xs font-bold text-orange-500 mb-1 transition-opacity ${step===1?'opacity-0 hidden':'opacity-100'}`}>Stream 2 (Tuesday)</div>
                                <div className="bg-orange-100 border-2 border-orange-400 text-orange-800 w-full py-2 rounded shadow text-sm font-bold text-center mb-1">Record C</div>
                                <div className="bg-orange-100 border-2 border-orange-400 text-orange-800 w-full py-2 rounded shadow text-sm font-bold text-center">Record D</div>
                            </div>

                            {step === 1 && (
                                <div className="absolute top-[0px] left-1/2 -translate-x-1/2 w-[220px] h-[225px] border-4 border-dashed border-emerald-400 rounded-lg anim-element opacity-100 transition-opacity delay-300 pointer-events-none"></div>
                            )}
                        </div>
                    </div>
                );
            };

            const renderAppendMetaphor = () => {
                return (
                    <div className="relative h-[360px] w-full bg-slate-50 border-2 border-slate-200 rounded-xl overflow-hidden flex flex-col p-4 items-center">
                        <div className="text-sm font-bold text-slate-500 bg-white px-3 py-1 rounded-full shadow-sm z-20 shrink-0 mb-4">
                            Cartesian Product: Target rows multiplied by Source rows
                        </div>
                        
                        {/* Step 1 & 2: Top section with Target and Source */}
                        <div className={`relative w-full max-w-lg flex items-center justify-between anim-element transition-all duration-700 ${step === 3 ? 'opacity-0 h-0 overflow-hidden scale-90' : 'opacity-100 h-48 scale-100'}`}>
                            
                            {/* Connecting Lines Overlay */}
                            <svg className="absolute inset-0 w-full h-full pointer-events-none z-0">
                                {step >= 1 && (
                                    <>
                                        <line x1="30%" y1="25%" x2="70%" y2="20%" stroke="#3b82f6" strokeWidth="2" className="draw-line" />
                                        <line x1="30%" y1="25%" x2="70%" y2="50%" stroke="#3b82f6" strokeWidth="2" className="draw-line" />
                                        <line x1="30%" y1="25%" x2="70%" y2="80%" stroke="#3b82f6" strokeWidth="2" className="draw-line" />
                                    </>
                                )}
                                {step >= 2 && (
                                    <>
                                        <line x1="30%" y1="75%" x2="70%" y2="20%" stroke="#8b5cf6" strokeWidth="2" className="draw-line" />
                                        <line x1="30%" y1="75%" x2="70%" y2="50%" stroke="#8b5cf6" strokeWidth="2" className="draw-line" />
                                        <line x1="30%" y1="75%" x2="70%" y2="80%" stroke="#8b5cf6" strokeWidth="2" className="draw-line" />
                                    </>
                                )}
                            </svg>

                            {/* Target Table (2 Rows) */}
                            <div className="flex flex-col justify-center gap-6 h-full z-10 w-[30%]">
                                <div className="text-xs font-bold text-blue-600 text-center">Target (2)</div>
                                <div className={`bg-white border-2 py-2 rounded-lg shadow-md font-bold text-center transition-colors ${step === 1 ? 'border-blue-500 text-blue-700 bg-blue-50' : 'border-slate-300 text-slate-700'}`}>Latte</div>
                                <div className={`bg-white border-2 py-2 rounded-lg shadow-md font-bold text-center transition-colors ${step === 2 ? 'border-purple-500 text-purple-700 bg-purple-50' : 'border-slate-300 text-slate-700'}`}>Cappuccino</div>
                            </div>

                            {/* Source Table (3 Rows) */}
                            <div className="flex flex-col justify-center gap-3 h-full z-10 w-[30%]">
                                <div className="text-xs font-bold text-orange-600 text-center">Source (3)</div>
                                <div className="bg-white border-2 border-orange-300 py-1.5 rounded-lg shadow font-bold text-center text-slate-700">Whole</div>
                                <div className="bg-white border-2 border-orange-300 py-1.5 rounded-lg shadow font-bold text-center text-slate-700">Oat</div>
                                <div className="bg-white border-2 border-orange-300 py-1.5 rounded-lg shadow font-bold text-center text-slate-700">Almond</div>

                            <p className="text-slate-500 mb-6">You scored {score} out of {QUIZ_QUESTIONS.length}.</p>
                            
                            <button onClick={resetQuiz} className="flex justify-center items-center gap-2 w-full px-6 py-4 bg-slate-900 text-white rounded-xl font-bold text-lg hover:bg-slate-800 transition-colors shadow-md">
                                <RefreshCw size={20} /> Restart Lesson
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex-1 flex flex-col p-4 md:p-8 overflow-y-auto bg-slate-50 animate-in fade-in">
                    <div className="max-w-3xl mx-auto w-full">
                        <div className="mb-6 flex justify-between items-center text-sm font-bold text-slate-500">
                            <span>Question {currentQ + 1} of {QUIZ_QUESTIONS.length}</span>
                            <span className="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full border border-emerald-200">Score: {score}</span>
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-6">
                            <div className="bg-slate-800 p-6 md:p-8 text-white">
                                <h2 className="text-lg font-bold leading-relaxed">{question.question}</h2>
                            </div>

                            <div className="p-4 md:p-6 space-y-3">
                                {question.options.map((opt, idx) => {
                                    const isSelected = selectedAnswer === idx;
                                    const isCorrect = idx === question.answer;
                                    
                                    let buttonStyle = "border-slate-200 hover:border-blue-400 hover:bg-blue-50 text-slate-700 bg-white";
                                    let icon = null;

                                    if (isAnswered) {
                                        if (isCorrect) {
                                            buttonStyle = "border-emerald-500 bg-emerald-50 text-emerald-800 shadow-sm";
                                            icon = <CheckCircle size={20} className="text-emerald-500 shrink-0" />;
                                        } else if (isSelected) {
                                            buttonStyle = "border-red-400 bg-red-50 text-red-700";
                                            icon = <XCircle size={20} className="text-red-500 shrink-0" />;
                                        } else {
                                            buttonStyle = "border-slate-100 bg-slate-50 text-slate-400 opacity-50";
                                        }
                                    } else if (isSelected) {
                                        buttonStyle = "border-blue-500 bg-blue-50 text-blue-800";
                                    }

                                    return (
                                        <button 
                                            key={idx}
                                            onClick={() => handleOptionClick(idx)}
                                            disabled={isAnswered}
                                            className={`w-full flex items-center justify-between p-4 rounded-xl border-2 font-semibold text-left transition-all ${buttonStyle} ${!isAnswered ? 'cursor-pointer' : 'cursor-default'}`}
                                        >
                                            <span className="flex-1 pr-4 leading-relaxed text-sm">{opt}</span>
                                            {icon}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        {isAnswered && (
                            <div className="animate-in slide-in-from-bottom-4 fade-in duration-300">
                                <div className={`p-5 rounded-xl mb-6 flex items-start gap-3 shadow-sm border ${
                                    selectedAnswer === question.answer ? 'bg-emerald-50 border-emerald-200' : 'bg-red-50 border-red-200'
                                }`}>
                                    <Info className={`shrink-0 mt-0.5 ${selectedAnswer === question.answer ? 'text-emerald-600' : 'text-red-500'}`} size={20} />
                                    <p className={`font-medium text-sm leading-relaxed ${selectedAnswer === question.answer ? 'text-emerald-900' : 'text-red-900'}`}>
                                        {question.explanation}
                                    </p>
                                </div>
                                <button onClick={nextQuestion} className="w-full flex justify-center items-center gap-2 px-6 py-4 bg-slate-900 text-white rounded-xl font-bold text-lg hover:bg-slate-800 transition-all shadow-md">
                                    {currentQ < QUIZ_QUESTIONS.length - 1 ? "Next Question" : "View Results"} <ArrowRight size={20} />
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ==========================================
        // ROOT APP COMPONENT
        // ==========================================
        function App() {
            const [activeView, setActiveView] = useState('visual'); 

            return (
                <div className="h-full w-full flex flex-col font-sans">
                    {/* Top Navigation */}
                    <div className="bg-slate-900 p-3 flex justify-center gap-2 shadow-md z-50 shrink-0">
                        <button onClick={() => setActiveView('visual')} className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-bold transition-all ${activeView === 'visual' ? 'bg-blue-600 text-white shadow-inner scale-105' : 'bg-slate-800 hover:bg-slate-700 text-slate-300'}`}>
                            <Monitor size={16} /> <span className="hidden sm:inline">1. </span>Concept
                        </button>
                        <button onClick={() => setActiveView('data')} className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-bold transition-all ${activeView === 'data' ? 'bg-blue-600 text-white shadow-inner scale-105' : 'bg-slate-800 hover:bg-slate-700 text-slate-300'}`}>
                            <TableIcon size={16} /> <span className="hidden sm:inline">2. </span>Data
                        </button>
                        <button onClick={() => setActiveView('quiz')} className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-bold transition-all ${activeView === 'quiz' ? 'bg-emerald-600 text-white shadow-inner scale-105' : 'bg-slate-800 hover:bg-slate-700 text-slate-300'}`}>
                            <Trophy size={16} /> <span className="hidden sm:inline">3. </span>Quiz
                        </button>
                    </div>

                    {/* Main Container */}
                    <div className="flex-1 flex flex-col relative w-full min-h-0">
                        {activeView === 'visual' && <VisualMetaphorView onNext={() => setActiveView('data')} />}
                        {activeView === 'data' && <DataWorkflowView onNext={() => setActiveView('quiz')} />}
                        {activeView === 'quiz' && <QuizView />}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
