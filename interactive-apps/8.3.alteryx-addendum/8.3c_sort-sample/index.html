        const Trophy = createIcon('<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>');
        const CheckCircle = createIcon('<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>');

        const RefreshCw = createIcon('<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>');

        // ==========================================
        // PART 1: VISUAL METAPHOR DATA & CONFIG
        // ==========================================
        const GROCERIES = [
        { id: 1, aisle: 'Fresh', type: 'Meal', name: 'Artisan Pizza', price: 6, Icon: Star, color: 'text-blue-600', bg: 'bg-blue-100' },
        { id: 2, aisle: 'Fresh', type: 'Meal', name: 'Basic Slice', price: 4, Icon: Star, color: 'text-blue-600', bg: 'bg-blue-100' },
        { id: 3, aisle: 'Fresh', type: 'Snack', name: 'Honey Apple', price: 5, Icon: Heart, color: 'text-orange-500', bg: 'bg-orange-100' },
        { id: 4, aisle: 'Fresh', type: 'Snack', name: 'Basic Apple', price: 2, Icon: Heart, color: 'text-orange-500', bg: 'bg-orange-100' },
        { id: 5, aisle: 'Pantry', type: 'Meal', name: 'Truffle Pasta', price: 7, Icon: Package, color: 'text-blue-600', bg: 'bg-blue-100' },
        { id: 6, aisle: 'Pantry', type: 'Meal', name: 'Ramen Box', price: 3, Icon: Package, color: 'text-blue-600', bg: 'bg-blue-100' },
        { id: 7, aisle: 'Pantry', type: 'Snack', name: 'Fancy Croissant', price: 8, Icon: Coffee, color: 'text-orange-500', bg: 'bg-orange-100' },
        { id: 8, aisle: 'Pantry', type: 'Snack', name: 'Mini Croissant', price: 2, Icon: Coffee, color: 'text-orange-500', bg: 'bg-orange-100' },
        ];

        const UNSORTED_IDS = [6, 3, 7, 1, 8, 2, 5, 4];

        const VISUAL_SCENARIOS = {
        'none': {
            label: 'No Grouping',
            groupFields: [],
            sortRules: 'price',
            sortText: 'The belt sorts purely by Price (tallest stack first), completely ignoring the Aisles and Types.',
            sampleText: 'Scanning left-to-right for the SINGLE most expensive item overall. It stops instantly at the Fancy Croissant.'
        },
        'aisle': {
            label: 'Group by Aisle Only',
            groupFields: ['aisle'],
            sortRules: 'aisle-price',
            sortText: 'The belt organizes by Aisle first (Fresh, then Pantry), then sorts by Price within those sections.',
            sampleText: 'Scanning left-to-right. It selects the most expensive item in the Fresh section, and the most expensive item in the Pantry section.'
        },
        'type': {
            label: 'Group by Item Type Only',
            groupFields: ['type'],
            sortRules: 'type-price', 
            sortText: 'The belt organizes by Item Type first (Blue Meals, then Orange Snacks), then sorts by Price within those sections.',
            sampleText: 'Scanning left-to-right. It selects the single most expensive Meal, and the single most expensive Snack overall.'
        },
        'both': {
            label: 'Group by Both (Aisle & Type)',
            groupFields: ['aisle', 'type'],
            sortRules: 'aisle-type-price',
            sortText: 'The belt organizes into strict clusters: Fresh Meals, Fresh Snacks, Pantry Meals, Pantry Snacks. Each cluster has its most expensive item at the front.',
            sampleText: 'Scanning for every unique combination. It picks the leader of all four packs!'
        }
        };

        // ==========================================
        // PART 2: DATA WORKFLOW DATA & ENGINES
        // ==========================================
        // Data updated to be completely symmetrical!
        const RAW_DATA = [
        { id: 1, year: 2023, quarter: 'Q1', category: 'Electronics', sales: 4500 },
        { id: 2, year: 2023, quarter: 'Q1', category: 'Furniture', sales: 1200 },
        { id: 3, year: 2023, quarter: 'Q1', category: 'Clothing', sales: 850 },
        { id: 4, year: 2023, quarter: 'Q2', category: 'Electronics', sales: 3200 },
        { id: 5, year: 2023, quarter: 'Q2', category: 'Furniture', sales: 1800 },
        { id: 6, year: 2023, quarter: 'Q2', category: 'Clothing', sales: 900 },
        { id: 7, year: 2023, quarter: 'Q3', category: 'Electronics', sales: 5100 },
        { id: 8, year: 2023, quarter: 'Q3', category: 'Furniture', sales: 2100 },
        { id: 9, year: 2023, quarter: 'Q3', category: 'Clothing', sales: 1100 },
        { id: 10, year: 2024, quarter: 'Q1', category: 'Electronics', sales: 2100 },
        { id: 11, year: 2024, quarter: 'Q1', category: 'Furniture', sales: 6400 },
        { id: 12, year: 2024, quarter: 'Q1', category: 'Clothing', sales: 1500 },
        { id: 13, year: 2024, quarter: 'Q2', category: 'Electronics', sales: 1500 },
        { id: 14, year: 2024, quarter: 'Q2', category: 'Furniture', sales: 5100 },
        { id: 15, year: 2024, quarter: 'Q2', category: 'Clothing', sales: 1100 },
        { id: 16, year: 2024, quarter: 'Q3', category: 'Electronics', sales: 2500 },
        { id: 17, year: 2024, quarter: 'Q3', category: 'Furniture', sales: 3200 },
        { id: 18, year: 2024, quarter: 'Q3', category: 'Clothing', sales: 1400 }
        ];

        const COLUMNS = ['year', 'quarter', 'category', 'sales'];

        const processSummarize = (data, config) => {
        const groupFields = config.groupFields || [];
        if (groupFields.length === 0) return data; 
        const groups = {};
        data.forEach(row => {
            const key = groupFields.map(f => row[f]).join('|');
            if (!groups[key]) {
            groups[key] = { Total_Sales: 0 };
            groupFields.forEach(f => groups[key][f] = row[f]);
            }
            groups[key].Total_Sales += Number(row.sales || row.Total_Sales || 0);
        });
        return Object.values(groups);
        };

        const processSort = (data, config) => {
        if (data.length === 0) return data;
        const { sort1, sort2, sort3 } = config;
        
        return [...data].sort((a, b) => {
            const checks = [sort1, sort2, sort3];
            for (let sortRule of checks) {
            if (sortRule && sortRule.field && sortRule.field !== 'None') {
                let valA = a[sortRule.field];
                let valB = b[sortRule.field];
                if (valA !== valB) {
                let comp = 0;
                if (typeof valA === 'string' && typeof valB === 'string') comp = valA.localeCompare(valB);
                else comp = (valA || 0) - (valB || 0);
                return sortRule.order === 'Asc' ? comp : -comp;
                }
            }
            }
            return 0;
        });
        };

        const processSample = (data, config) => {
        const n = parseInt(config.nRows, 10);
        const groupFields = config.groupFields || [];
        if (isNaN(n) || n <= 0) return data;
        if (groupFields.length === 0) return data.slice(0, n);

        const groups = {};
        data.forEach(row => {
            const key = groupFields.map(f => row[f]).join('|');
            if (!groups[key]) groups[key] = [];
            if (groups[key].length < n) groups[key].push(row);
        });
        return Object.values(groups).flat();
        };

        const executeTool = (data, tool) => {
        if (tool.type === 'Summarize') return processSummarize(data, tool.config);
        if (tool.type === 'Sort Data') return processSort(data, tool.config);
        if (tool.type === 'Sample') return processSample(data, tool.config);
        return data;
        };

        // Helper function to figure out WHICH indices the Sample tool will pick from the sorted array
        const getSampledIndices = (data, config) => {
            const n = parseInt(config.nRows, 10);
            const groupFields = config.groupFields || [];
            const indices = new Set();
            if (isNaN(n) || n <= 0) return indices;
            if (groupFields.length === 0) {
                for (let i = 0; i < n && i < data.length; i++) indices.add(i);
                return indices;
            }
            const groups = {};
            data.forEach((row, i) => {
                const key = groupFields.map(f => row[f]).join('|');
                if (!groups[key]) groups[key] = 0;
                if (groups[key] < n) {
                    groups[key]++;
                    indices.add(i);
                }
            });
            return indices;
        };

        // ==========================================
        // QUIZ DATA
        // ==========================================
        const QUIZ_QUESTIONS = [
        {
            question: "You want to find the highest-paid employee in each Department. Which configuration gives you the correct result?",
            dataHeaders: ['Department', 'Employee', 'Salary'],
            dataRows: [
                ['HR', 'Alice', '$60k'],
                ['HR', 'Bob', '$90k'],
                ['IT', 'Carol', '$85k']
            ],
            options: [
            "[Sort] Dept: Asc,  Salary: Desc ➔ [Sample] N=1, Group: Dept",
            "[Sort] Dept: Asc,  Salary: Asc  ➔ [Sample] N=1, Group: Dept",
            "[Sort] Salary: Desc, Dept: None ➔ [Sample] N=1, Group: Dept"
            ],
            answer: 0,
            explanation: "Correct! You must sort by the grouping field (Department) to cluster the data, AND the metric (Salary Descending) to put the highest at the top of each cluster, before using the Sample tool."
        },
        {
            question: "How do you correctly configure the tools to find the SINGLE fastest car for each Make?",
            dataHeaders: ['Make', 'Model', 'Top_Speed'],
            dataRows: [
                ['Ford', 'Mustang', '155'],
                ['Honda', 'Civic', '130'],
                ['Ford', 'Focus', '120']
            ],
            options: [
            "[Sort] Make: None, Speed: None ➔ [Sample] N=1, Group: Make",
            "[Sort] Make: Asc,  Speed: Desc ➔ [Sample] N=1, Group: Make",
            "[Sort] Make: Asc,  Speed: Asc  ➔ [Sample] N=1, Group: Make"
            ],
            answer: 1,
            explanation: "Exactly right! Sorting by Make clusters them, and Sorting by Speed (Desc) puts the fastest at the top. The first option is the classic 'gotcha' where you forget to sort, giving you random results!"
        },
        {
            question: "You want the most expensive ticket for EVERY Genre at EVERY Theater. How should you set up the tools?",
            dataHeaders: ['Theater', 'Genre', 'Price'],
            dataRows: [
                ['AMC', 'Action', '$15'],
                ['AMC', 'Action', '$18'],
                ['AMC', 'Comedy', '$12']
            ],
            options: [
            "[Sort] Theater: Asc, Genre: Asc, Price: Desc ➔ [Sample] N=1, Group: Theater",
            "[Sort] Theater: Asc, Genre: Asc, Price: Desc ➔ [Sample] N=1, Group: Genre  ",
            "[Sort] Theater: Asc, Genre: Asc, Price: Desc ➔ [Sample] N=1, Group: Both   "
            ],
            answer: 2,
            explanation: "Nailed it! To get the top item for every unique combination, you must select both fields in the Sample tool's Group By configuration."
        }
        ];


        // ==========================================
        // SUB-COMPONENTS
        // ==========================================
        const PriceStack = ({ height }) => (
        <div className="flex flex-col-reverse gap-[3px] h-20 justify-start items-center">
            {Array.from({ length: height }).map((_, i) => (
            <div key={i} className="w-5 md:w-6 h-1.5 bg-emerald-400 rounded-sm border border-emerald-600 shadow-[0_1px_2px_rgba(0,0,0,0.2)]" />
            ))}
        </div>
        );

        const GroceryCard = ({ item, isSampled, isFaded }) => {
        const { Icon, color, bg } = item;
        return (
            <div className={`flex flex-col items-center p-2 md:p-3 rounded-xl border-2 w-24 md:w-28 shrink-0 bg-white transition-all duration-700 ease-in-out ${
            isSampled ? 'border-emerald-500 shadow-[0_0_20px_rgba(16,185,129,0.6)] scale-110 z-30' : 'border-slate-200 shadow-sm z-10'
            } ${isFaded ? 'opacity-20 grayscale scale-90' : 'opacity-100'}`}>
            <div className="w-full flex justify-between items-center mb-2">
                <span className="text-[8px] md:text-[9px] font-bold text-slate-400 uppercase tracking-widest">{item.aisle}</span>
                <span className={`text-[8px] md:text-[9px] font-bold px-1.5 py-0.5 rounded-sm ${bg} ${color}`}>{item.type}</span>
            </div>
            <div className="flex items-end gap-1 md:gap-2 h-20 mt-1">
                <Icon size={24} className={`md:w-7 md:h-7 ${color} mb-0.5`} strokeWidth={2} />
                <PriceStack height={item.price} />
            </div>
            <span className="text-[10px] md:text-[11px] font-bold text-slate-700 mt-4 text-center leading-tight h-8 flex items-center">{item.name}</span>
            </div>
        );
        };

        // ==========================================
        // VIEW 1: THE VISUAL METAPHOR
        // ==========================================
        function VisualMetaphorView({ onNext }) {
        const [activeScenarioKey, setActiveScenarioKey] = useState('none');
        const [workflowStep, setWorkflowStep] = useState(0); 
        
        const activeScenario = VISUAL_SCENARIOS[activeScenarioKey];

        const sortedData = useMemo(() => {
            let sorted = [...GROCERIES];
            if (activeScenario.sortRules === 'price') {
            sorted.sort((a, b) => b.price - a.price);
            } else if (activeScenario.sortRules === 'aisle-price') {
            sorted.sort((a, b) => {
                if (a.aisle < b.aisle) return -1;
                if (a.aisle > b.aisle) return 1;
                return b.price - a.price; 
            });
            } else if (activeScenario.sortRules === 'type-price') {
            sorted.sort((a, b) => {
                if (a.type < b.type) return -1;
                if (a.type > b.type) return 1;
                return b.price - a.price; 
            });
            } else if (activeScenario.sortRules === 'aisle-type-price') {
            sorted.sort((a, b) => {
                if (a.aisle < b.aisle) return -1;
                if (a.aisle > b.aisle) return 1;
                if (a.type < b.type) return -1;
                if (a.type > b.type) return 1;
                return b.price - a.price; 
            });
            }
            return sorted;
        }, [activeScenario.sortRules]);

        const sampledItemIds = useMemo(() => {
            if (activeScenario.groupFields.length === 0) return [sortedData[0].id];
            const collectedIds = [];
            const seenGroups = new Set();
            sortedData.forEach(item => {
            const groupKey = activeScenario.groupFields.map(field => item[field]).join('-');
            if (!seenGroups.has(groupKey)) {
                seenGroups.add(groupKey);
                collectedIds.push(item.id);
            }
            });
            return collectedIds;
        }, [sortedData, activeScenario.groupFields]);

        const handleScenarioChange = (key) => {
            setActiveScenarioKey(key);
            setWorkflowStep(0); 
        };

        const [isMobile, setIsMobile] = useState(false);
        useEffect(() => {
            const checkMobile = () => setIsMobile(window.innerWidth < 768);
            checkMobile();
            window.addEventListener('resize', checkMobile);
            return () => window.removeEventListener('resize', checkMobile);
        }, []);

        const ITEM_WIDTH = isMobile ? 96 : 112; 
        const GAP = isMobile ? 12 : 16;         
        const TOTAL_SLOT_WIDTH = ITEM_WIDTH + GAP;

        return (
            <div className="max-w-6xl mx-auto space-y-4 md:space-y-6 pb-12 animate-in fade-in duration-500 p-2 sm:p-4">
            
            <div className="bg-white p-4 md:p-6 rounded-2xl border border-slate-200 shadow-sm mt-2 md:mt-4">
                <h1 className="text-xl md:text-2xl font-bold text-slate-900 mb-2 flex items-center gap-2">
                <ShoppingCart className="text-emerald-500" />
                The Live Sorting Conveyor Belt
                </h1>
                <p className="text-sm md:text-base text-slate-500 mb-4 md:mb-6">
                See exactly how sorting affects grouping. Note how the items are color-coded by their Type.
                </p>
                <div className="flex flex-col sm:flex-row flex-wrap gap-2 md:gap-3">
                {Object.entries(VISUAL_SCENARIOS).map(([key, scenario]) => (
                    <button
                    key={key}
                    onClick={() => handleScenarioChange(key)}
                    className={`flex-1 sm:flex-none px-3 py-2 md:px-4 md:py-2.5 rounded-xl text-xs md:text-sm font-semibold transition-all border-2 ${

        // ==========================================

        const [pipeline, setPipeline] = useState([

        const results = useMemo(() => {
            const res = [RAW_DATA];
            let currentData = RAW_DATA;
            pipeline.forEach(tool => {
            if (tool.type !== 'None') currentData = executeTool(currentData, tool);
            res.push(currentData);
            });
            return res;

        // Calculate EXACTLY which indices from Step 2 will be grabbed by Step 3

            if (viewStepId !== 2) return new Set();

        const updateToolType = (stepId, newType) => {
            setPipeline(prev => prev.map(step => {
            if (step.id === stepId) {
                let defaultConfig = {};

                if (newType === 'Sort Data') defaultConfig = { sort1: { field: 'None', order: 'Asc' }, sort2: { field: 'None', order: 'Desc' }, sort3: { field: 'None', order: 'Desc' } };
                if (newType === 'Sample') defaultConfig = { nRows: 1, groupFields: [] }; 
                return { ...step, type: newType, config: defaultConfig };
            }
            return step;
            }));
        };

        const updateToolConfig = (stepId, key, value) => {
            setPipeline(prev => prev.map(step => {
            if (step.id === stepId) return { ...step, config: { ...step.config, [key]: value } };
            return step;
            }));

                    { sort1: { field: 'year', order: 'Asc' }, sort2: { field: 'Total_Sales', order: 'Desc' } },

                    { sort1: { field: 'category', order: 'Asc' }, sort2: { field: 'Total_Sales', order: 'Desc' } },

                        {step.type !== 'None' && (
                        <div className="mt-3 pt-3 border-t border-slate-200 space-y-3">

                                <div className="space-y-1.5">
                                {getAvailableColumns(index).filter(c => c !== 'sales').map(c => (
                                    <button key={c} onClick={(e) => { e.stopPropagation(); toggleCheckboxField(step.id, c, 'groupFields', step.config.groupFields || []); }} className="flex items-center gap-2 text-xs w-full hover:bg-slate-100 p-1 rounded font-medium">
                                    {(step.config.groupFields || []).includes(c) ? <CheckSquare size={14} className="text-blue-600" /> : <Square size={14} className="text-slate-400" />}

                                <div className="space-y-1.5">

                                    <button key={c} onClick={(e) => { e.stopPropagation(); toggleCheckboxField(step.id, c, 'groupFields', step.config.groupFields || []); }} className="flex items-center gap-2 text-xs w-full hover:bg-slate-100 p-1 rounded font-medium">
                                        {(step.config.groupFields || []).includes(c) ? <CheckSquare size={14} className="text-blue-600" /> : <Square size={14} className="text-slate-400" />}

                        {getToolIcon(step.type)} {step.type !== 'None' ? `${idx + 1}. ${step.type.trim()}` : `Step ${idx + 1}`}
                    </button>

                {viewStepId === 2 && (

                {viewStepId === 3 && (

                    <Info className="text-blue-600 shrink-0 mt-0.5" size={16} />

                    </div>
                )}

                <div className="flex-1 bg-white border border-slate-300 rounded-lg shadow-sm overflow-hidden flex flex-col relative">
                    {results[viewStepId].length === 0 ? (
                    <div className="absolute inset-0 flex items-center justify-center text-slate-400 font-medium text-sm">No data available.</div>

        // ==========================================

        function QuizView() {
            const [currentQ, setCurrentQ] = useState(0);
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [isAnswered, setIsAnswered] = useState(false);
            const [score, setScore] = useState(0);
            const [quizComplete, setQuizComplete] = useState(false);

            const question = QUIZ_QUESTIONS[currentQ];

            const handleOptionClick = (index) => {
                if (isAnswered) return;
                setSelectedAnswer(index);
                setIsAnswered(true);
                if (index === question.answer) {
                    setScore(prev => prev + 1);
                }
            };

            const nextQuestion = () => {
                if (currentQ < QUIZ_QUESTIONS.length - 1) {
                    setCurrentQ(prev => prev + 1);
                    setSelectedAnswer(null);
                    setIsAnswered(false);
                } else {
                    setQuizComplete(true);
                }
            };

            const resetQuiz = () => {
                setCurrentQ(0);
                setSelectedAnswer(null);
                setIsAnswered(false);
                setScore(0);
                setQuizComplete(false);
            };

            if (quizComplete) {
                return (
                    <div className="flex-1 flex flex-col items-center justify-center p-4 animate-in fade-in zoom-in duration-500">
                        <div className="bg-white p-8 rounded-3xl shadow-xl border border-slate-200 text-center max-w-md w-full">
                            <div className="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                <Trophy size={40} className="text-emerald-500" />
                            </div>
                            <h2 className="text-3xl font-bold text-slate-900 mb-2">Quiz Complete!</h2>
                            <p className="text-slate-500 mb-6">You scored {score} out of {QUIZ_QUESTIONS.length}.</p>
                            
                            <button 
                                onClick={resetQuiz}
                                className="flex justify-center items-center gap-2 w-full px-6 py-4 bg-slate-900 text-white rounded-xl font-bold text-lg hover:bg-slate-800 transition-colors shadow-md"
                            >
                                <RefreshCw size={20} /> Retake Quiz
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex-1 flex flex-col p-4 md:p-8 overflow-y-auto bg-slate-50 animate-in fade-in duration-500">
                    <div className="max-w-3xl mx-auto w-full">
                        <div className="mb-6 flex justify-between items-center text-sm font-bold text-slate-500">
                            <span>Question {currentQ + 1} of {QUIZ_QUESTIONS.length}</span>
                            <span className="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full">Score: {score}</span>
                        </div>

                        <div className="bg-white rounded-3xl shadow-md border border-slate-200 overflow-hidden mb-6">
                            <div className="bg-slate-800 p-6 md:p-8 text-white">
                                <h2 className="text-xl md:text-2xl font-bold leading-relaxed">{question.question}</h2>
                            </div>
                            
                            <div className="p-6 pb-2 border-b border-slate-100 bg-slate-50/50">
                                <div className="mb-2 text-xs font-bold text-slate-500 uppercase tracking-wider">Example Data:</div>
                                <div className="overflow-x-auto rounded border border-slate-200 shadow-sm">
                                    <table className="w-full text-left text-sm whitespace-nowrap bg-white">
                                        <thead className="bg-slate-100 border-b border-slate-200">
                                            <tr>
                                                {question.dataHeaders.map(h => <th key={h} className="px-4 py-2 font-bold text-slate-700">{h}</th>)}
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {question.dataRows.map((row, i) => (
                                                <tr key={i}>
                                                    {row.map((c, j) => <td key={j} className="px-4 py-2 text-slate-600 font-mono text-xs">{c}</td>)}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            <div className="p-4 md:p-6 space-y-3">
                                {question.options.map((opt, idx) => {
                                    const isSelected = selectedAnswer === idx;
                                    const isCorrect = idx === question.answer;
                                    
                                    let buttonStyle = "border-slate-200 hover:border-blue-400 hover:bg-blue-50 text-slate-700 bg-white";
                                    let icon = null;

                                    if (isAnswered) {
                                        if (isCorrect) {
                                            buttonStyle = "border-emerald-500 bg-emerald-50 text-emerald-800 shadow-sm";
                                            icon = <CheckCircle size={20} className="text-emerald-500 shrink-0" />;
                                        } else if (isSelected) {
                                            buttonStyle = "border-red-400 bg-red-50 text-red-700";
                                            icon = <XCircle size={20} className="text-red-500 shrink-0" />;
                                        } else {
                                            buttonStyle = "border-slate-100 bg-slate-50 text-slate-400 opacity-50";
                                        }
                                    } else if (isSelected) {
                                        buttonStyle = "border-blue-500 bg-blue-50 text-blue-800";
                                    }

                                    return (
                                        <button 
                                            key={idx}
                                            onClick={() => handleOptionClick(idx)}
                                            disabled={isAnswered}
                                            className={`w-full flex items-center justify-between p-4 rounded-xl border-2 font-semibold text-left transition-all ${buttonStyle} ${!isAnswered ? 'cursor-pointer' : 'cursor-default'}`}
                                        >
                                            <span className="flex-1 pr-4 leading-relaxed font-mono text-xs md:text-sm whitespace-pre-wrap">{opt}</span>
                                            {icon}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        {isAnswered && (
                            <div className="animate-in slide-in-from-bottom-4 fade-in duration-300">
                                <div className={`p-5 md:p-6 rounded-2xl mb-6 flex items-start gap-3 shadow-sm border ${
                                    selectedAnswer === question.answer 
                                    ? 'bg-emerald-50 border-emerald-200' 
                                    : 'bg-red-50 border-red-200'
                                }`}>
                                    <Info className={`shrink-0 mt-0.5 ${selectedAnswer === question.answer ? 'text-emerald-600' : 'text-red-500'}`} size={24} />
                                    <p className={`font-medium text-sm md:text-base leading-relaxed ${selectedAnswer === question.answer ? 'text-emerald-900' : 'text-red-900'}`}>
                                        {question.explanation}
                                    </p>
                                </div>
                                <button 
                                    onClick={nextQuestion}
                                    className="w-full flex justify-center items-center gap-2 px-6 py-4 bg-slate-900 text-white rounded-xl font-bold text-lg hover:bg-slate-800 transition-all shadow-md hover:shadow-lg"
                                >
                                    {currentQ < QUIZ_QUESTIONS.length - 1 ? "Next Question" : "Finish Quiz"} <ArrowRight size={20} />
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ==========================================
        // ROOT APP
        // ==========================================
        function App() {
        const [activeView, setActiveView] = useState('visual'); 

        return (
            <div className="h-screen w-full flex flex-col bg-slate-100 font-sans overflow-hidden">
            <div className="bg-slate-900 text-white p-2 md:p-3 flex flex-wrap justify-center gap-1.5 md:gap-3 shadow-md relative z-50 shrink-0">
                <button 
                onClick={() => setActiveView('visual')}
                className={`flex items-center gap-1.5 md:gap-2 px-3 py-2 md:px-5 md:py-2.5 rounded-lg md:rounded-xl text-xs md:text-sm font-bold transition-all ${
                    activeView === 'visual' ? 'bg-blue-600 text-white shadow-inner md:scale-105' : 'bg-slate-800 hover:bg-slate-700 text-slate-300'
                }`}
                >
                <Monitor size={16} />
                <span className="hidden sm:inline">1. </span>Concept
                </button>
                <button 
                onClick={() => setActiveView('data')}
                className={`flex items-center gap-1.5 md:gap-2 px-3 py-2 md:px-5 md:py-2.5 rounded-lg md:rounded-xl text-xs md:text-sm font-bold transition-all ${
                    activeView === 'data' ? 'bg-blue-600 text-white shadow-inner md:scale-105' : 'bg-slate-800 hover:bg-slate-700 text-slate-300'
                }`}
                >
                <Table size={16} />
                <span className="hidden sm:inline">2. </span>Data
                </button>
                <button 
                onClick={() => setActiveView('quiz')}
                className={`flex items-center gap-1.5 md:gap-2 px-3 py-2 md:px-5 md:py-2.5 rounded-lg md:rounded-xl text-xs md:text-sm font-bold transition-all ${
                    activeView === 'quiz' ? 'bg-emerald-500 text-white shadow-inner md:scale-105' : 'bg-slate-800 hover:bg-slate-700 text-slate-300'
                }`}
                >
                <Trophy size={16} />
                <span className="hidden sm:inline">3. </span>Quiz
                </button>
            </div>

            <div className="flex-1 overflow-y-auto flex flex-col relative w-full">
                {activeView === 'visual' && <VisualMetaphorView onNext={() => setActiveView('data')} />}
                {activeView === 'data' && <DataWorkflowView onNext={() => setActiveView('quiz')} />}
                {activeView === 'quiz' && <QuizView />}
            </div>
            </div>
        );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
