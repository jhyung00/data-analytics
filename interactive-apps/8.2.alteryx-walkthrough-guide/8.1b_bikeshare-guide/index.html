<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bikeshare Data Cleansing Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#0f172a',
            slatebg: '#e2e8f0',
            panel: '#ffffff',
            soft: '#f8fafc',
            line: '#cbd5e1',
            blue: '#2563eb',
            teal: '#0f766e',
            amber: '#d97706',
            green: '#16a34a'
          },
          boxShadow: {
            game: '5px 5px 0px rgba(15,23,42,1)',
            gameSm: '3px 3px 0px rgba(15,23,42,1)'
          },
          fontFamily: {
            sans: ['Nunito','system-ui','sans-serif'],
            mono: ['JetBrains Mono','monospace']
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --ink:#0f172a;
      --line:#cbd5e1;
      --soft:#f8fafc;
      --panel:#ffffff;
      --blue:#2563eb;
      --teal:#0f766e;
      --amber:#d97706;
      --green:#16a34a;
    }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; font-family:'Nunito', system-ui, sans-serif; color:var(--ink); background:#cbd5e1; }
    body {
      background-image:
        radial-gradient(#3b82f6 1.2px, transparent 1.2px),
        radial-gradient(#3b82f6 1.2px, transparent 1.2px);
      background-size:36px 36px;
      background-position:0 0, 18px 18px;
    }
    .app-shell {
      width:min(1500px, 96vw);
      height:min(94vh, 980px);
      margin:3vh auto;
      background:#fff;
      border:3px solid var(--ink);
      border-radius:24px;
      overflow:hidden;
      box-shadow:8px 8px 0 rgba(15,23,42,1);
      display:flex;
    }
    .sidebar {
      width:310px;
      min-width:240px;
      max-width:50vw;
      resize:horizontal;
      overflow-x:hidden;
      overflow-y:auto;
      background:var(--ink);
      color:#fff;
      display:flex;
      flex-direction:column;
      border-right:3px solid var(--ink);
      flex-shrink:0;
    }
    .brand {
      padding:28px 24px 22px;
      border-bottom:3px solid rgba(255,255,255,.08);
    }
    .brand .badge {
      display:inline-flex;
      align-items:center;
      gap:8px;
      background:#dbeafe;
      color:#1e3a8a;
      border:2px solid var(--ink);
      border-radius:999px;
      font-size:12px;
      font-weight:900;
      padding:6px 12px;
      margin-bottom:14px;
    }
    .brand h1 {
      margin:0;
      font-size:28px;
      line-height:1.05;
      font-weight:900;
      letter-spacing:-.03em;
    }
    .brand p {
      margin:10px 0 0;
      color:#cbd5e1;
      font-weight:700;
      line-height:1.45;
      font-size:14px;
    }
    .nav {
      padding:14px 10px 18px;
      overflow:auto;
    }
    .nav button {
      width:100%;
      border:none;
      background:transparent;
      color:#cbd5e1;
      display:flex;
      align-items:center;
      gap:12px;
      padding:13px 14px;
      border-radius:14px;
      font-weight:800;
      font-size:15px;
      text-align:left;
      cursor:pointer;
      transition:all .15s ease;
      border-left:5px solid transparent;
    }
    .nav button:hover {
      background:rgba(255,255,255,.08);
      color:#fff;
    }
    .nav button.active {
      background:#8b5cf6;
      color:#fff;
      border-left-color:#fff;
      box-shadow:3px 3px 0 rgba(255,255,255,.18) inset;
    }
    .sidebar-footer {
      margin-top:auto;
      padding:16px 18px 20px;
      border-top:3px solid rgba(255,255,255,.08);
    }
    .lock-btn {
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:12px 16px;
      border-radius:14px;
      border:3px solid var(--ink);
      background:#facc15;
      color:var(--ink);
      font-weight:900;
      cursor:pointer;
      box-shadow:3px 3px 0 rgba(255,255,255,.15);
    }
    .content {
      flex:1;
      min-width:0;
      overflow:auto;
      background:#f1f5f9;
      padding:28px;
    }
    .section { display:none; }
    .section.active { display:block; animation:fade .2s ease; }
    @keyframes fade {
      from { opacity:0; transform:translateY(6px); }
      to { opacity:1; transform:none; }
    }
    .hero, .panel {
      background:var(--panel);
      border:3px solid var(--ink);
      border-radius:22px;
      box-shadow:5px 5px 0 rgba(15,23,42,1);
    }
    .hero {
      padding:26px 28px;
      margin-bottom:24px;
    }
    .eyebrow {
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-size:12px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#475569;
      background:#e2e8f0;
      padding:7px 12px;
      border-radius:999px;
      border:2px solid var(--ink);
    }
    .hero h2 {
      margin:14px 0 8px;
      font-size:40px;
      line-height:1.02;
      letter-spacing:-.04em;
      color:var(--ink);
    }
    .hero p {
      margin:0;
      font-size:18px;
      line-height:1.6;
      color:#334155;
      font-weight:700;
      max-width:900px;
    }
    .stack { display:grid; gap:20px; }
    .panel {
      padding:20px;
    }
    .panel h3 {
      margin:0 0 10px;
      color:var(--ink);
      font-size:22px;
      font-weight:900;
      letter-spacing:-.02em;
    }
    .panel h4 {
      margin:0 0 8px;
      color:var(--ink);
      font-size:18px;
      font-weight:900;
    }
    .panel p, .panel li {
      color:#1e293b;
      font-size:16px;
      line-height:1.65;
      font-weight:700;
    }
    .softbox {
      background:#f8fafc;
      border:2px solid var(--line);
      border-radius:18px;
      padding:16px;
    }
    .list-clean {
      margin:0;
      padding-left:18px;
      display:grid;
      gap:10px;
    }
    .steps { display:grid; gap:14px; }
    .step {
      background:#f8fafc;
      border:2px solid var(--line);
      border-radius:18px;
      padding:16px 16px 16px 18px;
    }
    .step-head {
      display:flex;
      align-items:flex-start;
      gap:14px;
    }
    .step-num {
      min-width:36px;
      height:36px;
      border-radius:12px;
      background:#2563eb;
      color:#fff;
      border:2px solid var(--ink);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      box-shadow:3px 3px 0 rgba(15,23,42,1);
      margin-top:2px;
    }
    .step p { margin:6px 0 0; }
    .download-btn {
      display:inline-flex;
      align-items:center;
      gap:8px;
      background:var(--blue);
      color:#fff;
      border:3px solid var(--ink);
      border-radius:12px;
      padding:10px 16px;
      font-weight:900;
      text-decoration:none;
      margin-top:12px;
      transition:transform 0.1s, box-shadow 0.1s;
    }
    .download-btn:hover {
      transform:translate(-2px,-2px);
      box-shadow:4px 4px 0 rgba(15,23,42,1);
    }
    .shot-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
      gap:16px;
    }
    .shot-card {
      background:#fff;
      border:2px solid var(--line);
      border-radius:18px;
      padding:12px;
    }
    .shot-card strong {
      display:block;
      color:var(--ink);
      margin-top:10px;
      margin-bottom:4px;
      font-size:15px;
    }
    .shot-card span {
      display:block;
      color:#475569;
      font-size:13px;
      line-height:1.5;
      font-weight:700;
    }
    .native-shot {
      display:block;
      width:auto;
      height:auto;
      max-width:100%;
      border:1.5px solid #94a3b8;
      border-radius:10px;
      background:#fff;
      cursor:zoom-in;
    }
    .twocol {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:16px;
    }
    .gallery-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
      gap:14px;
    }
    .gallery-item {
      border:2px solid var(--line);
      background:#fff;
      border-radius:16px;
      padding:10px;
    }
    .gallery-item .caption {
      margin-top:8px;
      font-size:12px;
      font-weight:800;
      color:#475569;
      word-break:break-word;
    }
    .modal-backdrop {
      position:fixed;
      inset:0;
      background:rgba(15,23,42,.72);
      backdrop-filter:blur(4px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:999;
      padding:20px;
    }
    .modal-backdrop.open { display:flex; }
    .modal-card {
      background:#fff;
      border:3px solid var(--ink);
      border-radius:22px;
      max-width:min(1100px, 96vw);
      max-height:90vh;
      overflow:auto;
      box-shadow:10px 10px 0 rgba(15,23,42,.35);
      padding:18px;
    }
    .modal-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
    }
    .modal-head h5 {
      margin:0;
      font-size:22px;
      font-weight:900;
      color:var(--ink);
    }
    .icon-btn {
      border:3px solid var(--ink);
      background:#e2e8f0;
      color:var(--ink);
      border-radius:12px;
      width:42px;
      height:42px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      font-weight:900;
    }
    .modal-card img {
      display:block;
      max-width:none;
      width:auto;
      height:auto;
      background:#fff;
      border:1px solid #94a3b8;
      border-radius:10px;
    }
    .hidden-section-note {
      background:#fef3c7;
      color:#78350f;
      border:2px solid #f59e0b;
      border-radius:16px;
      padding:14px 16px;
      font-weight:800;
    }
    .field {
      font-family:'JetBrains Mono', monospace;
      font-size:.92em;
      background:#e2e8f0;
      border:2px solid var(--ink);
      border-radius:8px;
      padding:2px 7px;
      white-space:nowrap;
    }
    @media (max-width: 1000px) {
      .app-shell { flex-direction:column; height:auto; min-height:95vh; }
      .sidebar { width:100%; max-width:none; resize:none; overflow-y:visible; border-right:none; border-bottom:3px solid var(--ink); }
      .content { padding:18px; }
      .hero h2 { font-size:32px; }
    }
    @media (max-width: 760px) {
      .twocol { grid-template-columns:1fr; }
      .hero h2 { font-size:28px; }
      .hero p { font-size:16px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="badge"><i data-lucide="bicycle"></i> Interactive student file</div>
        <h1>Bikeshare<br>Data Lab</h1>
        <p>Import the daily bikeshare CSV, inspect the structure, clean the fields, document the workflow, and export a finished file.</p>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">
        <button class="lock-btn" id="openLock"><i data-lucide="lock"></i> Instructor access</button>
      </div>
    </aside>
    <main class="content" id="content"></main>
  </div>

  <div class="modal-backdrop" id="zoomModal" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head">
        <h5 id="zoomTitle">Screenshot</h5>
        <button class="icon-btn" id="closeZoom" aria-label="Close image"><i data-lucide="x"></i></button>
      </div>
      <div id="zoomBody"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="lockModal" aria-hidden="true">
    <div class="modal-card" style="max-width:520px;">
      <div class="modal-head">
        <h5>Instructor access</h5>
        <button class="icon-btn" id="closeLock" aria-label="Close instructor modal"><i data-lucide="x"></i></button>
      </div>
      <div class="stack">
        <p style="margin:0; color:#334155; font-weight:800;">Enter the local password to reveal the instructor-only section in the navigation.</p>
        <label style="font-weight:900; color:#0f172a;">Password</label>
        <input id="lockInput" type="password" autocomplete="off" placeholder="Enter password" style="width:100%; padding:14px 16px; border:3px solid #0f172a; border-radius:14px; font-size:16px; font-weight:800; color:#0f172a; background:#fff;" />
        <button class="lock-btn" id="unlockBtn" style="box-shadow:3px 3px 0 rgba(15,23,42,1);">Unlock</button>
        <div id="lockMsg" class="hidden-section-note" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script>
    // Disable right-click across the entire document
    document.addEventListener('contextmenu', e => e.preventDefault());

    const SECTIONS = [
      {

      {

              }, 
              {

                ]
              }, 
              {

                ]

                ]

              {

            "type": "steps",

              {

                "body": "Once you confirm the workflow still runs as intended and the file paths are relative, save and close the workflow. From your file system, select the workflow and the data sources you intend to share and zip them together. This zipped folder is what should be shared.",

              {

      {
        "id": "instructor", 
        "label": "Instructor Access", 
        "icon": "lock", 
        "title": "Instructor-only notes", 
        "intro": "Enter the password in the padlock modal to reveal instructor-only prompts and teaching notes for this local copy.", 
        "hidden": true, 
        "cards": [
          {"type": "callout", "title": "Instructor quick notes", "items": ["Password for this local package: bike", "Suggested prompts: What does each record represent? Which fields should remain categories? Why do relative paths matter before submitting a workflow?", "Suggested focus questions: Which season has the highest rentals? Are rentals different on holidays? Under which weather conditions are rentals most popular? What pattern appears between bike rentals and windspeed?", "Suggested field-removal set for a weather-focused analysis: [instant], [season], [yr], [mnth], [holiday], [weekday], [workingday], [casual], [registered]", "Suggested type changes: [dteday] Date; [holiday]/[workingday] Boolean; [weathersit]/[temp]/[atemp]/[hum]/[windspeed] Double; [casual]/[registered]/[cnt] Int64"]}, 
          {"type": "callout", "title": "Class discussion prompts", "items": ["Why is Browse less informative before the types are fixed?", "How does the Select tool help with both formatting and analytical focus?", "What would break if you submitted the workflow with full local file paths?", "When would Text Input be more useful than Input Data?"]}
        ]
      }
    ];
    const GALLERY = [];
    
    const nav = document.getElementById('nav');
    const content = document.getElementById('content');
    let instructorUnlocked = false;
    let activeId = 'overview';

    function esc(str) {
      return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#39;');
    }

    function renderNav() {
      nav.innerHTML = '';
      SECTIONS.filter(s => !s.hidden || instructorUnlocked).forEach(section => {
        const btn = document.createElement('button');
        btn.className = section.id === activeId ? 'active' : '';
        btn.dataset.target = section.id;
        btn.innerHTML = `<i data-lucide="${section.icon}"></i><span>${esc(section.label)}</span>`;
        btn.addEventListener('click', () => {
          activeId = section.id;
          renderNav();
          renderContent();
        });
        nav.appendChild(btn);
      });
      lucide.createIcons();
    }

    function shotCard(shot) {
      return `
        <figure class="shot-card">
          <img src="data/${esc(shot.file)}" alt="${esc(shot.title)}" class="native-shot zoomable" data-title="${esc(shot.title)}" data-src="data/${esc(shot.file)}" loading="lazy">
          <figcaption>
            <strong>${esc(shot.title)}</strong>
            <span>${esc(shot.desc || '')}</span>
          </figcaption>
        </figure>
      `;
    }

    function renderCard(card, idx) {
      if (card.type === 'callout') {
        return `
          <section class="panel">
            <h3>${esc(card.title)}</h3>
            <div class="softbox">
              <ul class="list-clean">${card.items.map(item => `<li>${esc(item)}</li>`).join('')}</ul>
            </div>
            ${instructorUnlocked && card.instructorNote ? `
              <div class="hidden-section-note" style="margin-top: 14px; font-size: 14px; display:flex; align-items:flex-start; gap:8px;">
                <i data-lucide="lock" style="min-width:18px; height:18px; margin-top:2px;"></i>
                <div><strong>Instructor Note:</strong><br>${esc(card.instructorNote)}</div>
              </div>
            ` : ''}
          </section>
        `;
      }
      if (card.type === 'checklist') {
        return `
          <section class="panel">
            <h3>${esc(card.title)}</h3>
            <div class="softbox">
              <ul class="list-clean">${card.items.map(item => `<li>${esc(item)}</li>`).join('')}</ul>
            </div>
          </section>
        `;
      }
      if (card.type === 'steps') {
        return `
          <section class="panel">
            <h3>Step-by-step</h3>
            <div class="steps">
              ${card.steps.map((step, i) => `
                <div class="step">
                  <div class="step-head">
                    <div class="step-num">${i+1}</div>
                    <div style="flex: 1; min-width: 0;">
                      <h4>${esc(step.title)}</h4>
                      <p>${esc(step.body)}</p>
                      
                      ${step.downloads && step.downloads.length > 0 ? `
                        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top: 6px;">
                          ${step.downloads.map(d => `
                            <a href="data/${esc(d.file)}" download class="download-btn">
                              <i data-lucide="download"></i> ${esc(d.label)}
                            </a>
                          `).join('')}
                        </div>
                      ` : ''}
                      
                      ${step.shots && step.shots.length > 0 ? `
                        <div class="shot-grid" style="margin-top: 16px;">
                          ${step.shots.map(shot => shotCard(shot)).join('')}
                        </div>
                      ` : ''}

                      ${instructorUnlocked && step.instructorNote ? `
                        <div class="hidden-section-note" style="margin-top: 14px; font-size: 14px; display:flex; align-items:flex-start; gap:8px;">
                          <i data-lucide="lock" style="min-width:18px; height:18px; margin-top:2px;"></i>
                          <div><strong>Instructor Note:</strong><br>${esc(step.instructorNote)}</div>
                        </div>
                      ` : ''}
                    </div>
                  </div>
                </div>`).join('')}
            </div>
          </section>
        `;
      }
      if (card.type === 'gridshots') {
        return `
          <section class="panel">
            <h3>Matched screenshots</h3>
            <div class="shot-grid">
              ${card.shots.map(shot => shotCard(shot)).join('')}
            </div>
          </section>
        `;
      }
      if (card.type === 'twocol') {
        return `
          <section class="panel">
            <div class="twocol">
              <div class="softbox">
                <h3>${esc(card.left.title)}</h3>
                <ul class="list-clean">${card.left.items.map(item => `<li>${esc(item)}</li>`).join('')}</ul>
              </div>
              <div class="softbox">
                <h3>${esc(card.right.title)}</h3>
                <ul class="list-clean">${card.right.items.map(item => `<li>${esc(item)}</li>`).join('')}</ul>
              </div>
            </div>
          </section>
        `;
      }
      if (card.type === 'gallery') {
        return `
          <section class="panel">
            <div class="gallery-grid">
              ${GALLERY.map(file => `
                <figure class="gallery-item">
                  <img src="data/${esc(file)}" alt="${esc(file)}" class="native-shot zoomable" data-title="${esc(file)}" data-src="data/${esc(file)}" loading="lazy">
                  <figcaption class="caption">${esc(file)}</figcaption>
                </figure>
              `).join('')}
            </div>
          </section>
        `;
      }
      return '';
    }

    function renderContent() {
      const section = SECTIONS.find(s => s.id === activeId) || SECTIONS[0];
      const hiddenNote = section.hidden ? '<div class="hidden-section-note">Instructor-only section unlocked for this local file.</div>' : '';
      content.innerHTML = `
        <section class="section active">
          <div class="hero">
            <div class="eyebrow"><i data-lucide="${section.icon}"></i> ${esc(section.label)}</div>
            <h2>${esc(section.title)}</h2>
            <p>${esc(section.intro)}</p>
          </div>
          ${hiddenNote}
          <div class="stack">
            ${section.cards.map(renderCard).join('')}
          </div>
        </section>
      `;
      lucide.createIcons();
      attachZoomHandlers();
    }

    function attachZoomHandlers() {
      document.querySelectorAll('.zoomable').forEach(img => {
        img.addEventListener('click', () => {
          document.getElementById('zoomTitle').textContent = img.dataset.title || 'Screenshot';
          document.getElementById('zoomBody').innerHTML = `<img src="${img.dataset.src}" alt="${esc(img.dataset.title || 'Screenshot')}">`;
          document.getElementById('zoomModal').classList.add('open');
        });
      });
    }

    function closeZoom() {
      document.getElementById('zoomModal').classList.remove('open');
      document.getElementById('zoomBody').innerHTML = '';
    }

    function openLock() {
      document.getElementById('lockModal').classList.add('open');
      document.getElementById('lockInput').value = '';
      document.getElementById('lockMsg').style.display = 'none';
      setTimeout(() => document.getElementById('lockInput').focus(), 30);
    }

    function closeLock() {
      document.getElementById('lockModal').classList.remove('open');
    }

    function unlockInstructor() {
      const val = document.getElementById('lockInput').value.trim();
      const msg = document.getElementById('lockMsg');
      if (val === 'bike') {
        instructorUnlocked = true;
        msg.style.display = 'block';
        msg.textContent = 'Unlocked. Instructor notes are now visible beneath the relevant instructions, and the Instructor Access section is in the sidebar.';
        renderNav();
        
        setTimeout(() => {
          activeId = 'instructor';
          renderNav();
          renderContent();
          closeLock();
        }, 800);
      } else {
        msg.style.display = 'block';
        msg.textContent = 'Password not recognized. Try again.';
      }
    }

    document.getElementById('openLock').addEventListener('click', openLock);
    document.getElementById('closeLock').addEventListener('click', closeLock);
    document.getElementById('unlockBtn').addEventListener('click', unlockInstructor);
    document.getElementById('lockInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') unlockInstructor();
    });
    document.getElementById('closeZoom').addEventListener('click', closeZoom);
    document.getElementById('zoomModal').addEventListener('click', (e) => {
      if (e.target.id === 'zoomModal') closeZoom();
    });
    document.getElementById('lockModal').addEventListener('click', (e) => {
      if (e.target.id === 'lockModal') closeLock();
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeZoom();
        closeLock();
      }
    });

    renderNav();
    renderContent();
  </script>
</body>
