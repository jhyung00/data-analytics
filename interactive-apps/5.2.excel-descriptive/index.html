<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Excel Master: Data Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* --- BASE EXCEL STYLES --- */
        .excel-grid {
            border-collapse: collapse;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 0.85rem;
            background: white;
            cursor: default;
        }
        .excel-grid th {
            background-color: #f3f4f6;
            border: 1px solid #d1d5db;
            padding: 4px 12px;
            text-align: center;
            font-weight: 600;
            color: #374151;
            white-space: nowrap;
        }
        .excel-grid td {
            border: 1px solid #e5e7eb;
            padding: 4px 12px;
            color: #1f2937;
            white-space: nowrap;
            position: relative;
        }
        /* Row Headers (1, 2, 3...) */
        .excel-row-header {
            background-color: #f3f4f6;
            font-weight: 600;
            color: #6b7280;
            text-align: center;
            width: 30px;
            border-right: 2px solid #d1d5db !important;
        }
        
        /* Analysis Specific Highlights */
        .highlight-data {
            background-color: #dbeafe !important; /* blue-100 */
            border: 2px solid #2563eb !important; /* blue-600 */
        }
        .highlight-bins {
            background-color: #fce7f3 !important; /* pink-100 */
            border: 2px solid #db2777 !important; /* pink-600 */
        }
        .highlight-output {
            background-color: #dcfce7 !important; /* green-100 */
            border: 2px dashed #16a34a !important; /* green-600 */
        }

        /* --- TOOLPAK DIALOG STYLES --- */
        .dialog-window {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f0f0;
            border: 1px solid #999;
            box-shadow: 4px 4px 15px rgba(0,0,0,0.15);
            border-radius: 4px;
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
        }
        .dialog-header {
            background: white;
            padding: 6px 10px;
            font-size: 11px;
            border-bottom: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .dialog-body {
            padding: 12px;
            font-size: 11px;
            color: #333;
        }
        .dialog-input-group {
            margin-bottom: 8px;
        }
        .dialog-label {
            display: block;
            margin-bottom: 2px;
        }
        .dialog-input {
            width: 100%;
            border: 1px solid #aaa;
            padding: 2px 4px;
            background: white;
        }
        .dialog-checkbox {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 4px;
        }

        /* --- UI COMPONENTS --- */
        .module-item {
            transition: all 0.2s;
            border-left: 4px solid transparent;
        }
        .module-item:hover {
            background-color: #f3f4f6;
        }
        .module-item.active {
            background-color: #eff6ff; /* blue-50 */
            border-left-color: #2563eb; /* blue-600 */
            color: #1e3a8a;
        }

        /* Result Overlays (Simulating Excel Output) */
        .result-overlay {
            position: absolute;
            background: white;
            border: 1px solid #ccc;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 20;
            padding: 10px;
            font-size: 0.75rem;
            animation: fadeIn 0.5s ease-out;
            max-width: 90%;
        }
        
        /* Responsive Overlay Placement */
        @media (max-width: 768px) {
            .result-overlay {
                left: 50%;
                transform: translateX(-50%);
                top: 20px !important;
                right: auto !important;
            }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Simple Bar Chart CSS */
        .bar-container { display: flex; align-items: flex-end; height: 100px; gap: 4px; border-left: 1px solid #333; border-bottom: 1px solid #333; padding: 5px; }
        .bar { background-color: #3b82f6; width: 20px; transition: height 0.5s; }
        
        /* Skewness Animation Styles */
        .skew-chart-container {
            position: relative;
            height: 120px;
            background-color: #f8fafc;
            border-bottom: 2px solid #64748b;
            margin-bottom: 10px;
            border-radius: 4px;
            overflow: hidden;
        }

        .hist-bar {
            position: absolute;
            bottom: 0;
            width: 9%;
            margin-left: 0.5%;
            background-color: #cbd5e1; /* slate-300 */
            border-top: 1px solid #94a3b8;
            border-radius: 2px 2px 0 0;
        }

        .boxplot-layer {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
        }

        /* Skew Animation Keyframes */
        @keyframes verticalToHorizontal {
            0% {
                opacity: 0;
                transform: translate(20px, -40px) rotate(-90deg) scale(0.5);
            }
            20% {
                opacity: 1;
                transform: translate(20px, -40px) rotate(-90deg) scale(0.8);
            }
            100% {
                opacity: 1;
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
        }
        
        .animate-rotate-in {
            animation: verticalToHorizontal 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        canvas {
            pointer-events: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
        }
    </style>
</head>

    <script>
        // --- ANIMATION HELPER FUNCTION ---
        window.playSkewAnimation = function() {
            const right = document.getElementById('bp-right');
            const left = document.getElementById('bp-left');
            
            if (right && left) {
                // Reset
                right.classList.remove('animate-rotate-in');
                left.classList.remove('animate-rotate-in');
                right.style.opacity = '0';
                left.style.opacity = '0';
                
                // Trigger Reflow
                void right.offsetWidth;
                
                // Add Animation Class
                right.classList.add('animate-rotate-in');
                left.classList.add('animate-rotate-in');
            }
        };

        // --- DATA MODELS ---

        // 1. Employee Salary Data (for Desc Stats & Boxplot)
        const salaryData = {
            name: "Employee_Salaries",
            headers: ["", "A", "B", "C", "D"],
            rows: [
                { id: 1, cells: ["ID", "Dept", "Salary", "Bonus"] },
                { id: 2, cells: ["101", "Sales", "45,000", "5,000"] },
                { id: 3, cells: ["102", "IT", "72,000", "2,000"] },
                { id: 4, cells: ["103", "Sales", "48,000", "6,000"] },
                { id: 5, cells: ["104", "HR", "52,000", "3,500"] },
                { id: 6, cells: ["105", "IT", "68,000", "2,000"] },
                { id: 7, cells: ["106", "Sales", "42,000", "4,500"] },
                { id: 8, cells: ["107", "Admin", "38,000", "1,000"] },
                { id: 9, cells: ["108", "IT", "125,000", "10,000"] }, // Outlier
                { id: 10, cells: ["109", "Sales", "47,000", "5,500"] },
                { id: 11, cells: ["110", "HR", "55,000", "3,000"] }
            ],
            highlights: {}
        };

        // 2. Customer Age Data (for Histogram)
        const ageData = {
            name: "Customer_Demographics",
            headers: ["", "A", "B", "C", "D", "E"],
            rows: [
                { id: 1, cells: ["CustID", "Age", "", "Bins", "Frequency"] },
                { id: 2, cells: ["C001", "19", "", "20", ""] },
                { id: 3, cells: ["C002", "25", "", "30", ""] },
                { id: 4, cells: ["C003", "45", "", "40", ""] },
                { id: 5, cells: ["C004", "32", "", "50", ""] },
                { id: 6, cells: ["C005", "22", "", "60", ""] },
                { id: 7, cells: ["C006", "28", "", "", ""] },
                { id: 8, cells: ["C007", "55", "", "", ""] },
                { id: 9, cells: ["C008", "38", "", "", ""] },
                { id: 10, cells: ["C009", "21", "", "", ""] },
                { id: 11, cells: ["C010", "41", "", "", ""] }
            ],
            highlights: {}
        };

        // 3. Regression Data
        const regressionData = {
            name: "Marketing_ROI",
            headers: ["", "A", "B", "C"],
            rows: [
                { id: 1, cells: ["Month", "Ad Spend (X)", "Sales (Y)"] },
                { id: 2, cells: ["Jan", "1000", "15000"] },
                { id: 3, cells: ["Feb", "1200", "18000"] },
                { id: 4, cells: ["Mar", "1500", "21000"] },
                { id: 5, cells: ["Apr", "1800", "24500"] },
                { id: 6, cells: ["May", "2000", "27000"] },
                { id: 7, cells: ["Jun", "2200", "30000"] },
                { id: 8, cells: ["Jul", "2500", "32500"] },
                { id: 9, cells: ["Aug", "2800", "36000"] },
                { id: 10, cells: ["Sep", "3000", "38500"] },
                { id: 11, cells: ["Oct", "3200", "41000"] }
            ],
            highlights: {}
        };

        // --- COURSE SEQUENCE ---
        const sequence = [
            // 1. INTRO
            {
                type: 'lesson',
                title: "The Analysis Toolpak",
                content: `
                    <h3 class="text-xl font-bold text-slate-800 mb-2">Unlock Hidden Powers</h3>
                    <p class="mb-4">Excel has a powerful hidden add-in called the <strong>Data Analysis Toolpak</strong>. It performs complex statistical engineering without writing a single formula.</p>
                    
                    <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6 shadow-sm">
                        <h4 class="font-bold text-yellow-800 mb-2 text-sm"><i class="fas fa-key mr-2"></i>How to Enable It (One-Time Setup)</h4>
                        <ol class="list-decimal ml-5 text-sm text-yellow-900 space-y-2">
                            <li>Go to <strong>File > Options</strong> (or Excel Options).</li>
                            <li>Select <strong>Add-ins</strong> on the left sidebar.</li>
                            <li>At the bottom, look for "Manage: Excel Add-ins" and click the <strong>Go...</strong> button.</li>
                            <li>Check the box for <strong>Analysis Toolpak</strong> and click OK.</li>
                            <li>You will now see a <strong>Data Analysis</strong> button on the far right of your <strong>Data</strong> tab.</li>
                        </ol>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 my-6">
                        <div class="bg-indigo-50 p-4 rounded-lg border border-indigo-100">
                            <h4 class="font-bold text-indigo-800 mb-2"><i class="fas fa-magnifying-glass-chart mr-2"></i>Descriptive Statistics</h4>
                            <p class="text-sm">Instantly calculates Mean, Median, Mode, Standard Deviation, Skewness, and more for a dataset.</p>
                        </div>
                        <div class="bg-purple-50 p-4 rounded-lg border border-purple-100">
                            <h4 class="font-bold text-purple-800 mb-2"><i class="fas fa-chart-bar mr-2"></i>Histograms</h4>
                            <p class="text-sm">Automatically counts data frequencies into "bins" (groups) to show distribution patterns.</p>
                        </div>
                        <div class="bg-green-50 p-4 rounded-lg border border-green-100 col-span-1 md:col-span-2">
                            <h4 class="font-bold text-green-800 mb-2"><i class="fas fa-chart-line mr-2"></i>Regression</h4>
                            <p class="text-sm">Predict future outcomes (like Sales) based on input variables (like Ad Spend).</p>
                        </div>
                    </div>
                `
            },
            // 2. DESCRIPTIVE STATS WALKTHROUGH
            {
                type: 'analysis-walkthrough',
                title: "Descriptive Statistics",
                desc: "We want a quick summary of Employee Salaries (Column C). Instead of typing =AVERAGE, =MEDIAN, etc., let's get it all at once.",
                data: salaryData,
                steps: [
                    {
                        info: "Select Input",
                        text: "In the Input Range box, we select the Salary column (C1:C11). Note that we check 'Labels in first row' so Excel knows C1 is a header.",
                        highlight: ["C1", "C2", "C3", "C4", "C5", "C6", "C7", "C8", "C9", "C10", "C11"],
                        class: "highlight-data",
                        dialog: {
                            title: "Descriptive Statistics",
                            inputs: [
                                { label: "Input Range:", val: "$C$1:$C$11" },
                                { label: "Grouped By:", radio: ["Columns", "Rows"], active: 0 },
                                { label: "Labels in first row", check: true }
                            ]
                        }
                    },
                    {
                        info: "Configure Output",
                        text: "We choose where to put the table (Output Range: E1) and make sure 'Summary statistics' is checked.",
                        highlight: ["E1"],
                        class: "highlight-output",
                        dialog: {
                            title: "Descriptive Statistics",
                            inputs: [
                                { label: "Output Options:", radio: ["Output Range", "New Worksheet"], active: 0, val: "$E$1" },
                                { label: "Summary statistics", check: true },
                                { label: "Confidence Level", check: false }
                            ]
                        }
                    },
                    {
                        info: "Review Results",
                        text: "Excel generates a comprehensive table. Notice the 'Mean' ($59,200) vs 'Median' ($49,600). The large difference suggests an outlier is skewing the average.",
                        resultType: "table",
                        resultContent: [
                            ["Mean", "59,200"],
                            ["Standard Error", "8,124"],
                            ["Median", "49,600"],
                            ["Mode", "#N/A"],
                            ["Standard Deviation", "25,685"],
                            ["Minimum", "38,000"],
                            ["Maximum", "125,000"],
                            ["Count", "10"]
                        ],
                        dialog: { hide: true }
                    }
                ]
            },
            // 3. HISTOGRAM WALKTHROUGH
            {
                type: 'analysis-walkthrough',
                title: "Creating a Histogram",
                desc: "We want to see the age distribution of our customers. We have defined 'Bins' (Groups) in column D: 20s, 30s, 40s, etc.",
                data: ageData,
                steps: [
                    {
                        info: "Inputs & Bins",
                        text: "Input Range is our Customer Ages (B2:B11). <br>Bin Range is our defined cut-off points (D2:D6).",
                        highlight: ["B2", "B3", "B4", "B5", "B6", "B7", "B8", "B9", "B10", "B11", "D2", "D3", "D4", "D5", "D6"],
                        class: "highlight-bins",
                        dialog: {
                            title: "Histogram",
                            inputs: [
                                { label: "Input Range:", val: "$B$2:$B$11" },
                                { label: "Bin Range:", val: "$D$2:$D$6" },
                                { label: "Labels", check: false }
                            ]
                        }
                    },
                    {
                        info: "Chart Output",
                        text: "We select cell E2 for the output table and check 'Chart Output' to visualize the frequency.",
                        highlight: ["E2"],
                        class: "highlight-output",
                        dialog: {
                            title: "Histogram",
                            inputs: [
                                { label: "Output Range:", val: "$E$2" },
                                { label: "Cumulative Percentage", check: false },
                                { label: "Chart Output", check: true }
                            ]
                        }
                    },
                    {
                        info: "Distribution View",
                        text: "The result shows most customers are in the '20' and '30' bins (younger demographic).",
                        resultType: "histogram",
                        resultContent: [
                            { bin: "20", freq: 2 },
                            { bin: "30", freq: 4 },
                            { bin: "40", freq: 2 },
                            { bin: "50", freq: 2 },
                            { bin: "More", freq: 0 }
                        ],
                        dialog: { hide: true }
                    }
                ]
            },
            // 4. BOXPLOT LESSON

        function renderExcelTable(data) {
            const table = document.getElementById('data-table');
            table.innerHTML = '';
            document.getElementById('result-overlay-container').innerHTML = ''; // Clear overlays
            
            // Header
            const thead = document.createElement('thead');
            const rowHeader = document.createElement('tr');
            const corner = document.createElement('th');
            corner.className = "w-8 border-r-2 border-gray-300 bg-gray-100";
            rowHeader.appendChild(corner);

            data.headers.forEach((h, i) => {
                if (i===0) return;
                const th = document.createElement('th');
                th.innerText = h;
                rowHeader.appendChild(th);
            });
            thead.appendChild(rowHeader);
            table.appendChild(thead);

            // Body
            const tbody = document.createElement('tbody');
            data.rows.forEach(row => {
                const tr = document.createElement('tr');
                const rowNum = document.createElement('td');
                rowNum.className = "excel-row-header";
                rowNum.innerText = row.id;
                tr.appendChild(rowNum);

                row.cells.forEach((cellContent, cellIndex) => {
                    const td = document.createElement('td');
                    td.innerText = cellContent;
                    
                    const colLetter = data.headers[cellIndex + 1];
                    const cellAddress = colLetter ? colLetter + row.id : null;
                    if(cellAddress) td.id = `cell-${cellAddress}`;

                    // Bold first row
                    if (row.id === 1) td.style.fontWeight = 'bold';

                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
        }

                ["2024-01-03", "South", 200, -0.05, 21], // Outlier
                ["2024-01-03", "East", 2050, 0.17, 48],
                ["", "", "", "", ""],
                ["Instructions:", "Part A: Retail Analysis", "", "", ""],
                ["", "1. Run Descriptive Stats on 'Daily Sales'.", "", "", ""],
                ["", "2. Create a Histogram for 'Customer Age'.", "", "", ""],
                ["", "3. Create Boxplot for 'Profit Margin' to find the outlier.", "", "", ""]
            ];

            // Sheet 2: Factory Efficiency (Regression Challenge - 60 Data Points)
            const factoryData = [
                ["Month_Index", "Machine_Uptime_Hours (X)", "Energy_Cost_USD (Y)"]
            ];

            // Generate 60 months of data (5 years)
            // Logic: Base Cost ($500) + (Uptime * $15/hr) + Random Noise
            for (let i = 1; i <= 60; i++) {
                // Random Uptime between 200 and 400 hours
                const uptime = Math.floor(Math.random() * (400 - 200 + 1)) + 200;
                
                // Linear relationship with some noise
                // Cost = 500 (Fixed) + (Uptime * 15) + Noise(-200 to +200)
                const noise = Math.floor(Math.random() * 401) - 200;
                const cost = 500 + (uptime * 15) + noise;

                factoryData.push([i, uptime, cost]);
            }
            // Add outlier for educational purposes
            factoryData.push([61, 300, 12000]); // Huge cost spike, same hours (Machine malfunction?)

            // Instruction Row for Sheet 2
            factoryData.push([]);
            factoryData.push(["Instructions:", "Part B: Regression Analysis"]);
            factoryData.push(["", "1. Run Regression with Energy Cost as Y and Uptime as X."]);
            factoryData.push(["", "2. Determine the R-Square value to see how well Uptime predicts Cost."]);


            const wb = XLSX.utils.book_new();
            const ws1 = XLSX.utils.aoa_to_sheet(rawData);
            const ws2 = XLSX.utils.aoa_to_sheet(factoryData);
            
            XLSX.utils.book_append_sheet(wb, ws1, "Retail_Data");
            XLSX.utils.book_append_sheet(wb, ws2, "Regression_Challenge_Data");
            
            XLSX.writeFile(wb, "Data_Analysis_Capstone.xlsx");
        }

        // --- VISUALS ---
        function animateConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            let w = window.innerWidth;
            let h = window.innerHeight;
            canvas.width = w;
            canvas.height = h;

            // Handle Resize
            window.addEventListener('resize', () => {
                w = window.innerWidth;
                h = window.innerHeight;
                canvas.width = w;
                canvas.height = h;
            });

            const particles = [];
            for(let i=0; i<100; i++) {
                particles.push({
                    x: Math.random()*w, y: Math.random()*h - h,
                    c: ['#6366f1', '#a855f7', '#ec4899'][Math.floor(Math.random()*3)],
                    s: Math.random()*5+2, d: Math.random()*2+1
                });
            }

            function draw() {
                ctx.clearRect(0,0,w,h);
                particles.forEach(p => {
                    p.y += p.d;
                    if(p.y > h) p.y = -10;
                    ctx.fillStyle = p.c;
                    ctx.fillRect(p.x, p.y, p.s, p.s);
                });
                requestAnimationFrame(draw);
            }
            
            window.fireConfetti = () => {
                requestAnimationFrame(draw);
            }
        }

        // Start
        init();

    </script>
