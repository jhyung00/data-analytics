<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Foundations Lab - ACCT 311</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom Scrollbar for inner content */
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        /* Animation Classes */
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        .slide-up { animation: slideUp 0.3s ease-out; }
        .zoom-in { animation: zoomIn 0.2s ease-out; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Draggable cursor */
        .draggable { cursor: move; user-select: none; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-gray-900 h-screen flex overflow-hidden select-none">

    <!-- Sidebar -->
    <aside class="w-72 bg-white border-r border-gray-200 flex flex-col shadow-sm z-20 flex-shrink-0">
        <div class="p-6 border-b border-gray-100 bg-slate-50">
            <div class="flex items-center space-x-2 text-blue-700 mb-1">
                <i data-lucide="file-spreadsheet" class="w-6 h-6"></i>
                <span class="font-bold text-xl tracking-tight">Data Foundations</span>
            </div>
            <p class="text-slate-500 text-xs">ACCT 311</p>
        </div>
        
        <nav id="module-nav" class="flex-1 overflow-y-auto py-6 px-4 space-y-2 custom-scroll">
            <!-- Navigation Items Injected via JS -->
        </nav>

        <div class="p-4 bg-slate-50 border-t border-gray-200">
            <div class="bg-white p-3 rounded border border-gray-200 shadow-sm mb-4">
                <div class="text-xs font-semibold text-gray-500 uppercase mb-2">Course Progress</div>
                <div class="w-full bg-gray-100 rounded-full h-2 overflow-hidden">
                    <div id="progress-bar" class="bg-green-500 h-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
            
            <button onclick="window.app.instructorLogin()" class="w-full flex items-center justify-center space-x-2 text-xs text-gray-400 hover:text-blue-600 transition-colors py-2 border border-transparent hover:border-blue-100 rounded">
                <i data-lucide="shield-check" class="w-3 h-3"></i>
                <span id="teacher-btn-text">Teacher Access</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden relative">
        
        <!-- Toast Container -->
        <div id="toast-container" class="absolute top-4 left-1/2 transform -translate-x-1/2 z-50 flex flex-col space-y-2 pointer-events-none"></div>

        <!-- Header -->
        <header class="bg-white px-8 py-6 border-b border-gray-200 flex justify-between items-center sticky top-0 z-10 shadow-sm">
            <div>
                <div class="flex items-center space-x-2 text-sm text-blue-600 font-semibold uppercase tracking-wider mb-1">
                    <span id="module-number">Module 1</span>
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    <span>Concept Phase</span>
                </div>
                <h1 id="module-title" class="text-3xl font-bold text-gray-900">Data Terminology</h1>
            </div>
            
            <button id="download-btn" onclick="window.app.downloadFiles()" class="hidden flex items-center space-x-2 bg-slate-800 text-white px-4 py-2 rounded-lg hover:bg-slate-700 transition-colors shadow-sm hover:shadow-md">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span class="text-sm font-medium">Download Workbook</span>
            </button>
        </header>

        <!-- Main Scroll Area -->
        <main class="flex-1 overflow-y-auto p-8 custom-scroll bg-slate-50">
            <div class="max-w-7xl mx-auto space-y-8">
                
                <!-- Top Row: Concept & Project -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    
                    <!-- Concept Card -->
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-full">
                        <div class="flex items-center space-x-2 mb-4 text-blue-700">
                            <i data-lucide="book-open" class="w-5 h-5"></i>
                            <h2 class="text-lg font-bold">Concept Overview</h2>
                        </div>
                        <div id="concept-content" class="text-gray-600 leading-relaxed text-sm space-y-4">
                            <!-- Injected via JS -->
                        </div>
                    </div>

                    <!-- Project Card -->
                    <div id="project-card" class="rounded-xl shadow-sm border p-6 transition-all duration-300 relative overflow-hidden bg-gray-50 border-gray-200 opacity-90 h-full">
                        <div id="project-lock" class="absolute inset-0 z-10 flex items-center justify-center bg-gray-50/50 backdrop-blur-[1px]">
                            <div class="bg-white px-4 py-2 rounded-lg shadow-md border border-gray-200 flex items-center space-x-2 text-gray-600 animate-pulse">
                                <i data-lucide="lock" class="w-4 h-4"></i>
                                <span class="text-sm font-medium">Complete Demo to Unlock</span>
                            </div>
                        </div>

                        <div class="flex items-center space-x-2 mb-6 text-green-700">
                            <div class="p-2 bg-green-100 rounded-lg">
                                <i data-lucide="target" class="w-6 h-6"></i>
                            </div>
                            <h2 class="text-xl font-bold">Real World Project</h2>
                        </div>

                        <div class="mb-6">
                            <h3 id="project-title" class="font-bold text-gray-900 text-lg mb-1">Title</h3>
                            <p id="project-brief" class="text-gray-600 text-sm">Brief</p>
                        </div>

                        <div class="bg-green-50 rounded-lg p-5 border border-green-100">
                            <h4 class="font-semibold text-green-800 text-sm uppercase tracking-wide mb-3">Your Mission Steps:</h4>
                            <ol id="project-steps" class="space-y-4">
                                <!-- Steps Injected -->
                            </ol>
                        </div>
                    </div>
                </div>

                <!-- Bottom Row: Interactive Demo (Full Width) -->
                <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200 w-full">
                    <div class="flex items-center justify-between mb-4 border-b border-gray-100 pb-2">
                        <div class="flex items-center space-x-2 text-purple-700">
                            <i data-lucide="mouse-pointer" class="w-5 h-5"></i>
                            <h2 class="text-lg font-bold">Interactive Demo</h2>
                        </div>
                        <div id="demo-status" class="hidden bg-green-100 text-green-700 text-xs font-bold px-3 py-1 rounded-full flex items-center">
                            <i data-lucide="check-circle" class="w-3 h-3 mr-1"></i> Completed
                        </div>
                    </div>
                    
                    <!-- Demo Container -->
                    <div id="demo-container" class="bg-slate-50 p-1 rounded-lg border border-slate-200 min-h-[500px] relative">
                        <!-- Demo Content Injected Here -->
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // --- DATA ---
        // Workbook filename configuration
        const WORKBOOK_FILENAME = 'data/Excel_Foundations_Lab.xlsx';

        const MODULES = [
            {
                id: 'intro',
                title: '1. Data Terminology',
                concept: `
                    <p class="mb-2">In accounting, precise navigation is key. We organize data into ledgers using the grid system.</p>
                    <ul class="space-y-2 text-sm text-gray-600 list-disc pl-5">
                        <li><span class="font-bold text-blue-700">Columns</span>: Vertical stacks (A, B, C) representing fields like "Account" or "Debit".</li>
                        <li><span class="font-bold text-blue-700">Rows</span>: Horizontal lines (1, 2, 3) representing individual transactions.</li>
                        <li><span class="font-bold text-blue-700">Cells</span>: The intersection of a row and column (e.g., C4).</li>
                    </ul>`,
                project: {
                    title: 'Mission 1: The Ledger',
                    brief: `Open the "${WORKBOOK_FILENAME}" file you just downloaded. This contains the raw transaction export for January.`,
                    steps: [
                        'Open the downloaded workbook.',
                        'Navigate to the "Journal" sheet.',
                        'Go to Row 8. Identify the account used.',
                        'Click the "Debit" column header (Column E) to select all debit amounts.'
                    ]
                },
                renderDemo: renderTerminologyDemo
            },
            {
                id: 'types',
                title: '2. Data Types & Dates',
                concept: `
                    <p class="mb-2">Excel stores dates as <strong>serial numbers</strong>. Day 1 is Jan 1, 1900.</p>
                    <p class="mb-2">Numbers can also be stored as <strong>Text</strong> (Strings). These align left and cause formula errors.</p>
                    <div class="bg-yellow-50 p-3 rounded border border-yellow-100 text-sm mb-2">
                        <p><strong>Warning:</strong> A "Number stored as Text" will not be included in SUM calculations.</p>
                    </div>`,
                project: {
                    title: 'Mission 2: Formatting',
                    brief: 'Standardize the date and currency formats.',
                    steps: [
                        'Select Column B (Date). Set format to "Long Date".',
                        'Select Columns E & F. Set format to "Currency".'
                    ]
                },
                renderDemo: renderDataTypeDemo
            },
            {
                id: 'validation',
                title: '3. Data Validation',
                concept: `
                    <p class="mb-2"><strong>Data Validation</strong> restricts user input to ensure accuracy.</p>
                    <ul class="space-y-1 text-sm text-gray-600 list-disc pl-5">
                        <li><strong>List:</strong> Dropdown menus.</li>
                        <li><strong>Whole Number:</strong> Integers only (Quantity).</li>
                        <li><strong>Text Length:</strong> Specific character counts (State Codes).</li>
                    </ul>
                    <p class="mt-2 text-sm">You can also set custom <strong>Error Alerts</strong> to guide users.</p>`,
                project: {
                    title: 'Mission 3: Safe Entry',
                    brief: 'Secure the Status column.',
                    steps: [
                        'Select the entire Status column range (H2:H100).',
                        'Go to Data > Validation.',
                        'Allow: List. Source: "Pending, Posted, Void".',
                        'Click OK. Now every cell in the Status column has the dropdown.'
                    ]
                },
                renderDemo: renderValidationDemo
            },
            {
                id: 'cleaning',
                title: '4. Remove Duplicates',
                concept: `
                    <p class="mb-2">Duplicate entries distort financial reports. The <strong>Remove Duplicates</strong> tool helps clean this up.</p>
                    <p class="text-sm bg-gray-100 p-2 rounded"><strong>Tip:</strong> Be careful! If "Select All Columns" is checked, only rows that match EXACTLY will be removed.</p>`,
                project: {
                    title: 'Mission 4: Audit',
                    brief: 'Remove double-entry errors.',
                    steps: [
                        'Select columns A-I.',
                        'Data Tab > Remove Duplicates.',
                        'Select All Columns. Click OK.'
                    ]
                },
                renderDemo: renderCleanupDemo
            },
            {
                id: 'conditional',
                title: '5. Conditional Formatting',
                concept: `
                    <p>Use <strong>Conditional Formatting</strong> to create heatmaps or flag high-value items automatically.</p>
                    <p class="text-sm mt-2">Found on the Home Tab. Popular options include Color Scales (Heatmaps) and Highlight Cell Rules.</p>`,
                project: {
                    title: 'Mission 5: High Value',
                    brief: 'Flag expenses over $500.',
                    steps: [
                        'Select Debit column data.',
                        'Conditional Formatting > Highlight Rules > Greater Than.',
                        'Enter 500. Choose Red Fill.'
                    ]
                },
                renderDemo: renderCondFormatDemo
            },
            {
                id: 'sorting',
                title: '6. Sorting & Filtering',
                concept: `
                    <p><strong>Sorting</strong> organizes data (A-Z, High-Low). <strong>Filtering</strong> hides irrelevant rows.</p>`,
                project: {
                    title: 'Mission 6: Report',
                    brief: 'Finalize the view.',
                    steps: [
                        'Filter for "Pending" status.',
                        'Sort Account Name A-Z.',
                        'Sort Amount High-Low.'
                    ]
                },
                renderDemo: renderSortingDemo
            },
            {
                id: 'refs',
                title: '7. Absolute vs Relative',
                concept: `
                    <p class="mb-2"><strong>Relative References (A1)</strong> change when you drag a formula.</p>
                    <p class="mb-2"><strong>Absolute References ($A$1)</strong> stay locked to a specific cell.</p>
                    <p class="text-xs text-gray-500">Press <strong>F4</strong> to toggle locking.</p>`,
                project: {
                    title: 'Mission 7: Tax Calc',
                    brief: 'Calculate tax using a fixed rate cell.',
                    steps: [
                        'Type 5% in cell K1.',
                        'In J2, type =E2*$K$1.',
                        'Drag down. Ensure K1 stays fixed.'
                    ]
                },
                renderDemo: renderReferencesDemo
            },
            {
                id: 'textsplit',
                title: '8. Text Splitting',
                concept: `
                    <p class="mb-2">Often, data comes "glued" together, like a full name ("Doe, John") or a product SKU ("SHIRT-BLUE-L").</p>
                    <p class="mb-2"><strong>=TEXTSPLIT(text, delimiter)</strong> is a powerful function that separates text into multiple cells based on a character you choose (like a comma, dash, or space).</p>
                    <p class="mb-2"><strong>=TEXTBEFORE(text, delimiter)</strong> is a simpler cousin that grabs just the first piece of text.</p>
                    <div class="bg-blue-50 p-2 rounded text-xs border border-blue-100 font-mono text-blue-800">
                        <p class="font-bold mb-1">Result spills across cells:</p>
                        =TEXTSPLIT("A-B-C", "-") <br> 
                        <span class="inline-block border border-blue-200 px-1 bg-white ml-2">A</span>
                        <span class="inline-block border border-blue-200 px-1 bg-white">B</span>
                        <span class="inline-block border border-blue-200 px-1 bg-white">C</span>
                    </div>`,
                project: {
                    title: 'Mission 8: Audit-Friendly IDs',
                    brief: 'Break down complex journal IDs and dates in your workbook.',
                    steps: [
                        'Create two new headers: Type (L1) and Entry No (M1).',
                        'In L2, use =TEXTSPLIT(A2,"-") to split JE-1007 into JE and 1007.',
                        'Create DayOfWeek in N1. In N2, use =TEXTBEFORE(B2,",") to extract the weekday (e.g., "Sunday").',
                        'Copy formulas down for all rows.'
                    ]
                },
                renderDemo: renderTextSplitDemo
            },
            {
                id: 'textjoin',
                title: '9. Text Joining',
                concept: `
                    <p class="mb-2">The opposite of splitting is joining. You might need to combine a City, State, and Zip code into a single address field.</p>
                    <p class="mb-2"><strong>=TEXTJOIN(delimiter, ignore_empty, text1, ...)</strong> combines multiple cells into one, separated by a character of your choice.</p>
                    <div class="bg-blue-50 p-2 rounded text-xs border border-blue-100 font-mono text-blue-800">
                        =TEXTJOIN(", ", TRUE, "Miami", "FL") -> "Miami, FL"
                    </div>`,
                project: {
                    title: 'Mission 9: Audit Trail',
                    brief: 'Create a single-line summary string for reports.',
                    steps: [
                         'Create header AuditTrailSummary in O1.',
                         'In O2, type: =TEXTJOIN(" | ",TRUE,A2,C2,E2,H2,I2).',
                         'This creates a pipe-separated log: ID | Account | Debit | Status | User.',
                         'Copy down.'
                    ]
                },
                renderDemo: renderTextJoinDemo
            },
            {
                id: 'bonus',
                title: '10. Bonus: The Perfect Formula',
                concept: `
                    <p class="mb-2">Advanced data work often requires <strong>Logic + Text</strong>.</p>
                    <p class="mb-2">For example, you might want a status label that changes based on a number. You can achieve this by creating a "Helper Column" with an <strong>IF</strong> statement, and then joining that helper result into your final text string.</p>
                    <p class="text-sm font-bold">Logic: IF(Score>70, "Pass", "Fail")</p>`,
                project: {
                    title: 'Mission 10: Smart Summary',
                    brief: 'Handle variable Debit/Credit columns dynamically.',
                    steps: [
                        'In P1 type: AmountUsed.',
                        'In P2 type: =IF(E2>0, E2, F2). This grabs whichever column has money.',
                        'In Q1 type: SmartAudit.',
                        'In Q2: =TEXTJOIN(" | ",TRUE,A2,C2,P2,H2,I2).',
                        'Now you have a perfect summary regardless of transaction type.'
                    ]
                },
                renderDemo: renderBonusDemo
            }
        ];

        // --- APP STATE ---
        window.app = {
            activeModule: 0,
            teacherMode: false,
            completed: {}, 
            
            init() {
                this.renderNav();
                this.loadModule(0);
                lucide.createIcons();
            },

            loadModule(index) {
                this.activeModule = index;
                const mod = MODULES[index];
                
                // Update Header
                document.getElementById('module-number').textContent = `Module ${index + 1}`;
                document.getElementById('module-title').textContent = mod.title;
                
                // Show/Hide Download Button
                const dlBtn = document.getElementById('download-btn');
                if (index === 0) dlBtn.classList.remove('hidden');
                else dlBtn.classList.add('hidden');

                // Update Content
                document.getElementById('concept-content').innerHTML = mod.concept;
                
                // Update Project Card
                document.getElementById('project-title').textContent = mod.project.title;
                document.getElementById('project-brief').textContent = mod.project.brief;
                const stepsList = document.getElementById('project-steps');
                stepsList.innerHTML = mod.project.steps.map((s, i) => `
                    <li class="flex items-start">
                        <span class="flex-shrink-0 w-6 h-6 rounded-full bg-green-600 text-white flex items-center justify-center text-xs font-bold mr-3 mt-0.5 shadow-sm">${i+1}</span>
                        <span class="text-sm text-gray-800 leading-tight pt-1">${s}</span>
                    </li>
                `).join('');

                this.updateUIState(); // Lock/Unlock Project

                // Render Demo
                const container = document.getElementById('demo-container');
                container.innerHTML = ''; // Clear prev
                mod.renderDemo(container, () => this.markComplete(mod.id));
                
                this.renderNav(); // Re-render nav to update active state
                lucide.createIcons();
            },

            showToast(msg, type = 'info') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = `px-4 py-2 rounded shadow-lg text-white text-sm font-bold animate-in fade-in zoom-in slide-in-from-top-2 ${type === 'error' ? 'bg-red-500' : 'bg-green-600'}`;
                toast.innerHTML = msg;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'transition-opacity');
                    setTimeout(() => toast.remove(), 500);
                }, 3000);
            },

            instructorLogin() {
                if (this.teacherMode) {
                    // Toggle off
                    this.teacherMode = false;
                    document.getElementById('teacher-btn-text').textContent = "Teacher Access";
                    this.showToast("Teacher Mode Disabled", "info");
                    this.loadModule(this.activeModule);
                } else {
                    this.renderLoginModal();
                }
            },

            renderLoginModal() {
                const existing = document.getElementById('login-modal');
                if (existing) existing.remove();

                const modal = document.createElement('div');
                modal.id = 'login-modal';
                modal.className = "fixed inset-0 bg-black/50 flex items-center justify-center z-50 backdrop-blur-sm animate-in fade-in";
                modal.innerHTML = `
                    <div class="bg-white p-6 rounded-lg shadow-xl border w-80 animate-in zoom-in">
                        <h3 class="font-bold text-lg mb-4 text-gray-800">Instructor Access</h3>
                        <p class="text-xs text-gray-500 mb-2">Enter password to unlock solutions.</p>
                        <input type="password" id="teacher-pw-input" class="w-full border p-2 rounded mb-4 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Password" onkeydown="if(event.key==='Enter') window.app.checkLogin()">
                        <div class="flex justify-end space-x-2">
                            <button onclick="document.getElementById('login-modal').remove()" class="px-3 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded">Cancel</button>
                            <button onclick="window.app.checkLogin()" class="px-3 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700">Login</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
                setTimeout(() => document.getElementById('teacher-pw-input').focus(), 100);
            },

            checkLogin() {
                const pw = document.getElementById('teacher-pw-input').value;
                if (pw === 'teacher') {
                    // Toggle on
                    this.teacherMode = true;
                    // Unlock all
                    MODULES.forEach(m => this.completed[m.id] = true);
                    this.updateProgress();
                    document.getElementById('teacher-btn-text').textContent = "Teacher Mode Active";
                    this.showToast("Teacher Mode Enabled", "success");
                    document.getElementById('login-modal').remove();
                    this.loadModule(this.activeModule);
                } else {
                    const input = document.getElementById('teacher-pw-input');
                    input.classList.add('border-red-500', 'bg-red-50');
                    input.value = '';
                    input.placeholder = "Incorrect Password";
                }
            },

            updateUIState() {
                // Logic separated to avoid full reload on complete
                const mod = MODULES[this.activeModule];
                const isComplete = this.completed[mod.id];
                const projCard = document.getElementById('project-card');
                const lock = document.getElementById('project-lock');
                const demoStatus = document.getElementById('demo-status');

                if (isComplete) {
                    projCard.classList.replace('opacity-90', 'opacity-100');
                    projCard.classList.replace('bg-gray-50', 'bg-white');
                    projCard.classList.replace('border-gray-200', 'border-blue-200');
                    lock.classList.add('hidden');
                    demoStatus.classList.remove('hidden');
                } else {
                    projCard.classList.replace('opacity-100', 'opacity-90');
                    projCard.classList.replace('bg-white', 'bg-gray-50');
                    projCard.classList.replace('border-blue-200', 'border-gray-200');
                    lock.classList.remove('hidden');
                    demoStatus.classList.add('hidden');
                }
            },

            markComplete(id) {
                if (!this.completed[id]) {
                    this.completed[id] = true;
                    this.updateProgress();
                    this.renderNav();
                    
                    // If we are currently on this module, just update UI elements
                    // instead of reloading the whole module (which kills demo state)
                    if (MODULES[this.activeModule].id === id) {
                        this.updateUIState();
                    }
                }
            },

            updateProgress() {
                const percent = (Object.keys(this.completed).length / MODULES.length) * 100;
                document.getElementById('progress-bar').style.width = `${percent}%`;
            },

            renderNav() {
                const nav = document.getElementById('module-nav');
                nav.innerHTML = MODULES.map((m, i) => {
                    const isActive = i === this.activeModule;
                    const isDone = this.completed[m.id];
                    return `
                        <button onclick="window.app.loadModule(${i})" class="w-full text-left px-4 py-3 rounded-lg flex items-center justify-between group transition-all duration-200 ${isActive ? 'bg-blue-600 text-white shadow-md' : 'text-gray-600 hover:bg-slate-100 hover:text-blue-600'}">
                            <div class="flex items-center space-x-3">
                                <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold border ${isActive ? 'bg-white/20 border-transparent text-white' : 'bg-white border-gray-300 text-gray-500'}">${i+1}</div>
                                <span class="text-sm font-medium truncate">${m.title.split('. ')[1] || m.title}</span>
                            </div>
                            ${isDone ? `<i data-lucide="check-circle" class="w-4 h-4 ${isActive ? 'text-white' : 'text-green-500'}"></i>` : ''}
                        </button>
                    `;
                }).join('');
            },

            downloadFiles() {
                const link = document.createElement('a');
                link.href = WORKBOOK_FILENAME;
                link.download = WORKBOOK_FILENAME;
                link.target = "_blank"; // Safety for some browsers
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        };

        // --- GLOBAL DRAG HANDLER ---
        document.addEventListener('mousedown', function(e) {
            if (e.target.closest('.draggable')) {
                const el = e.target.closest('.draggable');
                let offsetX = e.clientX - el.getBoundingClientRect().left;
                let offsetY = e.clientY - el.getBoundingClientRect().top;
                
                // Allow absolute positioning if not set
                if (window.getComputedStyle(el).position !== 'absolute') {
                    el.style.position = 'absolute';
                }

                function onMouseMove(e) {
                    const parentRect = el.parentElement.getBoundingClientRect();
                    const newLeft = e.clientX - parentRect.left - offsetX;
                    const newTop = e.clientY - parentRect.top - offsetY;
                    
                    el.style.left = newLeft + 'px';
                    el.style.top = newTop + 'px';
                    el.style.bottom = 'auto'; 
                    el.style.right = 'auto';
                }

                function onMouseUp() {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                }

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            }
        });

        // 7. References
        function renderReferencesDemo(container, onComplete) {
            let inputFormula = "";
            let c2_display = ""; 
            let c3_val = "";
            let c4_val = "";
            let status = "init";
            let errorMsg = "";

            const data = { rows: [{B: 100}, {B: 200}, {B: 300}], K1: 0.05 };

            // Simple parser logic (simulating locked vs unlocked)
            const evaluate = (f, rowIndex) => {
                let clean = f.toUpperCase().replace(/\s/g, '');
                if (!clean.startsWith('=')) return { value: "#ERR", isError: true };
                
                // Check if K1 is locked
                const isLocked = clean.includes('$K$1');
                const isK1 = clean.includes('K1');
                
                if (!isK1 && !isLocked) return { value: "#ERR", isError: true }; // Must use K1

                const val = data.rows[rowIndex].B;
                // If row > 0 (dragged down) and NOT locked, K becomes K2 (empty/0)
                const rate = (rowIndex === 0 || isLocked) ? 0.05 : 0;
                
                return { value: "$" + (val * rate).toFixed(0), isError: false };
            }

            const render = () => {
                container.innerHTML = `
                <div class="h-full flex flex-col">
                    <div class="p-4 bg-blue-50 text-center text-sm border-b border-blue-100 text-blue-800">

                        <br><span class="text-xs text-gray-500">Hint: =B2*$K$1</span>
                    </div>
                    <div class="flex-1 bg-slate-100 flex justify-center items-center p-8 flex-col">
                        <div class="bg-white border shadow-lg rounded select-none w-96">
                            <div class="flex text-center text-xs font-bold bg-gray-100 border-b">
                                <div class="w-8 py-2 border-r"></div>
                                <div class="flex-1 py-2 border-r">B (Sales)</div>
                                <div class="flex-1 py-2 border-r bg-yellow-50">C (Tax)</div>
                                <div class="w-16 py-2 bg-green-50">K (Rate)</div>
                            </div>
                            <!-- Row 1 -->
                            <div class="flex border-b h-10 items-center text-sm">
                                <div class="w-8 bg-gray-50 text-center text-xs text-gray-400 border-r h-full flex items-center justify-center">1</div>
                                <div class="flex-1 px-2 border-r text-right bg-gray-50"></div>
                                <div class="flex-1 px-2 border-r bg-gray-50"></div>
                                <div class="w-16 px-2 text-center font-bold text-green-700 bg-green-50">5%</div>
                            </div>
                            <!-- Row 2 -->
                            <div class="flex border-b h-10 items-center text-sm">
                                <div class="w-8 bg-gray-50 text-center text-xs text-gray-400 border-r h-full flex items-center justify-center">2</div>
                                <div class="flex-1 px-2 border-r text-right">$100</div>
                                <div class="flex-1 border-r bg-yellow-50 relative h-full flex items-center px-1 group cursor-text" onclick="window.editFormula()">
                                    ${status === 'init' || status === 'error' ? 
                                    `<input id="formula-in" class="w-full h-full bg-transparent px-1 outline-none font-mono text-xs" placeholder="=..." value="${inputFormula}" oninput="window.updateFormula(this.value)" onkeydown="if(event.key==='Enter') window.calculateC2(this.value)" onclick="event.stopPropagation()" autofocus>` : 
                                    `<div class="w-full text-right font-mono select-none">${c2_display}</div>`
                                    }
                                    ${status !== 'init' && status !== 'error' ? `<div onclick="event.stopPropagation(); window.doFill()" class="absolute -bottom-1 -right-1 w-2 h-2 bg-green-600 border border-white cursor-pointer hover:scale-150 transition-transform shadow-sm z-20"></div>` : ''}
                                </div>
                                <div class="w-16 bg-gray-50"></div>
                            </div>
                            <!-- Row 3 -->
                            <div class="flex border-b h-10 items-center text-sm">
                                <div class="w-8 bg-gray-50 text-center text-xs text-gray-400 border-r h-full flex items-center justify-center">3</div>
                                <div class="flex-1 px-2 border-r text-right">$200</div>
                                <div class="flex-1 px-2 border-r bg-gray-50 text-right font-mono text-gray-600">${c3_val}</div>
                                <div class="w-16 bg-gray-50"></div>
                            </div>
                            <!-- Row 4 -->
                            <div class="flex border-b h-10 items-center text-sm">
                                <div class="w-8 bg-gray-50 text-center text-xs text-gray-400 border-r h-full flex items-center justify-center">4</div>
                                <div class="flex-1 px-2 border-r text-right">$300</div>
                                <div class="flex-1 px-2 border-r bg-gray-50 text-right font-mono text-gray-600">${c4_val}</div>
                                <div class="w-16 bg-gray-50"></div>
                            </div>
                        </div>
                        ${errorMsg ? `<div class="mt-4 text-xs text-red-600 bg-red-100 px-2 py-1 rounded animate-bounce">${errorMsg}</div>` : ''}
                    </div>
                    ${status === 'error' ? `<div class="bg-red-100 p-2 text-center text-red-800 text-sm font-bold border-t border-red-200">Oops! Result looked wrong. Did you use $ to lock K1? <button onclick="window.resetRef()" class="underline">Retry</button></div>` : ''}
                    ${status === 'success' ? `<div class="bg-green-100 p-2 text-center text-green-800 text-sm font-bold border-t border-green-200">Success! $K$1 kept the rate fixed.</div>` : ''}
                    
                    ${window.app.teacherMode && status !== 'success' ? `
                        <div class="absolute bottom-4 right-4">
                            <button onclick="window.autoRef()" class="bg-purple-100 text-purple-700 px-3 py-1 rounded text-xs font-bold border border-purple-200 hover:bg-purple-200">
                                Teacher: Auto-Fill
                            </button>
                        </div>
                    ` : ''}
                </div>`;
            };
            window.updateFormula = (v) => { inputFormula = v; errorMsg = ""; };
            window.calculateC2 = (v) => {
                const res = evaluate(v, 0);
                if (res.isError) { errorMsg = "Use formula =B2*$K$1"; } 
                else { c2_display = res.value; status = 'calculated_c2'; errorMsg = ""; }
                render();
            };
            window.doFill = () => {
                const res3 = evaluate(inputFormula, 1);
                const res4 = evaluate(inputFormula, 2);
                c3_val = res3.value; c4_val = res4.value;
                if (c3_val === "$10" && c4_val === "$15") { status = 'success'; onComplete(); } 
                else { status = 'error'; }
                render();
            };
            window.resetRef = () => { status = 'init'; inputFormula = ''; c2_display = ''; c3_val = ''; c4_val = ''; errorMsg = ''; render(); }
            window.editFormula = () => { if(status === 'calculated_c2' || status === 'error') { status = 'init'; render(); } }
            
            window.autoRef = () => {
                inputFormula = "=B2*$K$1";
                window.calculateC2(inputFormula);
                setTimeout(() => window.doFill(), 500);
            }

            render();
        }
