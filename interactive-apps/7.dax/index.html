<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power BI DAX Mastery Lab</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Power BI UI Simulations */
        .pbi-header {
            background-color: #F2C811; /* PBI Yellow */
            color: black;
        }
        
        .da-expression-bar {
            font-family: 'Fira Code', monospace;
            border: 1px solid #d1d1d1;
            background: white;
            position: relative;
            z-index: 40;
        }

        /* IntelliSense Styles */
        .suggestions-box {
            position: absolute;
            background: white;
            border: 1px solid #64748b;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-height: 350px;
            display: flex;
            flex-col: column;
            z-index: 9999; 
            min-width: 400px; /* Wider base */
            max-width: 600px;
            width: auto;
            font-family: 'Segoe UI', sans-serif;
            font-size: 13px;
            border-radius: 6px;
            overflow: hidden;
        }
        
        .suggestions-header {
            background: #f1f5f9;
            padding: 6px 10px;
            cursor: move;
            border-bottom: 1px solid #e2e8f0;
            font-size: 11px;
            color: #475569;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .signature-area {
            background: #fffbeb; /* Yellow-50 */
            padding: 8px 12px;
            border-bottom: 1px solid #fcd34d;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            color: #92400e;
            display: none; /* Hidden by default */
            white-space: normal; /* Allow wrapping if very long */
            word-break: break-word;
            flex-shrink: 0;
        }

        .suggestions-content {
            overflow-y: auto;
            max-height: 250px;
            background-color: white;
        }

        .suggestion-item {
            padding: 8px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #f8fafc;
            white-space: nowrap; 
        }
        .suggestion-item:hover, .suggestion-item.active {
            background-color: #e0f2fe; /* Light Blue hover */
        }
        .icon-table { color: #d97706; } /* Amber */
        .icon-col { color: #2563eb; } /* Blue */
        .icon-func { color: #9333ea; font-weight: bold; } /* Purple */

        /* Animations */
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.3s ease-out forwards;
        }
        
        /* Syntax Highlighting Sim */
        .measure-badge {
            background-color: #e0e7ff;
            color: #3730a3;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .column-badge {
            background-color: #dcfce7;
            color: #166534;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        /* Input Styling */
        input.dax-input {
            padding: 4px 0;
            height: 28px; 
        }

        /* Quiz Styles */
        .quiz-option {
            transition: all 0.2s;
        }
        .quiz-option:hover {
            background-color: #f8fafc;
            border-color: #cbd5e1;
        }
        .quiz-option.selected {
            background-color: #eff6ff;
            border-color: #3b82f6;
            color: #1e40af;
        }
        .quiz-option.correct {
            background-color: #dcfce7;
            border-color: #22c55e;
            color: #14532d;
        }
        .quiz-option.incorrect {
            background-color: #fee2e2;
            border-color: #ef4444;
            color: #7f1d1d;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl flex-shrink-0 z-20">
        <div class="p-6 border-b border-slate-700 bg-slate-800">
            <h1 class="text-xl font-bold text-yellow-400 flex items-center gap-2">
                <i data-lucide="function-square" class="w-6 h-6"></i>
                DAX Master
            </h1>
            <p class="text-xs text-slate-400 mt-1">Foundations to Intermediate</p>
        </div>

        <nav class="flex-1 overflow-y-auto py-4">
            <ul id="module-list" class="space-y-1">
                <!-- Modules injected by JS -->
            </ul>
        </nav>

        <div class="p-4 bg-slate-800 border-t border-slate-700">
            <div class="flex justify-between text-xs mb-2 text-slate-300">
                <span>Course Progress</span>
                <span id="progress-text">0%</span>
            </div>
            <div class="w-full bg-slate-700 rounded-full h-2">
                <div id="progress-bar" class="bg-yellow-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full relative overflow-hidden">
        <!-- Header -->
        <header class="bg-white border-b border-slate-200 px-8 py-5 shadow-sm flex-shrink-0">
            <div class="flex items-center justify-between">
                <div>
                    <h2 id="current-module-title" class="text-2xl font-bold text-slate-800">Loading...</h2>
                    <p id="current-module-subtitle" class="text-slate-500 text-sm mt-1">Interactive Code Lab</p>
                </div>
                <div class="flex gap-3">
                    <button onclick="app.openInstructorModal()" class="text-xs px-3 py-2 text-amber-600 bg-amber-50 hover:bg-amber-100 border border-amber-200 rounded-lg flex items-center gap-2 transition-colors">
                        <i data-lucide="key" class="w-3 h-3"></i> Instructor
                    </button>
                    <div class="w-px h-8 bg-slate-200 mx-1"></div>
                    <button onclick="app.resetCurrentModule()" class="text-sm px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg flex items-center gap-2 transition-colors">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Reset
                    </button>
                </div>
            </div>
        </header>

        <!-- Scrollable Content Area -->
        <div class="flex-1 overflow-y-auto p-8 space-y-6 bg-slate-50" id="main-content-area">
            
            <!-- Top Row: Cards -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 h-[280px]">
                
                <!-- Concept Card -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full animate-fade-in" style="animation-delay: 0.1s">
                    <div class="bg-yellow-50 px-6 py-3 border-b border-yellow-100 flex items-center gap-2">
                        <i data-lucide="book-open" class="w-4 h-4 text-yellow-600"></i>
                        <h3 class="font-semibold text-yellow-900">Concept & Syntax</h3>
                    </div>
                    <div id="concept-content" class="p-6 text-sm leading-relaxed text-slate-600 flex-1 overflow-y-auto">
                        <!-- Content Injected Here -->
                    </div>
                </div>

                <!-- Instructions Card -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full animate-fade-in" style="animation-delay: 0.2s">
                    <div class="bg-slate-50 px-6 py-3 border-b border-slate-200 flex items-center gap-2">
                        <i data-lucide="check-square" class="w-4 h-4 text-slate-600"></i>
                        <h3 class="font-semibold text-slate-900">Lab Objectives</h3>
                    </div>
                    <div class="p-6 flex-1 flex flex-col overflow-y-auto">
                        <h4 id="project-title" class="font-bold text-slate-800 mb-2"></h4>
                        <p id="project-brief" class="text-sm text-slate-600 mb-4"></p>
                        <div class="mt-auto bg-slate-50 rounded-lg p-4 border border-slate-100" id="instructions-box">
                            <ul id="project-steps" class="space-y-2 text-sm text-slate-700">
                                <!-- Steps Injected Here -->
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom Row: Interactive Demo -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden animate-fade-in flex flex-col flex-1 min-h-[400px]" style="animation-delay: 0.3s">
                <div class="bg-slate-50 px-6 py-3 border-b border-slate-200 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <i data-lucide="terminal" class="w-4 h-4 text-slate-600"></i>
                        <h3 class="font-semibold text-slate-800">DAX Workbench</h3>
                    </div>
                    <div id="demo-status" class="text-xs font-medium px-2 py-1 rounded bg-slate-200 text-slate-600">Waiting for input...</div>
                </div>
                
                <!-- Demo Container -->
                <div id="demo-container" class="p-6 relative flex-1 bg-slate-100 flex flex-col">
                    <!-- Dynamic Demo Content -->
                </div>
            </div>

        </div>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 bg-emerald-600 text-white px-6 py-4 rounded-lg shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-3">
        <div class="bg-emerald-500 p-1 rounded-full">
            <i data-lucide="check" class="w-4 h-4 text-white"></i>
        </div>
        <div>
            <h4 class="font-bold text-sm">Correct!</h4>
            <p class="text-xs opacity-90">Module complete.</p>
        </div>
    </div>

    <!-- Password Modal -->
    <div id="password-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-2xl p-6 w-full max-w-sm transform transition-all scale-95 opacity-0 duration-200">
            <div class="flex items-center gap-3 mb-4">
                <div class="p-2 bg-amber-100 rounded-lg">
                    <i data-lucide="lock-keyhole" class="w-5 h-5 text-amber-600"></i>
                </div>
                <h3 class="font-bold text-slate-800">Instructor Access</h3>
            </div>
            <p class="text-sm text-slate-500 mb-4">Enter password to solve current module.</p>
            <input type="password" id="instructor-password-input" 
                   class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-4 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none" 
                   placeholder="Password (teacher)">
            <div class="flex justify-end gap-2">
                <button onclick="app.closeInstructorModal()" class="px-3 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
                <button onclick="app.submitInstructorPassword()" class="px-4 py-2 text-sm bg-amber-600 hover:bg-amber-700 text-white rounded-lg font-medium">Unlock</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. DATA & METADATA ---
        
        const DAX_METADATA = {
            tables: ['Sales', 'Products', 'Calendar', 'Customer'],
            columns: {
                'Sales': ['Sales[Amount]', 'Sales[Quantity]', 'Sales[Net Price]', 'Sales[Date]', 'Sales[OrderNo]'],
                'Products': ['Products[Product Name]', 'Products[Color]', 'Products[Category]'],
                'Calendar': ['Calendar[Date]', 'Calendar[Year]', 'Calendar[Month]'],
                'Customer': ['Customer[FirstName]', 'Customer[LastName]', 'Customer[FullName]']
            },
            functions: [
                { name: 'SUM', sig: 'SUM(<column>)' },
                { name: 'AVERAGE', sig: 'AVERAGE(<column>)' },
                { name: 'COUNTROWS', sig: 'COUNTROWS(<table>)' },
                { name: 'DISTINCTCOUNT', sig: 'DISTINCTCOUNT(<column>)' },
                { name: 'DIVIDE', sig: 'DIVIDE(<numerator>, <denominator>, [alternate_result])' },
                { name: 'COALESCE', sig: 'COALESCE(<expression>, <value_if_blank>)' },
                { name: 'CALCULATE', sig: 'CALCULATE(<expression>, [filter1], ...)' },
                { name: 'FILTER', sig: 'FILTER(<table>, <filter_expression>)' },
                { name: 'TOTALYTD', sig: 'TOTALYTD(<expression>, <dates>)' },
                { name: 'SAMEPERIODLASTYEAR', sig: 'SAMEPERIODLASTYEAR(<dates>)' },
                { name: 'RANKX', sig: 'RANKX(<table>, <expression>, [value], [order], [ties])' },
                { name: 'SELECTEDVALUE', sig: 'SELECTEDVALUE(<column>, [alternate_result])' },
                { name: 'SUMX', sig: 'SUMX(<table>, <expression>)' },
                { name: 'AVERAGEX', sig: 'AVERAGEX(<table>, <expression>)' },
                { name: 'MINX', sig: 'MINX(<table>, <expression>)' },
                { name: 'MAXX', sig: 'MAXX(<table>, <expression>)' },
                { name: 'CONCATENATEX', sig: 'CONCATENATEX(<table>, <expression>, [delimiter])' },
                { name: 'ALL', sig: 'ALL([table_or_column])' },
                { name: 'ALLEXCEPT', sig: 'ALLEXCEPT(<table>, <column1>, ...)' },
                { name: 'CONCATENATE', sig: 'CONCATENATE(<text1>, <text2>)' },
                { name: 'FORMAT', sig: 'FORMAT(<value>, <format_string>)' },
                { name: 'RELATED', sig: 'RELATED(<column>)' }
            ]
        };

        const QUIZ_DATA = [
            {
                q: "You need to create a unique ID for each order by combining 'ORD-' with the Order Number. Which function should you use?",
                context: { header: ["OrderNo"], rows: [["1001"], ["1002"]] },
                options: ["SUM", "DIVIDE", "CONCATENATE (or &)", "COUNTROWS"],
                correct: 2,
                expl: "<strong>CONCATENATE</strong> or the <strong>&</strong> operator joins text strings together."
            },
            {
                q: "You want to calculate the total sales for 'Red' products only, regardless of what the user selects in a slicer. How do you construct the formula?",
                context: { header: ["Color", "Sales"], rows: [["Red", "100"], ["Blue", "200"]] },
                options: [
                    "SUM(Sales[Amount])",
                    "CALCULATE(SUM(Sales[Amount]), Products[Color] = 'Red')",
                    "CALCULATE(SUM(Sales[Amount]), ALL(Products[Color]))",
                    "FILTER(Sales, Products[Color] = 'Red')"
                ],
                correct: 1,
                expl: "<strong>CALCULATE</strong> modifies the context. Adding the filter <code>Products[Color] = 'Red'</code> restricts the calculation to Red products."
            },
            {
                q: "You have a table with Quantity and UnitPrice. You need the Total Sales Amount. You cannot simply SUM the columns directly. Which function iterates row-by-row?",
                context: { header: ["Qty", "Price"], rows: [["2", "10"], ["5", "20"]] },
                options: ["SUM", "AVERAGEX", "SUMX", "COUNTROWS"],
                correct: 2,
                expl: "<strong>SUMX</strong> is an iterator. It goes row-by-row, calculates <code>Qty * Price</code>, and then sums the results."
            },
            {
                q: "You are in the 'Sales' table (Fact) and need to fetch the 'Product Name' from the 'Products' table (Dimension) to create a Calculated Column. Which function do you use?",
                context: { header: ["ProdID", "RelatedName?"], rows: [["P01", "Widget A"], ["P02", "Widget B"]] },
                options: ["LOOKUPVALUE", "RELATED", "CALCULATE", "SUM"],
                correct: 1,
                expl: "<strong>RELATED</strong> follows an existing Many-to-One relationship to fetch data from the 'One' side (Dimension) to the 'Many' side (Fact)."
            },
            {
                q: "You need to count how many orders had a Sales Amount greater than 500. Which formula correctly returns this count?",
                context: { header: ["Order", "Amount"], rows: [["101", "600"], ["102", "200"]] },
                options: [
                    "COUNTROWS(FILTER(Sales, Sales[Amount] > 500))",
                    "SUMX(Sales, Sales[Amount] > 500)",
                    "CALCULATE(Sales[Amount] > 500)",
                    "COUNT(Sales[Amount])"
                ],
                correct: 0,
                expl: "<strong>COUNTROWS</strong> counts rows in a table. <strong>FILTER</strong> returns a table reduced to only rows where Amount > 500."
            }
        ];

        const MODULES = [
            {
                id: "mod_text",
                title: "Text Manipulation",
                concept: `
                    <p class="mb-3">You can join text strings together. These are typically used in <strong>Calculated Columns</strong> to create new fields.</p>
                    <div class="bg-slate-50 p-3 rounded border mb-3 text-xs">
                        <p class="mb-1"><strong>Ampersand (&)</strong>: The simplest way to join text.</p>
                        <code class="block text-blue-600 mb-2">[First Name] & " " & [Last Name]</code>
                        <p class="mb-1"><strong>CONCATENATE</strong>: Joins exactly two strings.</p>
                    </div>
                `,
                project: {
                    title: "Create Labels",
                    brief: "Create a Full Name column and a unique Order Label.",
                    steps: [
                        "Create <strong>Full Name</strong> column by joining FirstName, a space, and LastName.",
                        "Create <strong>Order Label</strong> column by joining 'ORD-' and the OrderNo."
                    ]
                },
                inputs: [
                    { label: "Full Name", type: "column", result: ["John Doe", "Jane Smith", "Bob Jones"], match: /Customer\[FirstName\]\s*&\s*" "\s*&\s*Customer\[LastName\]/i, hint: "Customer[FirstName] & \" \" & Customer[LastName]" },
                    { label: "Order Label", type: "column", result: ["ORD-1001", "ORD-1002", "ORD-1003", "ORD-1004"], match: /"ORD-"\s*&\s*Sales\[OrderNo\]/i, hint: "\"ORD-\" & Sales[OrderNo]" }
                ],
                renderDemo: (container, onComplete) => renderGridDemo(container, MODULES[0].inputs, onComplete, "Customer")
            },
            {
                id: "mod_math",
                title: "Safe Math & Defaults",
                concept: `
                    <p class="mb-3">Handling errors is crucial. We will create a <strong>Calculated Column</strong> for line-item safety.</p>
                    <div class="space-y-3">
                        <div class="bg-blue-50 p-2 rounded border border-blue-100">
                            <strong class="text-blue-700">DIVIDE</strong><br>
                            <span class="text-xs">Safely divides. If denominator is 0, returns 0 (optional). <br><code>DIVIDE(Num, Denom, 0)</code></span>
                        </div>
                        <div class="bg-purple-50 p-2 rounded border border-purple-100">
                            <strong class="text-purple-700">COALESCE</strong><br>
                            <span class="text-xs">Returns first non-blank. <br><code>COALESCE([Column], 0)</code></span>
                        </div>
                    </div>
                `,
                project: {
                    title: "Handle Zeroes & Blanks",
                    brief: "Create a safe 'Price Per Unit' column. Some rows have 0 Quantity.",
                    steps: [
                        "Calculate <strong>Safe Price</strong> column using DIVIDE (Amount / Quantity, 0).",
                        "Calculate <strong>No Blanks</strong> column using COALESCE on Safe Price."
                    ]
                },
                inputs: [
                    { label: "Safe Price", type: "column", result: ["250", "100", "0", "200"], match: /DIVIDE\s*\(\s*Sales\[Amount\]\s*,\s*Sales\[Quantity\]\s*,\s*0\s*\)/i, hint: "DIVIDE(Sales[Amount], Sales[Quantity], 0)" },
                    { label: "No Blanks", type: "column", result: ["250", "100", "0", "200"], match: /COALESCE\s*\(\s*Sales\[Safe Price\]\s*,\s*0\s*\)/i, hint: "COALESCE(Sales[Safe Price], 0)" }
                ],
                renderDemo: (container, onComplete) => renderGridDemo(container, MODULES[1].inputs, onComplete)
            },
            {
                id: "mod_context_theory",
                title: "Context Theory",
                concept: `
                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <div class="bg-slate-50 p-2 rounded border">
                            <strong class="text-xs uppercase text-slate-500">Calculated Column</strong>
                            <p class="text-xs mt-1">Calculated <strong>row-by-row</strong> at data refresh time. Stored in memory (RAM). Aware of the "current row".</p>
                        </div>
                        <div class="bg-slate-50 p-2 rounded border">
                            <strong class="text-xs uppercase text-slate-500">Measure</strong>
                            <p class="text-xs mt-1">Calculated <strong>on-the-fly</strong> when used in a visual. Uses <strong>Filter Context</strong> (responds to Slicers/Filters). Does not know "which row" unless you use an Iterator.</p>
                        </div>
                    </div>
                `,
                project: {
                    title: "Column vs. Measure",
                    brief: "Define a Calculated Column (Row Context) vs a Measure (Filter Context).",
                    steps: [
                        "<strong>Column:</strong> Create 'LineTotal' (Qty * Amount) - Static per row.",
                        "<strong>Measure:</strong> Create 'Total Sales' (SUM of LineTotal) - Dynamic."
                    ]
                },
                inputs: [
                    { label: "LineTotal", type: "column", result: ["1000", "100", "0", "200"], match: /Sales\[Quantity\]\s*\*\s*Sales\[Amount\]/i, hint: "Sales[Quantity] * Sales[Amount]" },
                    { label: "Total Sales", type: "measure", result: "1,300", match: /SUM\s*\(\s*Sales\[LineTotal\]\s*\)/i, hint: "SUM(Sales[LineTotal])" }
                ],
                renderDemo: (container, onComplete) => renderGridDemo(container, MODULES[2].inputs, onComplete, "Sales_Iter")
            },
            {
                id: "mod_agg",
                title: "Basic Aggregations",
                concept: `
                    <p class="mb-3">Aggregation functions collapse multiple rows into a single value. These are <strong>Measures</strong>.</p>
                    <ul class="list-disc pl-5 space-y-2 mb-4 text-xs font-mono bg-slate-50 p-3 rounded border">
                        <li><strong>SUM(Col)</strong>: Adds up numbers.</li>
                        <li><strong>AVERAGE(Col)</strong>: Calculates the mean.</li>
                        <li><strong>COUNTROWS(Table)</strong>: Counts total transactions.</li>
                        <li><strong>DISTINCTCOUNT(Col)</strong>: Counts unique values.</li>
                    </ul>
                `,
                project: {
                    title: "Calculate Key Metrics",
                    brief: "Use the Sales table to calculate the core business metrics.",
                    steps: [
                        "Create <strong>Total Sales</strong> using SUM.",
                        "Create <strong>Avg Price</strong> using AVERAGE of Net Price.",
                        "Create <strong>Transaction Count</strong> using COUNTROWS.",
                        "Count <strong>Unique Orders</strong> using DISTINCTCOUNT."
                    ]
                },
                inputs: [
                    { label: "Total Sales", type: "measure", result: "800", match: /SUM\s*\(\s*Sales\[Amount\]\s*\)/i, hint: "SUM(Sales[Amount])" },
                    { label: "Avg Price", type: "measure", result: "200", match: /AVERAGE\s*\(\s*Sales\[Net Price\]\s*\)/i, hint: "AVERAGE(Sales[Net Price])" },
                    { label: "Tx Count", type: "measure", result: "4", match: /COUNTROWS\s*\(\s*Sales\s*\)/i, hint: "COUNTROWS(Sales)" },
                    { label: "Unique Orders", type: "measure", result: "4", match: /DISTINCTCOUNT\s*\(\s*Sales\[OrderNo\]\s*\)/i, hint: "DISTINCTCOUNT(Sales[OrderNo])" }
                ],
                renderDemo: (container, onComplete) => renderGridDemo(container, MODULES[3].inputs, onComplete)
            },
            {
                id: "mod_iter",
                title: "Iterators (Row Context)",
                concept: `
                    <p class="mb-3"><strong>Iterators</strong> (X-functions) create a row context. They iterate row-by-row to evaluate an expression.</p>
                    <div class="space-y-2 mb-3">
                        <div class="bg-slate-100 p-2 rounded border font-mono text-xs">
                            <div class="mb-1 text-slate-500">// General Syntax</div>
                            <div>SUMX( &lt;Table&gt;, &lt;Expression&gt; )</div>

        // --- 3. INTELLISENSE HELPER ---
        function enableIntellisense(inp, container) {
            let dropdown = null;

            // Handle Input changes
            inp.addEventListener('keyup', (e) => {
                const val = inp.value;
                const cursorPos = inp.selectionStart;
                
                // Dropdown Logic
                const textBeforeCursor = val.substring(0, cursorPos);
                const match = textBeforeCursor.match(/([a-zA-Z0-9_\[\]]+)$/);
                
                // Signature Logic
                const lastOpenParen = val.lastIndexOf('(', cursorPos - 1);
                const lastCloseParen = val.lastIndexOf(')', cursorPos - 1);
                let currentSig = "";

                if (lastOpenParen > lastCloseParen) {
                    const beforeParen = val.substring(0, lastOpenParen).trim();
                    const words = beforeParen.split(/[\s,]+/);
                    const funcName = words[words.length - 1].toUpperCase();
                    const meta = DAX_METADATA.functions.find(f => f.name === funcName);
                    if (meta) currentSig = meta.sig;
                }

                if (match || currentSig) {
                    const word = match ? match[1].trim().toLowerCase() : "";
                    
                    let filtered = [];
                    if(word.length > 0) {
                        let suggestions = [];
                        suggestions.push(...DAX_METADATA.functions.map(f => ({ type: 'func', text: f.name })));
                        suggestions.push(...DAX_METADATA.tables.map(t => ({ type: 'table', text: t })));
                        Object.values(DAX_METADATA.columns).flat().forEach(c => {
                            suggestions.push({ type: 'col', text: c });
                        });
                        filtered = suggestions.filter(s => s.text.toLowerCase().includes(word));
                    }

                    if (filtered.length > 0 || currentSig) {
                        if (!dropdown) {
                            dropdown = document.createElement('div');
                            dropdown.className = 'suggestions-box';
                            document.body.appendChild(dropdown);
                            
                            // Initialize Drag
                            // We need to create the structure first
                            dropdown.innerHTML = `
                                <div class="suggestions-header" id="drag-${inp.id}">
                                    <span>Suggestions</span>
                                    <i data-lucide="grip-horizontal" class="w-3 h-3"></i>
                                </div>
                                <div class="signature-area" id="sig-${inp.id}"></div>
                                <div class="suggestions-content" id="list-${inp.id}"></div>
                            `;
                            makeDraggable(dropdown, document.getElementById(`drag-${inp.id}`));
                        }
                        
                        // Positioning
                        const rect = inp.getBoundingClientRect();
                        // Only reset position if it hasn't been moved by user interaction logic
                        if (!dropdown.hasMoved) {
                            // Position ABOVE the input by calculating approximate height
                            // Default 250px height guess to place above
                            dropdown.style.top = (rect.top + window.scrollY - 300) + 'px'; 
                            dropdown.style.left = (rect.left + window.scrollX) + 'px';
                        }

                        // Update Signature
                        const sigArea = document.getElementById(`sig-${inp.id}`);
                        if(currentSig) {
                            sigArea.style.display = 'block';
                            sigArea.innerText = currentSig;
                        } else {
                            sigArea.style.display = 'none';
                        }

                        // Update List
                        const listContainer = document.getElementById(`list-${inp.id}`);
                        listContainer.innerHTML = filtered.map(s => {
                            let icon = '';
                            if(s.type === 'func') icon = '<span class="icon-func">fx</span>';
                            if(s.type === 'table') icon = '<span class="icon-table">▦</span>';
                            if(s.type === 'col') icon = '<span class="icon-col">◫</span>';
                            return `<div class="suggestion-item" onclick="insertSuggestion('${s.text}', '${inp.id}')">${icon} ${s.text}</div>`;
                        }).join('');
                        
                        if(filtered.length === 0 && !currentSig) closeDropdown();
                        lucide.createIcons(); 
                    } else {
                        closeDropdown();
                    }
                } else {
                    closeDropdown();
                }
            });

            function makeDraggable(element, handle) {
                let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
                handle.onmousedown = dragMouseDown;

                function dragMouseDown(e) {
                    e = e || window.event;
                    e.preventDefault();
                    pos3 = e.clientX;
                    pos4 = e.clientY;
                    document.onmouseup = closeDragElement;
                    document.onmousemove = elementDrag;
                    element.hasMoved = true; 
                }

                function elementDrag(e) {
                    e = e || window.event;
                    e.preventDefault();
                    pos1 = pos3 - e.clientX;
                    pos2 = pos4 - e.clientY;
                    pos3 = e.clientX;
                    pos4 = e.clientY;
                    element.style.top = (element.offsetTop - pos2) + "px";
                    element.style.left = (element.offsetLeft - pos1) + "px";
                }

                function closeDragElement() {
                    document.onmouseup = null;
                    document.onmousemove = null;
                }
            }

            function closeDropdown() {
                if(dropdown) { dropdown.remove(); dropdown = null; }
            }
            
            // Allow clicking suggestions before blur
            inp.addEventListener('blur', (e) => {
                setTimeout(() => { closeDropdown(); }, 200);
            });

            window.insertSuggestion = (text, inpId) => {
                const input = document.getElementById(inpId);
                const pos = input.selectionStart;
                const val = input.value;
                const before = val.substring(0, pos);
                const lastWordRegex = /([a-zA-Z0-9_\[\]]+)$/;
                const match = before.match(lastWordRegex);
                const lastWordLen = match ? match[1].length : 0;
                
                const newText = val.substring(0, pos - lastWordLen) + text + val.substring(pos);
                input.value = newText;
                input.focus();
                
                // Trigger keyup to refresh state (e.g. show signature if func selected)
                const event = new Event('keyup');
                input.dispatchEvent(event);
            };
        }

                `;
            } else {
                 headerHTML = `<tr><th class="border p-1">Date</th><th class="border p-1">Product</th><th class="border p-1">Amount</th><th class="border p-1">Qty</th></tr>`;
                 rowsHTML = `
                    <tr><td class="border p-1">1/1/24</td><td class="border p-1">Widget A</td><td class="border p-1">500</td><td class="border p-1">2</td></tr>
                    <tr><td class="border p-1">1/2/24</td><td class="border p-1">Widget B</td><td class="border p-1">100</td><td class="border p-1">1</td></tr>
                    <tr><td class="border p-1">1/3/24</td><td class="border p-1">Widget C</td><td class="border p-1">0</td><td class="border p-1">0</td></tr>
                    <tr><td class="border p-1">1/4/24</td><td class="border p-1">Widget A</td><td class="border p-1">200</td><td class="border p-1">1</td></tr>
                `;
            }

            container.innerHTML = `
                <div class="flex h-full gap-4">
                    <div class="flex-1 flex flex-col">
                        <div class="flex-1 bg-white border rounded shadow-sm p-4 overflow-y-auto">
                           ${inputsHTML}
                        </div>
                    </div>
                    <div class="w-1/3 bg-white border rounded shadow-sm p-0 flex flex-col">
                        <div class="bg-slate-100 p-2 text-xs font-bold border-b text-center">Data Preview (${tableName})</div>
                        <div class="flex-1 overflow-auto p-2">
                            <table class="w-full text-[10px] text-left border-collapse" id="preview-table">
                                <thead class="bg-slate-50 sticky top-0">${headerHTML}</thead>
                                <tbody>${rowsHTML}</tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;

            inputs.forEach((_, idx) => {
                const el = document.getElementById(`dax-inp-${idx}`);
                enableIntellisense(el, el.parentElement.parentElement);
            });

            let completedCount = 0;
            window.validateInput = (idx) => {
                const inputEl = document.getElementById(`dax-inp-${idx}`);
                const statusEl = document.getElementById(`status-${idx}`);
                const resEl = document.getElementById(`res-${idx}`);
                const def = inputs[idx];
                const val = inputEl.value.replace(/\s+/g, ' ').trim(); 

                if (def.match.test(val)) {
                    if(!statusEl.classList.contains('text-green-600')) {
                        statusEl.innerHTML = `<i data-lucide="check-circle" class="w-3 h-3 inline text-green-600"></i>`;
                        inputEl.classList.add('text-green-700', 'font-bold');
                        inputEl.disabled = true;
                        
                        // Show Result
                        if (def.type === 'measure') {
                            resEl.innerHTML = `<strong>Result:</strong> ${def.result}`;
                            resEl.classList.remove('hidden');
                        } else if (def.type === 'column' && Array.isArray(def.result)) {
                            // Append column to table
                            const tbl = document.getElementById('preview-table');
                            const headRow = tbl.querySelector('thead tr');
                            headRow.innerHTML += `<th class="border p-1 bg-green-50 text-green-700">${def.label}</th>`;
                            const rows = tbl.querySelectorAll('tbody tr');
                            rows.forEach((r, i) => {
                                let val = def.result[i] || "";
                                r.innerHTML += `<td class="border p-1 bg-green-50 font-bold">${val}</td>`;
                            });
                        }

                        lucide.createIcons();
                        completedCount++;
                        if(completedCount === inputs.length) onComplete();
                    }
                } else {
                    inputEl.classList.add('bg-red-50');
                    setTimeout(() => inputEl.classList.remove('bg-red-50'), 500);
                }
            };

            // Improved Auto Solver with Delay
            window.currentSolver = async () => {
                for(let i=0; i<inputs.length; i++) {
                     const def = inputs[i];
                     const el = document.getElementById(`dax-inp-${i}`);
                     el.value = def.hint;
                     validateInput(i);
                     await new Promise(r => setTimeout(r, 1000)); // Delay for visual feedback
                }
            };
        }

        // Module 9: Slicer/Visual Renderer
        function renderSlicerDemo(container, inputs, onComplete) {
            let inputsHTML = inputs.map((inp, idx) => `
                <div class="da-expression-bar p-2 mb-3 rounded shadow-sm flex flex-col gap-1 relative">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span class="measure-badge">Measure</span>
                            <span class="text-xs font-bold text-slate-500">${inp.label} =</span>
                        </div>
                        <div id="status-${idx}" class="text-xs"></div>
                    </div>
                    <div class="flex gap-2">
                        <input id="dax-inp-${idx}" class="dax-input w-full text-sm font-mono outline-none text-slate-700" placeholder="Type DAX..." autocomplete="off">
                        <button onclick="validateInput(${idx})" class="bg-yellow-400 hover:bg-yellow-500 text-black text-xs px-3 py-1 rounded font-bold transition-colors">✓</button>
                    </div>
                    <div id="res-${idx}" class="hidden text-xs text-slate-500 bg-slate-50 p-1 border-t mt-1 font-mono"></div>
                </div>
            `).join('');

            container.innerHTML = `
                <div class="flex h-full gap-4">
                    <div class="flex-1 flex flex-col gap-4">
                        <div class="bg-white border rounded shadow-sm p-4">
                           ${inputsHTML}
                        </div>
                        <!-- Extended Data Table -->
                        <div class="flex-1 bg-white border rounded shadow-sm p-2 flex flex-col overflow-hidden">
                            <div class="text-[10px] font-bold border-b pb-1 mb-1">Data Context (Sales)</div>
                            <div class="overflow-auto">
                                <table class="w-full text-[9px] text-left border-collapse">
                                    <thead class="bg-slate-50 sticky top-0"><tr><th class="border p-1">Category</th><th class="border p-1">Product</th><th class="border p-1">Amount</th></tr></thead>
                                    <tbody id="slicer-data-table">
                                        <!-- Injected by JS -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="w-1/3 flex flex-col gap-2">
                        <!-- Slicer Sim -->
                        <div class="bg-white border rounded shadow-sm p-2">
                            <div class="text-[10px] uppercase font-bold text-slate-400 mb-1">Slicer: Category</div>
                            <div class="space-y-1" id="slicer-container">
                                <div class="slicer-item text-xs p-1 cursor-pointer border rounded flex items-center justify-between bg-blue-50 border-blue-200" onclick="toggleSlicer(this, 'Electronics')">
                                    <span>Electronics</span>
                                    <i data-lucide="check" class="w-3 h-3 text-blue-500"></i>
                                </div>
                                <div class="slicer-item text-xs p-1 cursor-pointer border rounded hover:bg-slate-50" onclick="toggleSlicer(this, 'Clothing')">Clothing</div>
                                <div class="slicer-item text-xs p-1 cursor-pointer border rounded hover:bg-slate-50" onclick="toggleSlicer(this, 'Home')">Home</div>
                            </div>
                        </div>
                        <!-- Visual Sim -->
                        <div class="flex-1 bg-white border rounded shadow-sm p-2 flex flex-col relative min-h-[150px]">
                             <div class="text-[10px] uppercase font-bold text-slate-400 mb-1">Visual</div>
                             <div class="absolute inset-0 top-6 flex items-center justify-center bg-slate-50 opacity-90 z-10" id="vis-overlay">
                                <span class="text-xs text-slate-500">Enter DAX to render</span>
                             </div>
                             <div class="flex-1 flex flex-col gap-2">
                                <h4 class="font-bold text-sm text-center border-b pb-1" id="chart-title">Sales by Rank</h4>
                                <div class="flex-1 flex items-end justify-around gap-1 px-2 pb-2" id="bar-chart-container">
                                    <!-- Dynamic Bars -->
                                </div>
                             </div>
                        </div>
                    </div>
                </div>
            `;

            // Extended Data
            const salesData = [
                {cat: "Electronics", prod: "Laptop", amt: 1200},
                {cat: "Electronics", prod: "Smartphone", amt: 800},
                {cat: "Electronics", prod: "Tablet", amt: 600},
                {cat: "Electronics", prod: "Monitor", amt: 300},
                {cat: "Clothing", prod: "Jacket", amt: 150},
                {cat: "Clothing", prod: "Jeans", amt: 100},
                {cat: "Clothing", prod: "Shirt", amt: 50},
                {cat: "Clothing", prod: "Hat", amt: 20},
                {cat: "Home", prod: "Sofa", amt: 500},
                {cat: "Home", prod: "Table", amt: 200},
                {cat: "Home", prod: "Chair", amt: 100},
                {cat: "Home", prod: "Lamp", amt: 40}
            ];

            // Render Table
            const tbody = document.getElementById('slicer-data-table');
            salesData.forEach(r => {
                tbody.innerHTML += `<tr><td class="border p-1">${r.cat}</td><td class="border p-1">${r.prod}</td><td class="border p-1">${r.amt}</td></tr>`;
            });
            
            // Logic to render Chart
            const renderChart = (category) => {
                const filtered = salesData.filter(d => d.cat === category).sort((a,b) => b.amt - a.amt).slice(0,3);
                const max = filtered[0].amt;
                const container = document.getElementById('bar-chart-container');
                
                container.innerHTML = filtered.map((d, i) => {
                    const height = (d.amt / max) * 100;
                    const colors = ["bg-blue-600", "bg-blue-400", "bg-blue-200"];
                    return `
                        <div class="w-8 ${colors[i]} rounded-t relative group flex flex-col justify-end items-center transition-all duration-500" style="height: ${height}%">
                            <div class="text-[9px] font-bold text-white mb-1">${i+1}</div>
                            <div class="absolute bottom-[-15px] text-[8px] text-slate-500 truncate w-12 text-center">${d.prod}</div>
                        </div>
                    `;
                }).join('');
                document.getElementById('chart-title').innerText = `${category} Sales Top 3`;
            };

            // Initial Render
            renderChart('Electronics');

            // Slicer Logic
            window.toggleSlicer = (el, cat) => {
                const items = document.querySelectorAll('.slicer-item');
                items.forEach(i => {
                    i.className = 'slicer-item text-xs p-1 cursor-pointer border rounded hover:bg-slate-50';
                    i.innerHTML = i.innerText.trim(); // Reset content
                });
                el.className = 'slicer-item text-xs p-1 cursor-pointer border rounded flex items-center justify-between bg-blue-50 border-blue-200';
                el.innerHTML = `<span>${cat}</span><i data-lucide="check" class="w-3 h-3 text-blue-500"></i>`;
                lucide.createIcons();
                
                renderChart(cat);
            };

            inputs.forEach((_, idx) => {
                const el = document.getElementById(`dax-inp-${idx}`);
                enableIntellisense(el, el.parentElement.parentElement);
            });

            let completedCount = 0;
            window.validateInput = (idx) => {
                const inputEl = document.getElementById(`dax-inp-${idx}`);
                const statusEl = document.getElementById(`status-${idx}`);
                const resEl = document.getElementById(`res-${idx}`);
                const def = inputs[idx];
                const val = inputEl.value.replace(/\s+/g, ' ').trim(); 

                if (def.match.test(val)) {
                    if(!statusEl.classList.contains('text-green-600')) {
                        statusEl.innerHTML = `<i data-lucide="check-circle" class="w-3 h-3 inline text-green-600"></i>`;
                        inputEl.classList.add('text-green-700', 'font-bold');
                        inputEl.disabled = true;
                        
                        // Show Result
                        if (def.result) {
                            resEl.innerHTML = `<strong>Result:</strong> ${def.result}`;
                            resEl.classList.remove('hidden');
                        }

                        lucide.createIcons();
                        completedCount++;
                        
                        if(completedCount === inputs.length) {
                             document.getElementById('vis-overlay').classList.add('hidden');
                             onComplete();
                        }
                    }
                } else {
                    inputEl.classList.add('bg-red-50');
                    setTimeout(() => inputEl.classList.remove('bg-red-50'), 500);
                }
            };

            window.currentSolver = async () => {
                for(let i=0; i<inputs.length; i++) {
                    const def = inputs[i];
                    const el = document.getElementById(`dax-inp-${i}`);
                    el.value = def.hint;
                    validateInput(i);
                    await new Promise(r => setTimeout(r, 1000));
                }
            };
        }

        // Module 10: Quiz Renderer
        function renderQuizDemo(container, onComplete) {
            container.innerHTML = `
                <div class="flex flex-col h-full bg-white border rounded shadow-sm overflow-hidden">
                    <div class="bg-slate-100 p-3 border-b flex justify-between items-center">
                        <span class="font-bold text-sm text-slate-700">Question <span id="q-num">1</span> of 5</span>
                        <div class="flex gap-1" id="q-dots">
                            <div class="w-2 h-2 rounded-full bg-slate-300"></div>
                            <div class="w-2 h-2 rounded-full bg-slate-300"></div>
                            <div class="w-2 h-2 rounded-full bg-slate-300"></div>
                            <div class="w-2 h-2 rounded-full bg-slate-300"></div>
                            <div class="w-2 h-2 rounded-full bg-slate-300"></div>
                        </div>
                    </div>
                    <div class="flex-1 p-6 flex flex-col overflow-y-auto">
                        <div id="quiz-content" class="flex-1">
                            <!-- Question injected here -->
                        </div>
                        <div class="mt-4 flex justify-end">
                            <button id="btn-next-q" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-bold disabled:opacity-50" disabled>Next Question</button>
                        </div>
                    </div>
                </div>
            `;

            let currentQ = 0;
            
            const renderQ = () => {
                const q = QUIZ_DATA[currentQ];
                document.getElementById('q-num').innerText = currentQ + 1;
                
                // Update dots
                const dots = document.getElementById('q-dots').children;
                for(let i=0; i<5; i++) {
                    dots[i].className = `w-2 h-2 rounded-full ${i === currentQ ? 'bg-blue-500' : (i < currentQ ? 'bg-green-500' : 'bg-slate-300')}`;
                }

                // Render Table
                let tableHTML = `<table class="w-full text-xs text-left border mb-4"><thead class="bg-slate-50"><tr>`;
                q.context.header.forEach(h => tableHTML += `<th class="border p-2">${h}</th>`);
                tableHTML += `</tr></thead><tbody>`;
                q.context.rows.forEach(r => {
                    tableHTML += `<tr>`;
                    r.forEach(c => tableHTML += `<td class="border p-2">${c}</td>`);
                    tableHTML += `</tr>`;
                });
                tableHTML += `</tbody></table>`;

                const content = document.getElementById('quiz-content');
                content.innerHTML = `
                    <div class="text-sm font-medium mb-4">${q.q}</div>
                    <div class="bg-slate-50 p-2 rounded border mb-4 w-64">${tableHTML}</div>
                    <div class="space-y-2">
                        ${q.options.map((opt, i) => `
                            <div class="quiz-option border rounded p-3 text-sm cursor-pointer" onclick="checkAnswer(${i}, this)">${opt}</div>
                        `).join('')}
                    </div>
                    <div id="explanation" class="hidden mt-4 p-3 bg-blue-50 border border-blue-100 rounded text-xs text-blue-800"></div>
                `;
                
                document.getElementById('btn-next-q').disabled = true;
            };

            window.checkAnswer = (idx, el) => {
                // Prevent multiple clicks
                if(document.querySelector('.quiz-option.correct') || document.querySelector('.quiz-option.incorrect')) return;

                const q = QUIZ_DATA[currentQ];
                if (idx === q.correct) {
                    el.classList.add('correct');
                    el.innerHTML += `<i data-lucide="check" class="w-4 h-4 inline ml-2"></i>`;
                } else {
                    el.classList.add('incorrect');
                    // Highlight correct one
                    const opts = document.querySelectorAll('.quiz-option');
                    opts[q.correct].classList.add('correct');
                }
                
                const exp = document.getElementById('explanation');
                exp.innerHTML = `<strong>Explanation:</strong> ${q.expl}`;
                exp.classList.remove('hidden');
                
                lucide.createIcons();
                document.getElementById('btn-next-q').disabled = false;
            };

            document.getElementById('btn-next-q').onclick = () => {
                if (currentQ < 4) {
                    currentQ++;
                    renderQ();
                } else {
                    onComplete();
                }
            };

            renderQ();

            // Auto Solver for Quiz
            window.currentSolver = async () => {
                const q = QUIZ_DATA[currentQ];
                const opts = document.querySelectorAll('.quiz-option');
                window.checkAnswer(q.correct, opts[q.correct]);
                await new Promise(r => setTimeout(r, 1000));
                document.getElementById('btn-next-q').click();
            };
        }

        window.onload = () => app.init();
    </script>
</body>
</html>
