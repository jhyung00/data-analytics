<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power BI DAX Mastery Lab</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Power BI UI Simulations */
        .pbi-header {
            background-color: #F2C811; /* PBI Yellow */
            color: black;
        }
        
        .da-expression-bar {
            font-family: 'Fira Code', monospace;
            border: 1px solid #d1d1d1;
            background: white;
            position: relative;
            z-index: 40;
        }

        /* IntelliSense Styles */
        .suggestions-box {
            position: absolute;
            background: white;
            border: 1px solid #64748b;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-height: 350px;
            display: flex;
            flex-col: column;
            z-index: 9999; 
            min-width: 400px;
            max-width: 600px;
            width: auto;
            font-family: 'Segoe UI', sans-serif;
            font-size: 13px;
            border-radius: 6px;
            overflow: hidden;
        }
        
        .suggestions-header {
            background: #f1f5f9;
            padding: 6px 10px;
            cursor: move;
            border-bottom: 1px solid #e2e8f0;
            font-size: 11px;
            color: #475569;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .signature-area {
            background: #fffbeb;
            padding: 8px 12px;
            border-bottom: 1px solid #fcd34d;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            color: #92400e;
            display: none;
            white-space: normal;
            word-break: break-word;
            flex-shrink: 0;
        }

        .suggestions-content {
            overflow-y: auto;
            max-height: 250px;
            background-color: white;
        }

        .suggestion-item {
            padding: 8px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #f8fafc;
            white-space: nowrap; 
        }
        .suggestion-item:hover, .suggestion-item.active {
            background-color: #e0f2fe;
        }
        .icon-table { color: #d97706; }
        .icon-col { color: #2563eb; }
        .icon-func { color: #9333ea; font-weight: bold; }
        .icon-measure { color: #059669; font-weight: bold; } /* Emerald */

        /* Animations */
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.3s ease-out forwards;
        }
        
        /* Syntax Highlighting Sim */
        .measure-badge {
            background-color: #e0e7ff;
            color: #3730a3;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .column-badge {
            background-color: #dcfce7;
            color: #166534;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        /* Input Styling */
        input.dax-input {
            padding: 4px 0;
            height: 28px; 
        }

        /* Quiz Styles */
        .quiz-option {
            transition: all 0.2s;
        }
        .quiz-option:hover {
            background-color: #f8fafc;
            border-color: #cbd5e1;
        }
        .quiz-option.selected {
            background-color: #eff6ff;
            border-color: #3b82f6;
            color: #1e40af;
        }
        .quiz-option.correct {
            background-color: #dcfce7;
            border-color: #22c55e;
            color: #14532d;
        }
        .quiz-option.incorrect {
            background-color: #fee2e2;
            border-color: #ef4444;
            color: #7f1d1d;
        }

        /* Sequence Iterator Animation Styles */
        @keyframes iterRow1 { 0%, 25%, 100% { background-color: transparent; } 5%, 20% { background-color: #fef08a; } }
        @keyframes iterCalc1 { 0%, 5% { opacity: 0; } 10%, 100% { opacity: 1; } }

        @keyframes iterRow2 { 0%, 25%, 50%, 100% { background-color: transparent; } 30%, 45% { background-color: #fef08a; } }
        @keyframes iterCalc2 { 0%, 30% { opacity: 0; } 35%, 100% { opacity: 1; } }

        @keyframes iterRow3 { 0%, 50%, 75%, 100% { background-color: transparent; } 55%, 70% { background-color: #fef08a; } }
        @keyframes iterCalc3 { 0%, 55% { opacity: 0; } 60%, 100% { opacity: 1; } }

        @keyframes iterShowTotal { 0%, 80% { opacity: 0; transform: scale(0.8); } 85%, 100% { opacity: 1; transform: scale(1); } }

        .anim-row-1 { animation: iterRow1 8s infinite; }
        .anim-calc-1 { animation: iterCalc1 8s infinite; }
        
        .anim-row-2 { animation: iterRow2 8s infinite; }
        .anim-calc-2 { animation: iterCalc2 8s infinite; }
        
        .anim-row-3 { animation: iterRow3 8s infinite; }
        .anim-calc-3 { animation: iterCalc3 8s infinite; }
        
        .anim-total { animation: iterShowTotal 8s infinite; }

        /* Instructor Mode Styles */
        .instructor-answer { display: none !important; }
        .instructor-mode .instructor-answer { display: block !important; animation: fade-in 0.3s ease-out; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl flex-shrink-0 z-20">
        <div class="p-6 border-b border-slate-700 bg-slate-800">
            <h1 class="text-xl font-bold text-yellow-400 flex items-center gap-2">
                <i data-lucide="function-square" class="w-6 h-6"></i>
                DAX Master
            </h1>
            <p class="text-xs text-slate-400 mt-1">Foundations to Intermediate</p>
        </div>

        <nav class="flex-1 overflow-y-auto py-4">
            <ul id="module-list" class="space-y-1">
                <!-- Modules injected by JS -->
            </ul>
        </nav>

        <div class="p-4 bg-slate-800 border-t border-slate-700">
            <div class="flex justify-between text-xs mb-2 text-slate-300">
                <span>Course Progress</span>
                <span id="progress-text">0%</span>
            </div>
            <div class="w-full bg-slate-700 rounded-full h-2">
                <div id="progress-bar" class="bg-yellow-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full relative overflow-hidden">
        <!-- Header -->
        <header class="bg-white border-b border-slate-200 px-8 py-5 shadow-sm flex-shrink-0">
            <div class="flex items-center justify-between">
                <div>
                    <h2 id="current-module-title" class="text-2xl font-bold text-slate-800">Loading...</h2>
                    <p id="current-module-subtitle" class="text-slate-500 text-sm mt-1">Interactive Code Lab</p>
                </div>
                <div class="flex gap-3">
                    <button onclick="app.revealAnswers()" class="text-sm px-4 py-2 text-emerald-600 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-lg flex items-center gap-2 transition-colors font-semibold">
                        <i data-lucide="eye" class="w-4 h-4"></i> Reveal Answers
                    </button>
                    <div class="w-px h-8 bg-slate-200 mx-1"></div>
                    <button onclick="app.resetCurrentModule()" class="text-sm px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg flex items-center gap-2 transition-colors">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Reset
                    </button>
                    <!-- Instructor Padlock -->
                    <button onclick="app.toggleInstructor()" title="Instructor Mode (Password Protected)" class="text-sm px-3 py-2 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-lg flex items-center gap-2 transition-colors">
                        <i data-lucide="lock" id="instructor-icon" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Scrollable Content Area -->
        <div class="flex-1 overflow-y-auto p-8 space-y-6 bg-slate-50" id="main-content-area">
            
            <!-- Top Row: Cards -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 h-[280px]">
                
                <!-- Concept Card -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full animate-fade-in" style="animation-delay: 0.1s">
                    <div class="bg-yellow-50 px-6 py-3 border-b border-yellow-100 flex items-center gap-2">
                        <i data-lucide="book-open" class="w-4 h-4 text-yellow-600"></i>
                        <h3 class="font-semibold text-yellow-900">Concept & Syntax</h3>
                    </div>
                    <div id="concept-content" class="p-6 text-sm leading-relaxed text-slate-600 flex-1 overflow-y-auto">
                        <!-- Content Injected Here -->
                    </div>
                </div>

                <!-- Instructions Card -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full animate-fade-in" style="animation-delay: 0.2s">
                    <div class="bg-slate-50 px-6 py-3 border-b border-slate-200 flex items-center gap-2">
                        <i data-lucide="check-square" class="w-4 h-4 text-slate-600"></i>
                        <h3 class="font-semibold text-slate-900">Lab Objectives</h3>
                    </div>
                    <div class="p-6 flex-1 flex flex-col overflow-y-auto">
                        <h4 id="project-title" class="font-bold text-slate-800 mb-2"></h4>
                        <p id="project-brief" class="text-sm text-slate-600 mb-4"></p>
                        <div class="mt-auto bg-slate-50 rounded-lg p-4 border border-slate-100" id="instructions-box">
                            <ul id="project-steps" class="space-y-2 text-sm text-slate-700">
                                <!-- Steps Injected Here -->
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom Row: Interactive Demo -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden animate-fade-in flex flex-col flex-1 min-h-[400px]" style="animation-delay: 0.3s">
                <div class="bg-slate-50 px-6 py-3 border-b border-slate-200 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <i data-lucide="terminal" class="w-4 h-4 text-slate-600"></i>
                        <h3 class="font-semibold text-slate-800">DAX Workbench</h3>
                    </div>
                    <div id="demo-status" class="text-xs font-medium px-2 py-1 rounded bg-slate-200 text-slate-600">Waiting for input...</div>
                </div>
                
                <!-- Demo Container -->
                <div id="demo-container" class="p-6 relative flex-1 bg-slate-100 flex flex-col">
                    <!-- Dynamic Demo Content -->
                </div>
            </div>

        </div>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 bg-emerald-600 text-white px-6 py-4 rounded-lg shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-3">
        <div class="bg-emerald-500 p-1 rounded-full">
            <i data-lucide="check" class="w-4 h-4 text-white"></i>
        </div>
        <div>
            <h4 class="font-bold text-sm">Correct!</h4>
            <p class="text-xs opacity-90">Module complete.</p>
        </div>
    </div>

    <script>
        // --- 1. DATA & METADATA ---
        
        const DAX_METADATA = {
            tables: ['Sales', 'Products', 'Calendar', 'Customer', 'tblFactTransactions', 'Dim_Account', 'Dim_Department', 'Dim_Entity'],
            columns: {
                'Sales': ['Sales[Price]', 'Sales[Quantity]', 'Sales[Date]', 'Sales[OrderNo]', 'Sales[Total Cost]'],
                'Products': ['Products[Product Name]', 'Products[Color]', 'Products[Category]'],
                'Calendar': ['Calendar[Date]', 'Calendar[Year]', 'Calendar[Month]'],
                'Customer': ['Customer[FirstName]', 'Customer[LastName]', 'Customer[FullName]'],
                'tblFactTransactions': ['tblFactTransactions[Net]', 'tblFactTransactions[Credit]', 'tblFactTransactions[Debit]', 'tblFactTransactions[TransID]']
            },
            measures: [
                '[Total Revenue]', '[Total Units]', '[Net Amount]'
            ],
            functions: [
                { name: 'SUM', sig: 'SUM(<column>)' },
                { name: 'AVERAGE', sig: 'AVERAGE(<column>)' },
                { name: 'COUNTROWS', sig: 'COUNTROWS(<table>)' },
                { name: 'DISTINCTCOUNT', sig: 'DISTINCTCOUNT(<column>)' },
                { name: 'DIVIDE', sig: 'DIVIDE(<numerator>, <denominator>, [alternate_result])' },
                { name: 'CALCULATE', sig: 'CALCULATE(<expression>, [filter1], ...)' },
                { name: 'FILTER', sig: 'FILTER(<table>, <filter_expression>)' },
                { name: 'TOTALYTD', sig: 'TOTALYTD(<expression>, <dates>)' },
                { name: 'SAMEPERIODLASTYEAR', sig: 'SAMEPERIODLASTYEAR(<dates>)' },
                { name: 'RANKX', sig: 'RANKX(<table>, <expression>, [value], [order], [ties])' },
                { name: 'SELECTEDVALUE', sig: 'SELECTEDVALUE(<column>, [alternate_result])' },
                { name: 'SUMX', sig: 'SUMX(<table>, <expression>)' },
                { name: 'AVERAGEX', sig: 'AVERAGEX(<table>, <expression>)' },
                { name: 'MINX', sig: 'MINX(<table>, <expression>)' },
                { name: 'MAXX', sig: 'MAXX(<table>, <expression>)' },
                { name: 'CONCATENATEX', sig: 'CONCATENATEX(<table>, <expression>, [delimiter])' },
                { name: 'ALL', sig: 'ALL([table_or_column])' },
                { name: 'ALLEXCEPT', sig: 'ALLEXCEPT(<table>, <column1>, ...)' },
                { name: 'CONCATENATE', sig: 'CONCATENATE(<text1>, <text2>)' },
                { name: 'FORMAT', sig: 'FORMAT(<value>, <format_string>)' },
                { name: 'RELATED', sig: 'RELATED(<column>)' },
                { name: 'ABS', sig: 'ABS(<number>)' }
            ]
        };

        const QUIZ_DATA = [
            {
                q: "You need to create a unique ID for each order by combining 'ORD-' with the Order Number. Which function should you use?",
                context: { header: ["OrderNo"], rows: [["1001"], ["1002"]] },
                options: ["SUM", "DIVIDE", "CONCATENATE (or &)", "COUNTROWS"],
                correct: 2,
                expl: "<strong>CONCATENATE</strong> or the <strong>&</strong> operator joins text strings together."
            },
            {
                q: "You want to calculate the total revenue for 'Red' products only. Assume you already have a <code>[Total Revenue]</code> measure. How do you construct the formula?",
                context: { header: ["Color", "Price", "Qty"], rows: [["Red", "$50", "2"], ["Blue", "$100", "2"]] },
                options: [
                    "SUM([Total Revenue])",
                    "CALCULATE([Total Revenue], Products[Color] = 'Red')",
                    "CALCULATE([Total Revenue], ALL(Products[Color]))",
                    "FILTER(Sales, Products[Color] = 'Red')"
                ],
                correct: 1,
                expl: "<strong>CALCULATE</strong> modifies the context. Adding the filter <code>Products[Color] = 'Red'</code> restricts the expression evaluated in <code>[Total Revenue]</code> to only Red products."
            },
            {
                q: "You have a table with Quantity and UnitPrice. You need to calculate Total Revenue. You cannot simply SUM the columns directly. Which function iterates row-by-row?",
                context: { header: ["Quantity", "Price"], rows: [["2", "$10"], ["5", "$20"]] },
                options: ["SUM", "AVERAGEX", "SUMX", "COUNTROWS"],
                correct: 2,
                expl: "<strong>SUMX</strong> is an iterator. It goes row-by-row, calculates <code>Quantity * Price</code>, and then sums the final row-level results together."
            },
            {
                q: "You are in the 'Sales' table (Fact) and need to fetch the 'Product Name' from the 'Products' table (Dimension) to create a Calculated Column. Which function do you use?",
                context: { header: ["ProdID", "RelatedName?"], rows: [["P01", "Widget A"], ["P02", "Widget B"]] },
                options: ["LOOKUPVALUE", "RELATED", "CALCULATE", "SUM"],
                correct: 1,
                expl: "<strong>RELATED</strong> follows an existing Many-to-One relationship to fetch data from the 'One' side (Dimension) to the 'Many' side (Fact)."
            },
            {
                q: "You need to count how many individual sales transactions had a Unit Price greater than 500. Which formula correctly returns this count?",
                context: { header: ["Order", "Price"], rows: [["101", "$600"], ["102", "$200"]] },
                options: [
                    "COUNTROWS(FILTER(Sales, Sales[Price] > 500))",
                    "SUMX(Sales, Sales[Price] > 500)",
                    "CALCULATE(Sales[Price] > 500)",
                    "COUNT(Sales[Price])"
                ],
                correct: 0,
                expl: "<strong>COUNTROWS</strong> counts rows in a table. <strong>FILTER</strong> returns a table reduced to only the rows where Price > 500. Combining them gives the right answer."
            }
        ];

        const MODULES = [
            // 0
            {
                id: "mod_text",
                title: "Text Manipulation",
                concept: `
                    <p class="mb-3">You can join text strings together. These are typically used in <strong>Calculated Columns</strong> to create new fields.</p>
                    <div class="bg-slate-50 p-3 rounded border mb-3 text-xs">
                        <p class="mb-1"><strong>Ampersand (&)</strong>: The simplest way to join text.</p>
                        <code class="block text-blue-600 mb-2">[First Name] & " " & [Last Name]</code>
                        <p class="mb-1"><strong>CONCATENATE</strong>: Joins exactly two strings.</p>
                    </div>
                `,
                project: {
                    title: "Create Labels",
                    brief: "Create a Full Name column and a unique Order Label.",
                    steps: [
                        "Create <strong>Full Name</strong> column by joining FirstName, a space, and LastName.",
                        "Create <strong>Order Label</strong> column by joining 'ORD-' and the OrderNo."
                    ]
                },
                inputs: [
                    { label: "Full Name", type: "column", result: ["John Doe", "Jane Smith", "Bob Jones", "Alice Wong"], match: /Customer\[FirstName\]\s*&\s*" "\s*&\s*Customer\[LastName\]/i, hint: "Customer[FirstName] & \" \" & Customer[LastName]" },
                    { label: "Order Label", type: "column", result: ["ORD-1001", "ORD-1002", "ORD-1003", "ORD-1004"], match: /"ORD-"\s*&\s*Sales\[OrderNo\]/i, hint: "\"ORD-\" & Sales[OrderNo]" }
                ],
                renderDemo: (container, onComplete) => renderGridDemo(container, MODULES[0].inputs, onComplete, "Customer")
            },
            // 1
            {
                id: "mod_math",
                title: "Safe Math & Errors",
                concept: `
                    <p class="mb-3">Handling errors (like dividing by zero) is crucial in Power BI. Let's see what happens when we do it wrong, then fix it.</p>
                    <div class="space-y-3">
                        <div class="bg-red-50 p-2 rounded border border-red-200">
                            <strong class="text-red-700">Unsafe Math</strong><br>
                            <span class="text-xs">Standard division like <code>[Total Cost] / [Quantity]</code> to find Unit Cost will throw an <b>Infinity</b> error if a row has 0 Quantity.</span>
                        </div>
                        <div class="bg-blue-50 p-2 rounded border border-blue-200">
                            <strong class="text-blue-700">DIVIDE</strong><br>
                            <span class="text-xs">Safely divides. If denominator is 0, it returns BLANK or an optional default value. <br><code>DIVIDE(Num, Denom, 0)</code></span>
                        </div>
                    </div>
                `,
                project: {
                    title: "Calculate Unit Cost",
                    brief: "We want to find the Unit Cost (Total Cost / Quantity). Let's see the error, then fix it safely.",
                    steps: [
                        "Calculate <strong>Unsafe Cost</strong> using standard division (Total Cost / Quantity). Notice the Infinity error!",
                        "Calculate <strong>Safe Cost</strong> using the DIVIDE function, substituting 0 if dividing by zero."
                    ]
                },
                inputs: [
                    { label: "Unsafe Cost", type: "column", result: ["Infinity", "100", "NaN", "200"], match: /Sales\[Total Cost\]\s*\/\s*Sales\[Quantity\]/i, hint: "Sales[Total Cost] / Sales[Quantity]" },
                    { label: "Safe Cost", type: "column", result: ["0", "100", "0", "200"], match: /DIVIDE\s*\(\s*Sales\[Total Cost\]\s*,\s*Sales\[Quantity\]\s*,\s*0\s*\)/i, hint: "DIVIDE(Sales[Total Cost], Sales[Quantity], 0)" }
                ],
                renderDemo: (container, onComplete) => renderGridDemo(container, MODULES[1].inputs, onComplete, "Sales_SafeMath")
            },
            // 2
            {
                id: "mod_context_theory",
                title: "Context Theory",
                concept: `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                        <div class="bg-slate-50 p-3 rounded border">
                            <strong class="text-xs uppercase text-slate-500 block mb-2">Calculated Column (Row Context)</strong>
                            <p class="text-xs">Calculated <strong>row-by-row</strong> at data refresh time. Stored in memory (RAM). Aware of the "current row" it is looking at.</p>
                            <p class="text-[10px] mt-2 bg-blue-50 text-blue-800 p-1.5 rounded"><strong class="font-bold">Excel Equivalent:</strong> Typing a formula in a new column and dragging it down.</p>
                        </div>
                        <div class="bg-slate-50 p-3 rounded border">
                            <strong class="text-xs uppercase text-slate-500 block mb-2">Measure (Filter Context)</strong>
                            <p class="text-xs">Calculated <strong>on-the-fly</strong> when used in a visual. Uses <strong>Filter Context</strong> (responds to Slicers/Filters). It calculates based on aggregated subsets of data.</p>
                            <p class="text-[10px] mt-2 bg-emerald-50 text-emerald-800 p-1.5 rounded"><strong class="font-bold">Excel Equivalent:</strong> Dropping a field into the 'Values' area of a Pivot Table.</p>
                        </div>
                    </div>
                `,
                project: {
                    title: "Column vs. Measure",
                    brief: "Define a Calculated Column (Row Context) vs a Measure (Filter Context).",
                    steps: [
                        "<strong>Column:</strong> Create 'LineTotal' (Quantity * Price). This executes line by line.",
                        "<strong>Measure:</strong> Create 'Total Units' (SUM of Quantity). This evaluates based on slicer context."
                    ]
                },
                inputs: [
                    { label: "LineTotal", type: "column", result: ["1000", "100", "0", "200"], match: /Sales\[Quantity\]\s*\*\s*Sales\[Price\]|Sales\[Price\]\s*\*\s*Sales\[Quantity\]/i, hint: "Sales[Quantity] * Sales[Price]" },
                    { label: "Total Units", type: "measure", result: "4", match: /SUM\s*\(\s*Sales\[Quantity\]\s*\)/i, hint: "SUM(Sales[Quantity])" }
                ],
                renderDemo: (container, onComplete) => renderGridDemo(container, MODULES[2].inputs, onComplete, "Sales_Iter")
            },
            // 3
            {
                id: "mod_agg",
                title: "Basic Aggregations",
                concept: `
                    <p class="mb-3">Aggregation functions collapse multiple rows into a single value. These are <strong>Measures</strong>.</p>
                    <ul class="list-disc pl-5 space-y-2 mb-4 text-xs font-mono bg-slate-50 p-3 rounded border">
                        <li><strong>SUM(Col)</strong>: Adds up numbers.</li>
                        <li><strong>AVERAGE(Col)</strong>: Calculates the mean.</li>
                        <li><strong>COUNTROWS(Table)</strong>: Counts total transactions/rows.</li>
                        <li><strong>DISTINCTCOUNT(Col)</strong>: Counts unique values in a column.</li>
                    </ul>
                `,
                project: {
                    title: "Calculate Key Metrics",
                    brief: "Use the Sales table to calculate core business metrics. <em>(Note: SUM(Price) is not Total Sales! We'll just sum Quantity for Total Units here.)</em>",

        // --- 3. INTELLISENSE HELPER ---
        function enableIntellisense(inp, container) {
            let dropdown = null;

            inp.addEventListener('keyup', (e) => {
                const val = inp.value;
                const cursorPos = inp.selectionStart;
                
                const textBeforeCursor = val.substring(0, cursorPos);
                const match = textBeforeCursor.match(/([a-zA-Z0-9_\[\]]+)$/);
                
                const lastOpenParen = val.lastIndexOf('(', cursorPos - 1);
                const lastCloseParen = val.lastIndexOf(')', cursorPos - 1);
                let currentSig = "";

                if (lastOpenParen > lastCloseParen) {
                    const beforeParen = val.substring(0, lastOpenParen).trim();
                    const words = beforeParen.split(/[\s,]+/);
                    const funcName = words[words.length - 1].toUpperCase();
                    const meta = DAX_METADATA.functions.find(f => f.name === funcName);
                    if (meta) currentSig = meta.sig;
                }

                if (match || currentSig) {
                    const word = match ? match[1].trim().toLowerCase() : "";
                    
                    let filtered = [];
                    if(word.length > 0) {
                        let suggestions = [];
                        suggestions.push(...DAX_METADATA.functions.map(f => ({ type: 'func', text: f.name })));
                        suggestions.push(...DAX_METADATA.tables.map(t => ({ type: 'table', text: t })));
                        suggestions.push(...DAX_METADATA.measures.map(m => ({ type: 'measure', text: m })));
                        Object.values(DAX_METADATA.columns).flat().forEach(c => {
                            suggestions.push({ type: 'col', text: c });
                        });
                        filtered = suggestions.filter(s => s.text.toLowerCase().includes(word));
                    }

                    if (filtered.length > 0 || currentSig) {
                        if (!dropdown) {
                            dropdown = document.createElement('div');
                            dropdown.className = 'suggestions-box';
                            document.body.appendChild(dropdown);
                            
                            dropdown.innerHTML = `
                                <div class="suggestions-header" id="drag-${inp.id}">
                                    <span>Suggestions</span>
                                    <i data-lucide="grip-horizontal" class="w-3 h-3"></i>
                                </div>
                                <div class="signature-area" id="sig-${inp.id}"></div>
                                <div class="suggestions-content" id="list-${inp.id}"></div>
                            `;
                            makeDraggable(dropdown, document.getElementById(`drag-${inp.id}`));
                        }
                        
                        const rect = inp.getBoundingClientRect();
                        if (!dropdown.hasMoved) {
                            dropdown.style.top = (rect.top + window.scrollY - 300) + 'px'; 
                            dropdown.style.left = (rect.left + window.scrollX) + 'px';
                        }

                        const sigArea = document.getElementById(`sig-${inp.id}`);
                        if(currentSig) {
                            sigArea.style.display = 'block';
                            sigArea.innerText = currentSig;
                        } else {
                            sigArea.style.display = 'none';
                        }

                        const listContainer = document.getElementById(`list-${inp.id}`);
                        listContainer.innerHTML = filtered.map(s => {
                            let icon = '';
                            if(s.type === 'func') icon = '<span class="icon-func">fx</span>';
                            if(s.type === 'table') icon = '<span class="icon-table">▦</span>';
                            if(s.type === 'col') icon = '<span class="icon-col">◫</span>';
                            if(s.type === 'measure') icon = '<span class="icon-measure">∑</span>';
                            return `<div class="suggestion-item" onclick="insertSuggestion('${s.text}', '${inp.id}')">${icon} ${s.text}</div>`;
                        }).join('');
                        
                        if(filtered.length === 0 && !currentSig) closeDropdown();
                        lucide.createIcons(); 
                    } else {
                        closeDropdown();
                    }
                } else {
                    closeDropdown();
                }
            });

            function makeDraggable(element, handle) {
                let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
                handle.onmousedown = dragMouseDown;

                function dragMouseDown(e) {
                    e = e || window.event;
                    e.preventDefault();
                    pos3 = e.clientX;
                    pos4 = e.clientY;
                    document.onmouseup = closeDragElement;
                    document.onmousemove = elementDrag;
                    element.hasMoved = true; 
                }

                function elementDrag(e) {
                    e = e || window.event;
                    e.preventDefault();
                    pos1 = pos3 - e.clientX;
                    pos2 = pos4 - e.clientY;
                    pos3 = e.clientX;
                    pos4 = e.clientY;
                    element.style.top = (element.offsetTop - pos2) + "px";
                    element.style.left = (element.offsetLeft - pos1) + "px";
                }

                function closeDragElement() {
                    document.onmouseup = null;
                    document.onmousemove = null;
                }
            }

            function closeDropdown() {
                if(dropdown) { dropdown.remove(); dropdown = null; }
            }
            
            inp.addEventListener('blur', (e) => {
                setTimeout(() => { closeDropdown(); }, 200);
            });

            window.insertSuggestion = (text, inpId) => {
                const input = document.getElementById(inpId);
                const pos = input.selectionStart;
                const val = input.value;
                const before = val.substring(0, pos);
                const lastWordRegex = /([a-zA-Z0-9_\[\]]+)$/;
                const match = before.match(lastWordRegex);
                const lastWordLen = match ? match[1].length : 0;
                
                const newText = val.substring(0, pos - lastWordLen) + text + val.substring(pos);
                input.value = newText;
                input.focus();
                
                const event = new Event('keyup');
                input.dispatchEvent(event);
            };
        }

                    <tr><td class="border p-1">Widget A</td><td class="border p-1">50</td><td class="border p-1">2</td></tr>
                    <tr><td class="border p-1">Widget B</td><td class="border p-1">100</td><td class="border p-1">1</td></tr>
                    <tr><td class="border p-1">Widget C</td><td class="border p-1">50</td><td class="border p-1">2</td></tr>
                `;
            } else if (tableName === "Sales_Calc") {
                 displayTableName = "Sales (Joined w/ Products)";
                 headerHTML = `<tr><th class="border p-1">Product</th><th class="border p-1">Color</th><th class="border p-1">Price</th><th class="border p-1">Quantity</th></tr>`;
                 rowsHTML = `
                    <tr><td class="border p-1">Laptop</td><td class="border p-1">Red</td><td class="border p-1">250</td><td class="border p-1">2</td></tr>
                    <tr><td class="border p-1">Phone</td><td class="border p-1">Blue</td><td class="border p-1">100</td><td class="border p-1">1</td></tr>
                    <tr><td class="border p-1">Tablet</td><td class="border p-1">Red</td><td class="border p-1">200</td><td class="border p-1">1</td></tr>
                `;
            } else if (tableName === "Sales_Time") {
                 displayTableName = "Sales (Linked to Calendar)";
                 bannerHTML = `<div class="bg-blue-100 text-blue-800 text-[10px] p-1 text-center font-bold">Current Visual Context: Year = 2026</div>`;
                 headerHTML = `<tr><th class="border p-1">Date</th><th class="border p-1">Price</th><th class="border p-1">Quantity</th></tr>`;
                 rowsHTML = `
                    <tr><td class="border p-1">1/1/2025</td><td class="border p-1">200</td><td class="border p-1">2</td></tr>
                    <tr><td class="border p-1">6/1/2025</td><td class="border p-1">250</td><td class="border p-1">1</td></tr>
                    <tr class="bg-blue-50"><td class="border p-1 font-bold">1/1/2026</td><td class="border p-1">250</td><td class="border p-1">2</td></tr>
                    <tr class="bg-blue-50"><td class="border p-1 font-bold">3/1/2026</td><td class="border p-1">300</td><td class="border p-1">1</td></tr>
                `;
            } else if (tableName === "Sales_Mods") {
                 displayTableName = "Sales (Joined w/ Products)";
                 bannerHTML = `<div class="bg-blue-100 text-blue-800 text-[10px] p-1 text-center font-bold">Current Visual Context: Product = 'Laptop'</div>`;
                 headerHTML = `<tr><th class="border p-1">Category</th><th class="border p-1">Product</th><th class="border p-1">Price</th><th class="border p-1">Quantity</th></tr>`;
                 rowsHTML = `
                    <tr class="bg-blue-50"><td class="border p-1 font-bold">Electronics</td><td class="border p-1 font-bold text-blue-800">Laptop</td><td class="border p-1">250</td><td class="border p-1">2</td></tr>
                    <tr><td class="border p-1">Electronics</td><td class="border p-1">Phone</td><td class="border p-1">200</td><td class="border p-1">1</td></tr>
                    <tr><td class="border p-1">Home</td><td class="border p-1">Desk</td><td class="border p-1">100</td><td class="border p-1">1</td></tr>
                `;
            } else {
                 displayTableName = "Sales";
                 headerHTML = `<tr><th class="border p-1">Date</th><th class="border p-1">Product</th><th class="border p-1">Price</th><th class="border p-1">Quantity</th></tr>`;
                 rowsHTML = `
                    <tr><td class="border p-1">1/1/26</td><td class="border p-1">Widget A</td><td class="border p-1">500</td><td class="border p-1">2</td></tr>
                    <tr><td class="border p-1">1/2/26</td><td class="border p-1">Widget B</td><td class="border p-1">100</td><td class="border p-1">1</td></tr>
                    <tr><td class="border p-1">1/3/26</td><td class="border p-1">Widget C</td><td class="border p-1">0</td><td class="border p-1">0</td></tr>
                    <tr><td class="border p-1">1/4/26</td><td class="border p-1">Widget A</td><td class="border p-1">200</td><td class="border p-1">1</td></tr>
                `;
            }

            container.innerHTML = `
                <div class="flex h-full gap-4">
                    <div class="flex-1 flex flex-col">
                        <div class="flex-1 bg-white border rounded shadow-sm p-4 overflow-y-auto">
                            ${inputsHTML}
                        </div>
                    </div>
                    <div class="w-1/3 bg-white border rounded shadow-sm p-0 flex flex-col">
                        <div class="bg-slate-100 p-2 text-xs font-bold border-b text-center">Data Preview (${displayTableName})</div>
                        ${bannerHTML}
                        <div class="flex-1 overflow-auto p-2">
                            <table class="w-full text-[10px] text-left border-collapse" id="preview-table">
                                <thead class="bg-slate-50 sticky top-0">${headerHTML}</thead>
                                <tbody>${rowsHTML}</tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;

            inputs.forEach((_, idx) => {
                const el = document.getElementById(`dax-inp-${idx}`);
                enableIntellisense(el, el.parentElement.parentElement);
            });

            let completedCount = 0;
            window.validateInput = (idx) => {
                const inputEl = document.getElementById(`dax-inp-${idx}`);
                const statusEl = document.getElementById(`status-${idx}`);
                const resEl = document.getElementById(`res-${idx}`);
                const def = inputs[idx];
                const val = inputEl.value.replace(/\s+/g, ' ').trim(); 

                if (def.match.test(val)) {
                    if(!statusEl.classList.contains('text-green-600')) {
                        statusEl.innerHTML = `<i data-lucide="check-circle" class="w-3 h-3 inline text-green-600"></i>`;
                        inputEl.classList.add('text-green-700', 'font-bold');
                        inputEl.disabled = true;
                        
                        // Show Result
                        if (def.type === 'measure') {
                            resEl.innerHTML = def.resultHtml ? def.resultHtml : `<strong>Result:</strong> ${def.result}`;
                            resEl.classList.remove('hidden');
                        } else if (def.type === 'column' && Array.isArray(def.result)) {
                            const tbl = document.getElementById('preview-table');
                            const headRow = tbl.querySelector('thead tr');
                            headRow.innerHTML += `<th class="border p-1 bg-green-50 text-green-700 whitespace-nowrap">${def.label}</th>`;
                            const rows = tbl.querySelectorAll('tbody tr');
                            rows.forEach((r, i) => {
                                let val = def.result[i] || "";
                                let errClass = (val === 'Infinity' || val === 'NaN') ? 'text-red-500 italic' : '';
                                r.innerHTML += `<td class="border p-1 bg-green-50 font-bold ${errClass}">${val}</td>`;
                            });
                        }

                        lucide.createIcons();
                        completedCount++;
                        if(completedCount === inputs.length) onComplete();
                    }
                } else {
                    inputEl.classList.add('bg-red-50');
                    setTimeout(() => inputEl.classList.remove('bg-red-50'), 500);
                }
            };

            window.currentSolver = async () => {
                for(let i=0; i<inputs.length; i++) {
                     const def = inputs[i];
                     const el = document.getElementById(`dax-inp-${i}`);
                     el.value = def.hint;
                     validateInput(i);
                     await new Promise(r => setTimeout(r, 600)); 
                }
            };
        }

        function renderSlicerDemo(container, inputs, onComplete) {
            let inputsHTML = inputs.map((inp, idx) => `
                <div class="da-expression-bar p-2 mb-3 rounded shadow-sm flex flex-col gap-1 relative">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span class="measure-badge">Measure</span>
                            <span class="text-xs font-bold text-slate-500">${inp.label} =</span>
                        </div>
                        <div id="status-${idx}" class="text-xs"></div>
                    </div>
                    <div class="flex gap-2">
                        <input id="dax-inp-${idx}" class="dax-input w-full text-sm font-mono outline-none text-slate-700" placeholder="Type DAX..." autocomplete="off">
                        <button onclick="validateInput(${idx})" class="bg-yellow-400 hover:bg-yellow-500 text-black text-xs px-3 py-1 rounded font-bold transition-colors">✓</button>
                    </div>
                    <div id="res-${idx}" class="hidden text-xs text-slate-500 bg-slate-50 p-2 border-t mt-1 font-mono break-all"></div>
                </div>
            `).join('');

            container.innerHTML = `
                <div class="flex h-full gap-4">
                    <div class="flex-1 flex flex-col gap-4">
                        <div class="bg-white border rounded shadow-sm p-4">
                            ${inputsHTML}
                        </div>
                        <div class="flex-1 bg-white border rounded shadow-sm p-2 flex flex-col overflow-hidden">
                            <div class="text-[10px] font-bold border-b pb-1 mb-1">Data Context (Products & Sales)</div>
                            <div class="overflow-auto">
                                <table class="w-full text-[9px] text-left border-collapse">
                                    <thead class="bg-slate-50 sticky top-0"><tr><th class="border p-1">Category</th><th class="border p-1">Product</th><th class="border p-1">Price</th><th class="border p-1">Qty</th></tr></thead>
                                    <tbody id="slicer-data-table">
                                        <!-- Injected by JS -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="w-1/3 flex flex-col gap-2">
                        <div class="bg-white border rounded shadow-sm p-2">
                            <div class="text-[10px] uppercase font-bold text-slate-400 mb-1">Slicer: Category</div>
                            <div class="space-y-1" id="slicer-container">
                                <div class="slicer-item text-xs p-1 cursor-pointer border rounded flex items-center justify-between bg-blue-50 border-blue-200" onclick="toggleSlicer(this, 'Electronics')">
                                    <span>Electronics</span>
                                    <i data-lucide="check" class="w-3 h-3 text-blue-500"></i>
                                </div>
                                <div class="slicer-item text-xs p-1 cursor-pointer border rounded hover:bg-slate-50" onclick="toggleSlicer(this, 'Clothing')">Clothing</div>
                                <div class="slicer-item text-xs p-1 cursor-pointer border rounded hover:bg-slate-50" onclick="toggleSlicer(this, 'Home')">Home</div>
                            </div>
                        </div>
                        <div class="flex-1 bg-white border rounded shadow-sm p-2 flex flex-col relative min-h-[150px]">
                             <div class="text-[10px] uppercase font-bold text-slate-400 mb-1">Visual</div>
                             <div class="absolute inset-0 top-6 flex items-center justify-center bg-slate-50 opacity-90 z-10" id="vis-overlay">
                                <span class="text-xs text-slate-500">Enter DAX to render</span>
                             </div>
                             <div class="flex-1 flex flex-col gap-2">
                                <h4 class="font-bold text-sm text-center border-b pb-1" id="chart-title">Revenue by Rank</h4>
                                <div class="flex-1 flex items-end justify-around gap-1 px-2 pb-2" id="bar-chart-container">
                                    <!-- Dynamic Bars -->
                                </div>
                             </div>
                        </div>
                    </div>
                </div>
            `;

            const salesData = [
                {cat: "Electronics", prod: "Laptop", price: 600, qty: 2, rev: 1200},
                {cat: "Electronics", prod: "Smartphone", price: 800, qty: 1, rev: 800},
                {cat: "Electronics", prod: "Tablet", price: 300, qty: 2, rev: 600},
                {cat: "Electronics", prod: "Monitor", price: 300, qty: 1, rev: 300},
                {cat: "Clothing", prod: "Jacket", price: 75, qty: 2, rev: 150},
                {cat: "Clothing", prod: "Jeans", price: 50, qty: 2, rev: 100},
                {cat: "Clothing", prod: "Shirt", price: 25, qty: 2, rev: 50},
                {cat: "Clothing", prod: "Hat", price: 20, qty: 1, rev: 20},
                {cat: "Home", prod: "Sofa", price: 500, qty: 1, rev: 500},
                {cat: "Home", prod: "Table", price: 100, qty: 2, rev: 200},
                {cat: "Home", prod: "Chair", price: 50, qty: 2, rev: 100},
                {cat: "Home", prod: "Lamp", price: 40, qty: 1, rev: 40}
            ];

            const tbody = document.getElementById('slicer-data-table');
            salesData.forEach(r => {
                tbody.innerHTML += `<tr><td class="border p-1">${r.cat}</td><td class="border p-1">${r.prod}</td><td class="border p-1">${r.price}</td><td class="border p-1">${r.qty}</td></tr>`;
            });
            
            const renderChart = (category) => {
                const filtered = salesData.filter(d => d.cat === category).sort((a,b) => b.rev - a.rev).slice(0,3);
                const max = filtered[0].rev;
                const container = document.getElementById('bar-chart-container');
                
                container.innerHTML = filtered.map((d, i) => {
                    const height = (d.rev / max) * 100;
                    const colors = ["bg-blue-600", "bg-blue-400", "bg-blue-200"];
                    return `
                        <div class="w-8 ${colors[i]} rounded-t relative group flex flex-col justify-end items-center transition-all duration-500" style="height: ${height}%">
                            <div class="text-[9px] font-bold text-white mb-1">${i+1}</div>
                            <div class="absolute bottom-[-15px] text-[8px] text-slate-500 truncate w-12 text-center">${d.prod}</div>
                        </div>
                    `;
                }).join('');
                document.getElementById('chart-title').innerText = `${category} Revenue Top 3`;
            };

            renderChart('Electronics');

            window.toggleSlicer = (el, cat) => {
                const items = document.querySelectorAll('.slicer-item');
                items.forEach(i => {
                    i.className = 'slicer-item text-xs p-1 cursor-pointer border rounded hover:bg-slate-50';
                    i.innerHTML = i.innerText.trim(); 
                });
                el.className = 'slicer-item text-xs p-1 cursor-pointer border rounded flex items-center justify-between bg-blue-50 border-blue-200';
                el.innerHTML = `<span>${cat}</span><i data-lucide="check" class="w-3 h-3 text-blue-500"></i>`;
                lucide.createIcons();
                
                renderChart(cat);
            };

            inputs.forEach((_, idx) => {
                const el = document.getElementById(`dax-inp-${idx}`);
                enableIntellisense(el, el.parentElement.parentElement);
            });

            let completedCount = 0;
            window.validateInput = (idx) => {
                const inputEl = document.getElementById(`dax-inp-${idx}`);
                const statusEl = document.getElementById(`status-${idx}`);
                const resEl = document.getElementById(`res-${idx}`);
                const def = inputs[idx];
                const val = inputEl.value.replace(/\s+/g, ' ').trim(); 

                if (def.match.test(val)) {
                    if(!statusEl.classList.contains('text-green-600')) {
                        statusEl.innerHTML = `<i data-lucide="check-circle" class="w-3 h-3 inline text-green-600"></i>`;
                        inputEl.classList.add('text-green-700', 'font-bold');
                        inputEl.disabled = true;
                        
                        if (def.result) {
                            resEl.innerHTML = def.resultHtml ? def.resultHtml : `<strong>Result:</strong> ${def.result}`;
                            resEl.classList.remove('hidden');
                        }

                        lucide.createIcons();
                        completedCount++;
                        
                        if(completedCount === inputs.length) {
                             document.getElementById('vis-overlay').classList.add('hidden');
                             onComplete();
                        }
                    }
                } else {
                    inputEl.classList.add('bg-red-50');
                    setTimeout(() => inputEl.classList.remove('bg-red-50'), 500);
                }
            };

            window.currentSolver = async () => {
                for(let i=0; i<inputs.length; i++) {
                    const def = inputs[i];
                    const el = document.getElementById(`dax-inp-${i}`);
                    el.value = def.hint;
                    validateInput(i);
                    await new Promise(r => setTimeout(r, 600));
                }
            };
        }

        function renderQuizDemo(container, onComplete) {
            container.innerHTML = `
                <div class="flex flex-col h-full bg-white border rounded shadow-sm overflow-hidden">
                    <div class="bg-slate-100 p-3 border-b flex justify-between items-center">
                        <span class="font-bold text-sm text-slate-700">Question <span id="q-num">1</span> of 5</span>
                        <div class="flex gap-1" id="q-dots">
                            <div class="w-2 h-2 rounded-full bg-slate-300"></div>
                            <div class="w-2 h-2 rounded-full bg-slate-300"></div>
                            <div class="w-2 h-2 rounded-full bg-slate-300"></div>
                            <div class="w-2 h-2 rounded-full bg-slate-300"></div>
                            <div class="w-2 h-2 rounded-full bg-slate-300"></div>
                        </div>
                    </div>
                    <div class="flex-1 p-6 flex flex-col overflow-y-auto">
                        <div id="quiz-content" class="flex-1">
                            <!-- Question injected here -->
                        </div>
                        <div class="mt-4 flex justify-end">
                            <button id="btn-next-q" class="bg-blue-600 hover:bg-blue-700 transition-colors text-white px-4 py-2 rounded text-sm font-bold disabled:opacity-50" disabled>Next Question</button>
                        </div>
                    </div>
                </div>
            `;

            let currentQ = 0;
            
            const renderQ = () => {
                const q = QUIZ_DATA[currentQ];
                document.getElementById('q-num').innerText = currentQ + 1;
                
                const dots = document.getElementById('q-dots').children;
                for(let i=0; i<5; i++) {
                    dots[i].className = `w-2 h-2 rounded-full ${i === currentQ ? 'bg-blue-500' : (i < currentQ ? 'bg-green-500' : 'bg-slate-300')}`;
                }

                let tableHTML = `<table class="w-full text-xs text-left border mb-4"><thead class="bg-slate-50"><tr>`;
                q.context.header.forEach(h => tableHTML += `<th class="border p-2">${h}</th>`);
                tableHTML += `</tr></thead><tbody>`;
                q.context.rows.forEach(r => {
                    tableHTML += `<tr>`;
                    r.forEach(c => tableHTML += `<td class="border p-2">${c}</td>`);
                    tableHTML += `</tr>`;
                });
                tableHTML += `</tbody></table>`;

                const content = document.getElementById('quiz-content');
                content.innerHTML = `
                    <div class="text-sm font-medium mb-4">${q.q}</div>
                    <div class="bg-slate-50 p-2 rounded border mb-4 w-64">${tableHTML}</div>
                    <div class="space-y-2">
                        ${q.options.map((opt, i) => `
                            <div class="quiz-option border rounded p-3 text-sm cursor-pointer" onclick="checkAnswer(${i}, this)">${opt}</div>
                        `).join('')}
                    </div>
                    <div id="explanation" class="hidden mt-4 p-3 bg-blue-50 border border-blue-100 rounded text-sm text-blue-900 leading-relaxed"></div>
                `;
                
                document.getElementById('btn-next-q').disabled = true;
            };

            window.checkAnswer = (idx, el) => {
                if(document.querySelector('.quiz-option.correct') || document.querySelector('.quiz-option.incorrect')) return;

                const q = QUIZ_DATA[currentQ];
                if (idx === q.correct) {
                    el.classList.add('correct');
                    el.innerHTML += `<i data-lucide="check" class="w-4 h-4 inline ml-2 text-green-700"></i>`;
                } else {
                    el.classList.add('incorrect');
                    const opts = document.querySelectorAll('.quiz-option');
                    opts[q.correct].classList.add('correct');
                }
                
                const exp = document.getElementById('explanation');
                exp.innerHTML = `<strong>Explanation:</strong> ${q.expl}`;
                exp.classList.remove('hidden');
                
                lucide.createIcons();
                document.getElementById('btn-next-q').disabled = false;
            };

            document.getElementById('btn-next-q').onclick = () => {
                if (currentQ < 4) {
                    currentQ++;
                    renderQ();
                } else {
                    onComplete();
                }
            };

            renderQ();

            window.currentSolver = async () => {
                const q = QUIZ_DATA[currentQ];
                const opts = document.querySelectorAll('.quiz-option');
                window.checkAnswer(q.correct, opts[q.correct]);
                await new Promise(r => setTimeout(r, 600));
                document.getElementById('btn-next-q').click();
                
                // If there are more questions, recursively solve the next one
                if(currentQ <= 4 && document.getElementById('btn-next-q')) {
                    setTimeout(() => window.currentSolver(), 200);
                }
            };
        }

        window.onload = () => app.init();
    </script>
</body>
</html>
