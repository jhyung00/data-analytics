<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Pivot Simulator - Student Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom scrollbar for Excel-like feel */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 5px;
            border: 2px solid #f1f1f1;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
        .excel-grid td, .excel-grid th {
            border-right: 1px solid #e5e7eb;
            border-bottom: 1px solid #e5e7eb;
        }
        /* Disable text selection during drag */
        .no-select {
            user-select: none;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- Icons (Inline SVG) ---
        const Icons = {
            Grid: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>,
            FileText: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>,
            Table: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3v18"/><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/></svg>,
            Activity: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>,
            Filter: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>,
            Download: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
            Trash2: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>,
            GripVertical: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></svg>,
            ChevronDown: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>,
            X: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 18 18"/></svg>,
            Plus: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Calculator: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>,
            Settings: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
            BarChart: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="16"/></svg>,
            PieChart: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>,
            HelpCircle: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>,
            Key: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>,
            ArrowLeft: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>,
            ArrowRight: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        };

        // --- Mock Data Generator ---
        const generateData = () => {
          const regions = ['North', 'South', 'East', 'West'];
          const depts = ['Sales', 'Marketing', 'R&D', 'Admin'];
          const accounts = [
            { name: 'Sales Revenue', type: 'Revenue' },
            { name: 'Service Revenue', type: 'Revenue' },
            { name: 'Salaries', type: 'Expense' },
            { name: 'Advertising', type: 'Expense' },
            { name: 'Rent', type: 'Expense' },
            { name: 'Software', type: 'Expense' },
            { name: 'Travel', type: 'Expense' },
            { name: 'Consulting', type: 'Expense' }
          ];
          
          const data = [];
          const startDate = new Date('2023-01-01');

          for (let i = 0; i < 500; i++) {
            const date = new Date(startDate);
            date.setDate(startDate.getDate() + Math.floor(Math.random() * 730)); // 2 years
            
            let isAnomaly = false;
            if (i % 97 === 0) isAnomaly = true;

            const acct = accounts[Math.floor(Math.random() * accounts.length)];
            let amt = Math.floor(Math.random() * 10000) + 100;
            
            if (isAnomaly && acct.name === 'Travel' && Math.random() > 0.5) {
                amt = 45000; 
            }

            const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            
            const realAmount = acct.type === 'Expense' ? -amt : amt;

            data.push({
              id: i + 1000,
              Date: date.toISOString().split('T')[0],
              Year: date.getFullYear(),
              Quarter: `Q${Math.floor(date.getMonth() / 3) + 1}`,
              Month: monthNames[date.getMonth()],
              Region: isAnomaly && acct.name === 'Travel' ? 'North' : regions[Math.floor(Math.random() * regions.length)],
              Department: isAnomaly && acct.name === 'Travel' ? 'Admin' : depts[Math.floor(Math.random() * depts.length)],
              Account: acct.name,
              Type: acct.type,
              Amount: realAmount,
              AbsAmount: Math.abs(realAmount) // Added Absolute Amount
            });
          }
          return data;
        };

        const INITIAL_DATA = generateData();
        const DEFAULT_VALUE_FIELD = { field: 'Amount', agg: 'SUM', showAs: 'NORMAL' };

        const AUDIT_QUESTIONS = [
            {
                id: 1,
                title: "Revenue Trends",
                text: "Using a Line Chart, analyze the 'Sales Revenue' trend over the 'Quarters' for 2023 and 2024. Are there any seasonal dips?",
                hint: "Drag Year and Quarter to Rows/Columns. Filter Account to 'Sales Revenue'.",
                answer: "There are likely dips in Q1/Q2 depending on random generation, but look for consistency."
            },
            {
                id: 2,
                title: "Expense Anomalies (Top N)",
                text: "We suspect fraudulent travel claims. Use the Top N filter to find the 3 largest 'AbsAmount' entries for the Admin department. What is the value?",
                hint: "Filter Dept: Admin. Use 'AbsAmount' in Values. Use Top 10 Filter on the Rows field.",
                answer: "The 'North' region should show a significantly higher Travel expense (approx $45k anomaly)."
            },
            {
                id: 3,
                title: "Department Ratios",
                text: "Show the 'Salaries' expense as a % of the Grand Total for each Department. Which department consumes the most budget?",
                hint: "Filter Account: Salaries. Rows: Department. Value Settings: % of Grand Total.",
                answer: "Typically Sales or R&D will be highest, check the exact percentage in the table."
            },
            {
                id: 4,
                title: "Regional Performance",
                text: "Compare 'Service Revenue' across Regions. Use a Pie Chart to visualize the share of each region.",
                hint: "Filter Account: Service Revenue. Rows: Region. Chart Type: Pie.",
                answer: "The pie chart will show the distribution. Look for the largest slice."
            },
            {
                id: 5,
                title: "Audit Sample",
                text: "Find the MAX single transaction amount for 'Consulting' in the East region.",
                hint: "Filters: Region=East, Account=Consulting. Change Value Aggregation from SUM to MAX.",
                answer: "The table will display the single highest transaction value instead of the sum."
            },
            {
                id: 6,
                title: "Big Spenders",
                text: "Filter the Pivot Table to show only the Top 5 Accounts based on AbsAmount. Which Account has the highest total magnitude?",
                hint: "Drag 'Account' to Rows. Drag 'AbsAmount' to Values. Click Top N Filter button.",
                answer: "Usually Sales Revenue or Salaries, depending on the random generation."
            }
        ];

        const ExcelSimulator = () => {
            // Screen & Data State
            const [activeScreen, setActiveScreen] = useState('SHEET');
            const [activeTab, setActiveTab] = useState('Home');
            const [data, setData] = useState(INITIAL_DATA);
            const [viewMode, setViewMode] = useState('Table');
            const [chartType, setChartType] = useState('Bar');

            // Pivot State
            const [pivotConfig, setPivotConfig] = useState({
                rows: [],
                columns: [],
                values: [],
                filters: []
            });

            // Layout Options
            const [showSubtotals, setShowSubtotals] = useState(true);
            const [grandTotalMode, setGrandTotalMode] = useState('ROWS_AND_COLS');

            // Filters & Slicers
            const [activeFilters, setActiveFilters] = useState({});
            const [activeSlicerFields, setActiveSlicerFields] = useState([]);
            const [slicerPositions, setSlicerPositions] = useState({});
            const [isDraggingSlicer, setIsDraggingSlicer] = useState(null);
            const dragOffset = useRef({ x: 0, y: 0 });
            
            // Slicer Selection Modal
            const [slicerModalOpen, setSlicerModalOpen] = useState(false);
            const [tempSlicerSelection, setTempSlicerSelection] = useState([]);

            // Top N Filter State
            const [topNFilter, setTopNFilter] = useState({ 
                enabled: false, 
                mode: 'Top', 
                n: 10, 
                type: 'Items', 
                field: 'Amount'
            });
            const [topNModalOpen, setTopNModalOpen] = useState(false);
            const [topNInput, setTopNInput] = useState({ mode: 'Top', n: 10, type: 'Items', field: 'Amount' });

            // Instructor Mode
            const [instructorLoginOpen, setInstructorLoginOpen] = useState(false);
            const [instructorPassword, setInstructorPassword] = useState('');
            const [instructorMode, setInstructorMode] = useState(false);

            // Calculated Field State
            const [calcFieldModalOpen, setCalcFieldModalOpen] = useState(false);
            const [newFieldName, setNewFieldName] = useState('');
            const [newFieldFormula, setNewFieldFormula] = useState('');

            // Value Field Settings
            const [valueSettingsOpen, setValueSettingsOpen] = useState(null); // null or index

            // Audit Questions
            const [currentProblem, setCurrentProblem] = useState(0);
            const [showProblem, setShowProblem] = useState(true);

            // Drag State
            const [draggedField, setDraggedField] = useState(null);

            // --- Helpers ---
            const getUniqueValues = (field) => Array.from(new Set(data.map(d => d[field]))).sort();

            const calculateSingleMetricValue = (rows, configField, aggType) => {
                 const values = rows.map(r => Number(r[configField]) || 0);
                 if (values.length === 0) return 0;

                 switch (aggType) {
                    case 'SUM': return values.reduce((a, b) => a + b, 0);
                    case 'COUNT': return rows.length;
                    case 'AVG': return values.reduce((a, b) => a + b, 0) / rows.length;
                    case 'MAX': return Math.max(...values);
                    case 'MIN': return Math.min(...values);
                    default: return 0;
                 }
            };

            const calculateMetric = (rows, config, context) => {
                if (!rows || rows.length === 0 || !config) return null; 
                
                let val = calculateSingleMetricValue(rows, config.field, config.agg);

                // Show Values As Logic
                if (config.showAs === 'PCT_GRAND' && processedData.grandTotal) return (val / processedData.grandTotal) * 100;
                if (config.showAs === 'PCT_ROW' && context?.rowTotal) return (val / context.rowTotal) * 100;
                if (config.showAs === 'PCT_COL' && context?.colTotal) return (val / context.colTotal) * 100;
                
                return val;
            };

            const formatValue = (val, config) => {
                if (val === null || val === undefined) return "";
                
                if (config.showAs !== 'NORMAL') return val.toFixed(2) + '%';
                if (config.agg === 'COUNT') return Math.round(val).toString();
                
                const isNeg = val < 0;
                const absVal = Math.abs(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                return isNeg ? `(${absVal})` : absVal;
            };

            // --- Processing Engine ---
            const processedData = useMemo(() => {
                // 1. Filter Data (Unified Filter State)
                let filtered = data.filter(row => {
                    return Object.entries(activeFilters).every(([field, selectedValues]) => {
                        if (!selectedValues || selectedValues.length === 0) return true;
                        return selectedValues.includes(String(row[field]));
                    });
                });

                // 2. Group
                const getGroups = (dataset, fields) => {
                    if (fields.length === 0) {
                        return [{ key: 'Total', field: 'Total', children: null, rows: dataset }];
                    }
                    const [currentField, ...rest] = fields;
                    const groups = {};
                    dataset.forEach(row => {
                        const key = String(row[currentField]);
                        if (!groups[key]) groups[key] = [];
                        groups[key].push(row);
                    });

                    let sortedKeys = Object.keys(groups).sort();

                    // Top N Filter Logic (Applied to first row dimension)
                    if (topNFilter.enabled && fields[0] === pivotConfig.rows[0]) {
                        const activeValue = pivotConfig.values[0]; 
                        
                        // We use the aggregation logic of the active value field, or default to SUM of Amount if none selected
                        const sortField = activeValue ? activeValue.field : 'Amount';
                        const sortAgg = activeValue ? activeValue.agg : 'SUM';

                        sortedKeys = sortedKeys.sort((a, b) => {
                            const valA = calculateSingleMetricValue(groups[a], sortField, sortAgg);
                            const valB = calculateSingleMetricValue(groups[b], sortField, sortAgg);
                            return topNFilter.mode === 'Top' ? valB - valA : valA - valB; 
                        }).slice(0, topNFilter.n);
                    }

                    return sortedKeys.map(key => ({
                        key,
                        field: currentField,
                        children: rest.length > 0 ? getGroups(groups[key], rest) : null,
                        rows: groups[key]
                    }));
                };

                const rowGroups = getGroups(filtered, pivotConfig.rows);

                // 3. Columns
                const getColKeys = () => {
                    if (pivotConfig.columns.length === 0) return ['Total'];
                    const keys = new Set();
                    filtered.forEach(row => {
                        const key = pivotConfig.columns.map(c => row[c]).join(' - ');
                        keys.add(key);
                    });
                    return Array.from(keys).sort();
                };
                const colKeys = getColKeys();

                // 4. Totals (using first value field for generic totals if multiple)
                const activeValue = pivotConfig.values[0]; 
                let grandTotal = 0;
                const colTotals = {};
                colKeys.forEach(k => colTotals[k] = 0);

                if (activeValue) {
                    grandTotal = calculateSingleMetricValue(filtered, activeValue.field, activeValue.agg);
                    
                    filtered.forEach(row => {
                        const key = pivotConfig.columns.length === 0 ? 'Total' : pivotConfig.columns.map(c => row[c]).join(' - ');
                        // This col total approximation is tricky with anything other than SUM/COUNT, but sufficient for this sim
                        // For correct AVG/MIN/MAX totals per column, we'd need to re-aggregate the subset.
                        // Let's do subset aggregation for correctness:
                    });
                    
                    // Re-calculate Col Totals properly based on aggregation
                    colKeys.forEach(k => {
                        const colRows = filtered.filter(r => {
                            if (pivotConfig.columns.length === 0) return true;
                             return pivotConfig.columns.map(c => r[c]).join(' - ') === k;
                        });
                        colTotals[k] = calculateSingleMetricValue(colRows, activeValue.field, activeValue.agg);
                    });
                }

                return { rowGroups, colKeys, rawData: filtered, grandTotal, colTotals };
            }, [data, pivotConfig, activeFilters, topNFilter]);

            // --- Handlers ---
            const handleDragStart = (e, field) => {
                setDraggedField(field);
                e.dataTransfer.setData('text/plain', field);
            };

            const handleDrop = (e, area) => {
                e.preventDefault();
                const field = e.dataTransfer.getData('text/plain');
                if (!field) return;

                const newConfig = { ...pivotConfig };
                
                (['rows', 'columns', 'filters'] ).forEach(k => {
                    newConfig[k] = newConfig[k].filter(f => f !== field);
                });
                newConfig.values = newConfig.values.filter(v => v.field !== field);

                if (area === 'values') {
                    // Default new value to Sum
                    newConfig.values.push({ field, agg: 'SUM', showAs: 'NORMAL' });
                } else {
                    if (field === 'Date' && area === 'rows') {
                        ['Year', 'Quarter', 'Month'].forEach(subField => {
                            if (!newConfig.rows.includes(subField)) newConfig.rows.push(subField);
                        });
                    } else {
                        newConfig[area].push(field);
                    }
                }
                setPivotConfig(newConfig);
                setDraggedField(null);
            };

            const toggleFilter = (field, value) => {
                setActiveFilters(prev => {
                    const current = prev[field] || [];
                    const next = current.includes(String(value)) 
                        ? current.filter(x => x !== String(value)) 
                        : [...current, String(value)];
                    return { ...prev, [field]: next };
                });
            };

            // Slicer Dragging
            const handleSlicerDragStart = (e, field) => {
                const pos = slicerPositions[field] || {x: 50, y: 50};
                dragOffset.current = { x: e.clientX - pos.x, y: e.clientY - pos.y };
                setIsDraggingSlicer(field);
            };

            useEffect(() => {
                const handleMouseMove = (e) => {
                    if (isDraggingSlicer) {
                        setSlicerPositions(prev => ({
                            ...prev,
                            [isDraggingSlicer]: { x: e.clientX - dragOffset.current.x, y: e.clientY - dragOffset.current.y }
                        }));
                    }
                };
                const handleMouseUp = () => setIsDraggingSlicer(null);
                if (isDraggingSlicer) {
                    window.addEventListener('mousemove', handleMouseMove);
                    window.addEventListener('mouseup', handleMouseUp);
                }
                return () => {
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('mouseup', handleMouseUp);
                };
            }, [isDraggingSlicer]);

            const submitInstructorLogin = () => {
                if (instructorPassword === 'teacher') {
                    setInstructorMode(true);
                    setInstructorLoginOpen(false);
                    alert("Instructor Access Granted.");
                } else {
                    alert("Incorrect Password.");
                }
            };

            const applyTopN = () => {
                setTopNFilter({ ...topNInput, enabled: true });
                setTopNModalOpen(false);
            };

            const updateValueField = (index, updates) => {
                const newValues = [...pivotConfig.values];
                newValues[index] = { ...newValues[index], ...updates };
                setPivotConfig({ ...pivotConfig, values: newValues });
            };

            const openInsertSlicer = () => {
                setTempSlicerSelection([...activeSlicerFields]);
                setSlicerModalOpen(true);
            };

            const confirmSlicers = () => {
                setActiveSlicerFields(tempSlicerSelection);
                // Assign default positions for new slicers
                setSlicerPositions(prev => {
                    const nextPos = {...prev};
                    tempSlicerSelection.forEach((f, i) => {
                        if (!nextPos[f]) nextPos[f] = {x: 100 + (i*160), y: 100};
                    });
                    return nextPos;
                });
                setSlicerModalOpen(false);
            };

            const addCalculatedField = () => {
                 try {
                    const newData = data.map(row => {
                        let formula = newFieldFormula;
                        Object.keys(row).forEach(key => {
                            if (typeof row[key] === 'number') {
                                    formula = formula.replace(new RegExp(key, 'g'), String(row[key]));
                            }
                        });
                        const result = new Function('return ' + formula)();
                        return { ...row, [newFieldName]: result };
                    });
                    setData(newData);
                    setCalcFieldModalOpen(false);
                } catch(e) { alert("Error in formula"); }
            }

            const clearAllFilters = () => {
                setActiveFilters({});
                setTopNFilter(prev => ({ ...prev, enabled: false }));
                setActiveSlicerFields([]);
            };

            // --- Renderers ---
            
            const renderSheet = () => (
                <div className="flex-1 overflow-auto bg-white">
                    <table className="min-w-full border-collapse text-xs">
                        <thead className="bg-gray-100 sticky top-0 z-10">
                            <tr>
                                <th className="border p-1 w-10 text-center bg-gray-200 text-gray-500">#</th>
                                {Object.keys(data[0]).map(k => (
                                    <th key={k} className="border p-2 text-left font-semibold text-gray-700 min-w-[100px]">{k}</th>
                                ))}
                            </tr>
                        </thead>
                        <tbody>
                            {data.slice(0, 100).map((row, i) => (
                                <tr key={i} className="hover:bg-gray-50 even:bg-gray-50">
                                    <td className="border p-1 text-center bg-gray-100 text-gray-500">{i+1}</td>
                                    {Object.values(row).map((val, j) => (
                                        <td key={j} className="border p-1 px-2 whitespace-nowrap text-gray-800">
                                            {typeof val === 'number' && j > 4 ? val.toLocaleString() : val}
                                        </td>
                                    ))}
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );

            const renderPivotTable = () => {
                if (pivotConfig.rows.length === 0 && pivotConfig.columns.length === 0 && pivotConfig.values.length === 0) {
                    return (
                        <div className="flex flex-col items-center justify-center h-full text-gray-400 p-10 text-center">
                            <Icons.Table size={48} className="mb-4 opacity-50" />
                            <h3 className="text-lg font-semibold mb-2">PivotTable is Empty</h3>
                            <p className="text-sm max-w-xs">Drag fields from the list on the right to build your report.</p>
                        </div>
                    );
                }

                const activeValue = pivotConfig.values[0]; 
                const hasRows = pivotConfig.rows.length > 0;

                const renderGroup = (groups, level = 0) => {
                    return groups.map(group => {
                        let rawRowTotal = 0;
                        if(activeValue) {
                            rawRowTotal = calculateSingleMetricValue(group.rows, activeValue.field, activeValue.agg);
                        }

                        const cells = processedData.colKeys.map(colKey => {
                            const cellRows = group.rows.filter(r => {
                                if (pivotConfig.columns.length === 0) return true;
                                return pivotConfig.columns.map(c => r[c]).join(' - ') === colKey;
                            });
                            
                            if (!activeValue) return <td key={colKey} className="border-r border-gray-300 px-2 py-1"></td>;

                            const val = calculateMetric(cellRows, activeValue, { 
                                rowTotal: rawRowTotal, 
                                colTotal: processedData.colTotals[colKey] 
                            });
                            return <td key={colKey} className="border-r border-gray-300 px-2 py-1 text-right tabular-nums">{formatValue(val, activeValue)}</td>;
                        });

                        const rowTotalVal = activeValue ? calculateMetric(group.rows, activeValue, {
                            rowTotal: rawRowTotal,
                            colTotal: processedData.grandTotal
                        }) : null;

                        return (
                            <React.Fragment key={group.key}>
                                <tr className="hover:bg-gray-50 text-sm">
                                    {hasRows ? (
                                        <td className="border-r border-gray-300 px-2 py-1 text-left" style={{ paddingLeft: `${level * 20 + 8}px` }}>
                                            {group.children ? <span className="font-bold">{group.key}</span> : group.key}
                                        </td>
                                    ) : (
                                        <td className="border-r border-gray-300 px-2 py-1 text-left font-bold">Total</td>
                                    )}
                                    {cells}
                                    {(grandTotalMode.includes('ROWS')) && <td className="border-r border-gray-300 px-2 py-1 text-right font-bold bg-gray-50">{activeValue ? formatValue(rowTotalVal, activeValue) : ''}</td>}
                                </tr>
                                {group.children && renderGroup(group.children, level + 1)}
                            </React.Fragment>
                        );
                    });
                };

                return (
                    <div className="flex flex-col h-full overflow-hidden">
                        {/* Report Filters */}
                        {pivotConfig.filters.length > 0 && (
                            <div className="p-2 mb-2 grid grid-cols-2 md:grid-cols-3 gap-2 bg-gray-50 border-b">
                                {pivotConfig.filters.map(f => {
                                    const fieldName = typeof f === 'string' ? f : f.field;
                                    const selection = activeFilters[fieldName] || [];
                                    return (
                                        <div key={fieldName} className="flex items-center space-x-2">
                                            <span className="text-xs font-bold text-gray-700 w-20 truncate text-right">{fieldName}:</span>
                                            <select 
                                                className="text-xs border border-gray-300 rounded px-2 py-1 bg-white focus:outline-none focus:border-blue-500"
                                                value={selection.length === 1 ? selection[0] : ""}
                                                onChange={(e) => toggleFilter(fieldName, e.target.value)}
                                            >
                                                <option value="">(All)</option>
                                                {getUniqueValues(fieldName).map(v => (
                                                    <option key={v} value={v}>{v}</option>
                                                ))}
                                            </select>
                                            {selection.length > 0 && <Icons.Filter size={10} className="text-blue-600"/>}
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        <div className="overflow-auto border border-gray-300 bg-white shadow-sm flex-1">
                            <table className="w-full border-collapse text-sm">
                                <thead className="sticky top-0 bg-white shadow-sm z-10">
                                    <tr className="bg-gray-100 text-gray-600">
                                        <th className="border-r border-b border-gray-300 px-4 py-2 text-left w-64 font-semibold">Row Labels</th>
                                        {processedData.colKeys.map(k => (
                                            <th key={k} className="border-r border-b border-gray-300 px-4 py-2 text-right font-semibold whitespace-nowrap">{k}</th>
                                        ))}
                                        {grandTotalMode.includes('ROWS') && <th className="border-b border-gray-300 px-4 py-2 text-right font-bold bg-gray-200">Grand Total</th>}
                                    </tr>
                                </thead>
                                <tbody>
                                    {renderGroup(processedData.rowGroups)}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            const renderChart = () => {
                const activeValue = pivotConfig.values[0];
                if (!activeValue) return <div className="flex items-center justify-center h-full text-gray-400">Add a Value field to generate chart</div>;

                const getChartData = (groups, prefix = '') => {
                    let points = [];
                    groups.forEach(g => {
                        const label = prefix ? `${prefix} - ${g.key}` : g.key;
                        if (g.children && g.children.length > 0) points = [...points, ...getChartData(g.children, label)];
                        else points.push({ label, value: calculateMetric(g.rows, activeValue) });
                    });
                    return points;
                };
                const dataPoints = getChartData(processedData.rowGroups);
                if (dataPoints.length === 0) return <div className="flex items-center justify-center h-full text-gray-400">No data</div>;

                // Domain Calculation for Scaling
                const values = dataPoints.map(d => d.value);
                const minVal = Math.min(...values);
                const maxVal = Math.max(...values);
                
                // Determine scale domain
                const domainMin = minVal >= 0 ? 0 : minVal;
                const domainMax = maxVal <= 0 ? 0 : maxVal;
                const domainRange = domainMax - domainMin || 1; // Prevent div by zero

                const W = 600, H = 300, P = 40;
                
                let chartSvg = null;

                if (chartType === 'Bar') {
                    const barW = (W - P*2) / dataPoints.length;
                    // Zero line position
                    const zeroY = H - P - ((0 - domainMin) / domainRange) * (H - 2*P);

                    chartSvg = (
                        <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-full bg-white border shadow-sm">
                            {/* Zero Line */}
                            <line x1={P} y1={zeroY} x2={W-P} y2={zeroY} stroke="#999" strokeWidth="1" />
                            {/* Grid Lines (Simple) */}
                            <line x1={P} y1={P} x2={P} y2={H-P} stroke="#ccc" />
                            
                            {dataPoints.map((d, i) => {
                                const valRatio = (d.value - domainMin) / domainRange;
                                const barH = Math.abs(d.value / domainRange) * (H - 2*P);
                                // Y Position depends on if positive or negative
                                let yPos;
                                if (d.value >= 0) {
                                    yPos = H - P - valRatio * (H - 2*P);
                                } else {
                                    yPos = zeroY;
                                }
                                
                                return (
                                    <g key={i}>
                                        <rect 
                                            x={P + i*barW + 5} 
                                            y={yPos} 
                                            width={Math.max(barW-10, 2)} 
                                            height={barH} 
                                            fill={d.value >= 0 ? "#107C41" : "#D13438"} 
                                        >
                                            <title>{d.label}: {Math.round(d.value)}</title>
                                        </rect>
                                        <text x={P + i*barW + barW/2} y={H-P+15} textAnchor="middle" fontSize="8" fill="#666">{d.label.length > 8 ? d.label.slice(0,6)+'..' : d.label}</text>
                                    </g>
                                )
                            })}
                        </svg>
                    );
                } else if (chartType === 'Pie') {
                    // Pie charts only really work with absolute magnitude or positive values usually. 
                    // We'll use absolute for visualization if mixed.
                    let total = dataPoints.reduce((s,d) => s + Math.abs(d.value), 0) || 1;
                    let acc = 0;
                    const cx = W/2, cy = H/2, r = Math.min(W-P*2, H-P*2)/2;
                    const colors = ['#107C41', '#21A366', '#33C481', '#185C37', '#87D2A8'];
                    chartSvg = (
                        <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-full bg-white border shadow-sm">
                            {dataPoints.map((d, i) => {
                                const val = Math.abs(d.value);
                                const angle = (val/total) * 360;
                                const rad1 = (acc * Math.PI)/180;
                                const rad2 = ((acc+angle) * Math.PI)/180;
                                const x1 = cx + r*Math.cos(rad1), y1 = cy + r*Math.sin(rad1);
                                const x2 = cx + r*Math.cos(rad2), y2 = cy + r*Math.sin(rad2);
                                const large = angle > 180 ? 1 : 0;
                                acc += angle;
                                return (
                                    <path key={i} d={`M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z`} 
                                          fill={colors[i % colors.length]} stroke="white">
                                        <title>{d.label}: {Math.round(d.value)}</title>
                                    </path>
                                )
                            })}
                        </svg>
                    );
                }
                 else if (chartType === 'Line') {
                     const stepX = (W - P*2) / (dataPoints.length - 1 || 1);
                     const points = dataPoints.map((d, i) => {
                         const valRatio = (d.value - domainMin) / domainRange;
                         const y = H - P - (valRatio * (H - 2*P));
                         return `${P + i * stepX},${y}`;
                     }).join(' ');
                     
                     // Zero line
                     const zeroY = H - P - ((0 - domainMin) / domainRange) * (H - 2*P);

                     chartSvg = (
                         <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-full bg-white border shadow-sm">
                             {/* Zero Line */}
                             <line x1={P} y1={zeroY} x2={W-P} y2={zeroY} stroke="#ccc" strokeDasharray="4" />
                             
                             <polyline points={points} fill="none" stroke="#107C41" strokeWidth="2" />
                             {dataPoints.map((d, i) => {
                                 const valRatio = (d.value - domainMin) / domainRange;
                                 const y = H - P - (valRatio * (H - 2*P));
                                 return (
                                     <g key={i}>
                                        <circle cx={P + i * stepX} cy={y} r="3" fill="white" stroke="#107C41"><title>{d.label}: {Math.round(d.value)}</title></circle>
                                        <text x={P + i*stepX} y={H-P+15} textAnchor="middle" fontSize="8" fill="#666">{d.label.length > 8 ? d.label.slice(0,6)+'..' : d.label}</text>
                                     </g>
                                 )
                             })}
                         </svg>
                     )
                 }
                
                return (
                    <div className="flex-1 flex items-center justify-center p-4 bg-gray-50 overflow-hidden">
                        <div className="w-full max-w-3xl aspect-[2/1] bg-white shadow-lg">
                            {chartSvg}
                        </div>
                    </div>
                );
            };

            // --- Render Main ---
            return (
                <div className="flex flex-col h-screen font-sans text-gray-800">
                    {/* Ribbon */}
                    <div className="bg-[#107C41] text-white shadow-sm z-50">
                        <div className="flex items-center justify-between px-4 py-2 border-b border-green-800">
                            <div className="flex items-center space-x-2">
                                <Icons.Grid className="w-5 h-5 opacity-80" />
                                <span className="font-semibold text-lg">Excel Simulator</span>
                                <span className="text-xs bg-green-700 px-2 py-0.5 rounded border border-green-600">Student Lab</span>
                            </div>
                            <div className="text-xs flex items-center space-x-4">
                                {instructorMode ? <span className="text-yellow-300 font-bold flex gap-1 bg-black/20 px-2 py-1 rounded"><Icons.Key size={12}/> Instructor Mode Active</span> :
                                <button onClick={() => setInstructorLoginOpen(true)} className="hover:bg-green-600 bg-green-700 px-2 py-1 rounded border border-green-500 flex items-center gap-1 transition-colors">
                                    <Icons.Key size={12} /> Instructor Access
                                </button>}
                            </div>
                        </div>
                        <div className="flex px-2 space-x-1 text-sm pt-1 bg-[#107C41]">
                            {['Home', 'Insert', 'Data', 'Analyze', 'Design'].map(tab => (
                                <button key={tab} onClick={() => setActiveTab(tab)} className={`px-5 py-1.5 rounded-t-md text-xs transition-colors ${activeTab===tab ? 'bg-gray-100 text-[#107C41] font-bold shadow-sm' : 'hover:bg-green-700 text-white'}`}>{tab.toUpperCase()}</button>
                            ))}
                        </div>
                    </div>

                    {/* Toolbar */}
                    <div className="bg-gray-100 border-b border-gray-300 p-2 flex h-24 shadow-inner space-x-3 overflow-x-auto items-center">
                        {activeTab === 'Home' && (
                             <div className="flex space-x-3 items-center h-full">
                                <div className="flex flex-col items-center justify-center px-4 py-2 bg-white rounded shadow-sm border border-gray-200 cursor-pointer hover:bg-gray-50 transition-colors h-full" onClick={() => setActiveScreen('SHEET')}>
                                    <Icons.FileText size={24} className="text-[#107C41] mb-1" />
                                    <span className="text-[11px] font-medium">Sheet View</span>
                                </div>
                                <div className="h-4/5 w-px bg-gray-300 mx-2"></div>
                                <div className="flex flex-col justify-center space-y-1 h-full">
                                    <button className="text-[11px] px-2 py-1 hover:bg-white rounded text-left flex items-center gap-1"><Icons.FileText size={10}/> Copy</button>
                                    <button className="text-[11px] px-2 py-1 hover:bg-white rounded text-left flex items-center gap-1"><Icons.Table size={10}/> Paste</button>
                                </div>
                                <div className="h-4/5 w-px bg-gray-300 mx-2"></div>
                                <a href="data/PivotTable_MiniLab_Accounting_Student.xlsx" download className="flex flex-col items-center justify-center text-gray-700 hover:text-green-700 cursor-pointer h-full px-2">
                                    <div className="bg-white p-2 rounded-full border shadow-sm mb-1"><Icons.Download size={18} /></div>
                                    <span className="text-[10px] text-center font-medium">Download Data</span>
                                </a>
                             </div>
                        )}
                        {activeTab === 'Insert' && (
                            <div className="flex space-x-3 items-center h-full">
                                <div 
                                    className="flex flex-col items-center justify-center px-4 py-2 bg-white rounded shadow-sm border border-gray-200 hover:bg-green-50 cursor-pointer border-green-200 h-full transition-colors" 
                                    onClick={() => { setActiveScreen('PIVOT'); setActiveTab('Analyze'); }}
                                >
                                    <Icons.Table size={28} className="text-[#107C41] mb-1" />
                                    <span className="text-[11px] font-bold">PivotTable</span>
                                </div>
                                <div className="flex flex-col items-center justify-center px-4 py-2 bg-white rounded shadow-sm border border-gray-200 opacity-50 h-full">
                                    <Icons.Activity size={28} className="mb-1" />
                                    <span className="text-[11px]">Recommended</span>
                                </div>
                            </div>
                        )}
                        {activeTab === 'Data' && (
                             <div className="flex space-x-4 px-2">
                                 <div className="flex flex-col items-center justify-center cursor-pointer hover:bg-gray-200 p-2 rounded">
                                     <Icons.Filter size={24} />
                                     <span className="text-[10px] mt-1 font-medium">Filter</span>
                                 </div>
                             </div>
                        )}
                        {activeTab === 'Analyze' && activeScreen === 'PIVOT' && (
                            <div className="flex space-x-4 items-center px-2 h-full">
                                 <div className="flex flex-col items-center justify-center px-3 border-r h-full">
                                    <span className="text-[10px] uppercase text-gray-400 font-bold mb-1">Active Field</span>
                                    <input className="text-xs border p-1 rounded w-24 bg-white" value={pivotConfig.values[0]?.field || "None"} readOnly />
                                </div>

                                <div className="flex flex-col items-center justify-center px-3 border-r h-full cursor-pointer hover:bg-gray-200 rounded" onClick={openInsertSlicer}>
                                    <Icons.Table size={20} className="text-purple-600 mb-1"/>
                                    <span className="text-[10px] font-semibold">Insert Slicer</span>
                                </div>

                                <div className="flex flex-col items-center justify-center px-3 border-r h-full cursor-pointer hover:bg-gray-200 rounded" onClick={() => setTopNModalOpen(true)}>
                                    <Icons.Filter size={20} className="text-blue-600 mb-1"/>
                                    <span className="text-[10px] font-semibold">{topNFilter.enabled ? `Top ${topNFilter.n}` : 'Top N Filter'}</span>
                                </div>
                                
                                <div className="flex flex-col items-center justify-center px-3 border-r h-full cursor-pointer hover:bg-gray-200 rounded" onClick={() => setCalcFieldModalOpen(true)}>
                                    <Icons.Calculator size={20} className="mb-1"/>
                                    <span className="text-[10px] font-medium">Calculated Field</span>
                                </div>

                                <div className="flex flex-col items-center justify-center px-3 border-r h-full cursor-pointer hover:bg-red-50 group rounded" onClick={clearAllFilters}>
                                    <Icons.X size={20} className="mb-1 text-red-500 group-hover:text-red-600"/>
                                    <span className="text-[10px] font-semibold text-gray-700 group-hover:text-red-700">Clear All</span>
                                </div>

                                <div className="flex flex-col justify-center px-2">
                                    <span className="text-[10px] uppercase text-gray-400 font-bold mb-1 text-center">Tools</span>
                                    <div className="flex bg-white rounded border border-gray-300 overflow-hidden shadow-sm">
                                        <button onClick={() => setViewMode('Table')} className={`p-1.5 border-r hover:bg-gray-50 ${viewMode==='Table' ? 'bg-green-50 text-green-700':''}`} title="PivotTable"><Icons.Table size={16}/></button>
                                        <button onClick={() => { setViewMode('Chart'); setChartType('Bar'); }} className={`p-1.5 border-r hover:bg-gray-50 ${chartType==='Bar' && viewMode==='Chart' ? 'bg-green-50 text-green-700':''}`} title="Bar Chart"><Icons.BarChart size={16}/></button>
                                        <button onClick={() => { setViewMode('Chart'); setChartType('Line'); }} className={`p-1.5 border-r hover:bg-gray-50 ${chartType==='Line' && viewMode==='Chart' ? 'bg-green-50 text-green-700':''}`} title="Line Chart"><Icons.Activity size={16}/></button>
                                        <button onClick={() => { setViewMode('Chart'); setChartType('Pie'); }} className={`p-1.5 hover:bg-gray-50 ${chartType==='Pie' && viewMode==='Chart' ? 'bg-green-50 text-green-700':''}`} title="Pie Chart"><Icons.PieChart size={16}/></button>
                                    </div>
                                </div>
                            </div>
                        )}
                        {activeTab === 'Design' && activeScreen === 'PIVOT' && (
                             <div className="flex items-center space-x-4 px-4 h-full">
                                <div className="flex flex-col space-y-1">
                                    <label className="text-[10px] font-bold text-gray-500 uppercase">Subtotals</label>
                                    <select className="text-xs border rounded p-1 bg-white" onChange={(e) => setShowSubtotals(e.target.value === 'show')} value={showSubtotals ? 'show' : 'hide'}>
                                        <option value="hide">Do Not Show Subtotals</option>
                                        <option value="show">Show Subtotals</option>
                                    </select>
                                </div>
                                <div className="flex flex-col space-y-1">
                                    <label className="text-[10px] font-bold text-gray-500 uppercase">Grand Totals</label>
                                    <select className="text-xs border rounded p-1 bg-white" onChange={(e) => setGrandTotalMode(e.target.value)} value={grandTotalMode}>
                                        <option value="OFF">Off for Rows and Columns</option>
                                        <option value="ROWS_AND_COLS">On for Rows and Columns</option>
                                        <option value="ROWS_ONLY">On for Rows Only</option>
                                        <option value="COLS_ONLY">On for Columns Only</option>
                                    </select>
                                </div>
                             </div>
                        )}
                    </div>

                    {/* Workspace */}
                    <div className="flex-1 flex overflow-hidden relative">
                        {/* Sidebar */}
                        {showProblem && (
                            <div className="w-64 bg-yellow-50 border-r border-yellow-200 flex flex-col shadow-sm z-20">
                                <div className="p-3 bg-yellow-100 border-b border-yellow-200 flex justify-between items-center">
                                    <span className="font-bold text-sm text-yellow-900 flex items-center gap-1"><Icons.HelpCircle size={14}/> Audit Scenario</span>
                                    <button onClick={() => setShowProblem(false)} className="text-yellow-700"><Icons.X size={14}/></button>
                                </div>
                                <div className="flex-1 p-4 overflow-y-auto">
                                    <div className="mb-4">
                                        <span className="text-xs font-bold text-yellow-800 uppercase">Question {currentProblem + 1}</span>
                                        <h3 className="text-md font-bold text-gray-800 mt-1 leading-snug">{AUDIT_QUESTIONS[currentProblem].title}</h3>
                                        <p className="text-sm text-gray-700 mt-2">{AUDIT_QUESTIONS[currentProblem].text}</p>
                                    </div>
                                    <div className="bg-white p-3 rounded border border-yellow-200 text-xs text-gray-600 mb-4 shadow-sm">
                                        <strong>Hint:</strong> {AUDIT_QUESTIONS[currentProblem].hint}
                                    </div>
                                    {instructorMode && (
                                        <div className="bg-green-50 p-3 rounded border border-green-200 text-xs shadow-sm">
                                            <strong className="text-green-700 flex items-center gap-1 mb-1"><Icons.Key size={10}/> Answer:</strong>
                                            <p className="text-gray-700">{AUDIT_QUESTIONS[currentProblem].answer}</p>
                                        </div>
                                    )}
                                </div>
                                <div className="p-3 border-t border-yellow-200 flex justify-between bg-yellow-100">
                                    <button disabled={currentProblem === 0} onClick={() => setCurrentProblem(p => p - 1)} className="text-xs text-yellow-900 disabled:opacity-50 flex items-center gap-1 font-semibold hover:underline"><Icons.ArrowLeft size={12}/> Prev</button>
                                    <button disabled={currentProblem === AUDIT_QUESTIONS.length - 1} onClick={() => setCurrentProblem(p => p + 1)} className="text-xs text-yellow-900 disabled:opacity-50 flex items-center gap-1 font-semibold hover:underline">Next <Icons.ArrowRight size={12}/></button>
                                </div>
                            </div>
                        )}
                        {!showProblem && (
                            <button onClick={() => setShowProblem(true)} className="absolute left-0 top-20 bg-yellow-400 p-2 rounded-r shadow-md z-30 hover:bg-yellow-500"><Icons.HelpCircle size={20} className="text-yellow-900"/></button>
                        )}

                        {/* Slicers Overlay */}
                        {activeSlicerFields.map(field => {
                            const pos = slicerPositions[field] || {x: 100, y: 100};
                            return (
                                <div 
                                    key={field} 
                                    style={{ top: pos.y, left: pos.x }}
                                    className="absolute w-40 bg-white shadow-xl border border-gray-400 flex flex-col max-h-52 z-40 rounded overflow-hidden"
                                >
                                    <div 
                                        onMouseDown={(e) => handleSlicerDragStart(e, field)}
                                        className="bg-blue-600 text-white text-xs font-bold px-2 py-1 flex justify-between items-center cursor-move"
                                    >
                                        {field}
                                        <Icons.X 
                                            size={12} 
                                            className="cursor-pointer hover:text-red-200" 
                                            onMouseDown={(e) => e.stopPropagation()} 
                                            onClick={() => setActiveSlicerFields(prev => prev.filter(f => f !== field))} 
                                        />
                                    </div>
                                    <div className="overflow-y-auto p-1 bg-gray-50 flex-1">
                                        {getUniqueValues(field).map((val) => (
                                            <div 
                                                key={val} 
                                                onClick={() => toggleFilter(field, val)}
                                                className={`cursor-pointer text-xs p-1 mb-0.5 border rounded ${
                                                    (activeFilters[field] || []).includes(String(val)) 
                                                    ? 'bg-blue-100 border-blue-400 font-semibold' 
                                                    : 'bg-white border-transparent hover:bg-gray-200'
                                                }`}
                                            >
                                                {val}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );
                        })}

                        {/* Main View */}
                        <div className="flex-1 p-6 bg-gray-50 overflow-auto">
                            {activeScreen === 'SHEET' ? renderSheet() : (
                                <div className="h-full flex flex-col">
                                    {viewMode === 'Chart' && (
                                        <div className="mb-2 text-center text-gray-500 text-sm font-semibold flex justify-center items-center gap-2">
                                            {chartType} Analysis 
                                            <button onClick={() => setViewMode('Table')} className="text-xs text-blue-600 underline ml-2 hover:text-blue-800">(Back to Table)</button>
                                        </div>
                                    )}
                                    {viewMode === 'Table' ? renderPivotTable() : renderChart()}
                                </div>
                            )}
                        </div>

                        {/* Pivot Fields Panel (Right Side) */}
                        {activeScreen === 'PIVOT' && (
                            <div className="w-72 bg-white border-l border-gray-300 flex flex-col shadow-xl z-20">
                                <div className="bg-gray-100 p-2 font-semibold text-sm border-b text-gray-700 flex justify-between items-center">
                                    <span>PivotTable Fields</span>
                                    <Icons.Settings size={14} className="text-gray-400 cursor-pointer"/>
                                </div>
                                <div className="flex-1 overflow-y-auto p-2 border-b bg-white">
                                    <div className="text-[10px] font-bold text-gray-400 uppercase mb-2">Drag fields to areas below</div>
                                    {Object.keys(data[0]).filter(k => k!=='id').map(field => (
                                        <div key={field} draggable onDragStart={(e) => handleDragStart(e, field)} className="flex items-center space-x-2 p-1.5 mb-1 hover:bg-gray-100 border border-transparent hover:border-gray-200 cursor-grab text-sm rounded transition-colors active:cursor-grabbing no-select">
                                            <Icons.GripVertical size={12} className="text-gray-300" />
                                            <span>{field}</span>
                                        </div>
                                    ))}
                                </div>
                                <div className="h-[400px] bg-gray-50 grid grid-rows-2 grid-cols-2 gap-1 p-1 border-t border-gray-200">
                                    {['filters', 'columns', 'rows', 'values'].map(area => (
                                        <div key={area} onDragOver={e => e.preventDefault()} onDrop={e => handleDrop(e, area)} className="bg-white border border-gray-300 rounded flex flex-col overflow-hidden">
                                            <div className="text-[10px] font-bold text-gray-500 p-1 border-b uppercase bg-gray-50">{area}</div>
                                            <div className="flex-1 p-1 overflow-y-auto">
                                                {pivotConfig[area].map((f, i) => (
                                                    <div 
                                                        key={i} 
                                                        className={`bg-white border shadow-sm rounded px-1 py-1 text-xs mb-1 flex justify-between items-center group hover:border-gray-400 ${area === 'values' ? 'cursor-pointer hover:bg-blue-50' : ''}`}
                                                        onClick={() => area === 'values' && setValueSettingsOpen(i)}
                                                    >
                                                        <span className="truncate max-w-[80px]">
                                                            {area === 'values' ? `${f.agg} of ${f.field}` : (typeof f === 'string' ? f : f.field)}
                                                        </span>
                                                        <Icons.X size={10} className="cursor-pointer text-gray-300 hover:text-red-500" 
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                const newCfg = {...pivotConfig};
                                                                newCfg[area] = newCfg[area].filter((_, idx) => idx !== i);
                                                                setPivotConfig(newCfg);
                                                            }}
                                                        />
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Value Field Settings Modal */}
                    {valueSettingsOpen !== null && pivotConfig.values[valueSettingsOpen] && (
                        <div className="fixed inset-0 bg-black/30 z-50 flex items-center justify-center">
                            <div className="bg-white rounded-lg shadow-xl p-6 w-80 text-sm">
                                <div className="font-bold border-b pb-2 mb-3">Value Field Settings</div>
                                <div className="mb-4">
                                    <div className="font-semibold mb-1 text-xs uppercase text-gray-500">Summarize value field by</div>
                                    <div className="h-24 overflow-y-auto border rounded p-1">
                                        {['SUM', 'COUNT', 'AVG', 'MAX', 'MIN'].map(agg => (
                                            <div 
                                                key={agg}
                                                onClick={() => updateValueField(valueSettingsOpen, { agg: agg })}
                                                className={`cursor-pointer px-2 py-1 rounded ${pivotConfig.values[valueSettingsOpen].agg === agg ? 'bg-blue-600 text-white' : 'hover:bg-gray-100'}`}
                                            >
                                                {agg === 'AVG' ? 'Average' : agg.charAt(0) + agg.slice(1).toLowerCase()}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="mb-4">
                                    <div className="font-semibold mb-1 text-xs uppercase text-gray-500">Show Values As</div>
                                    <select 
                                        className="w-full border p-1 rounded"
                                        value={pivotConfig.values[valueSettingsOpen].showAs}
                                        onChange={(e) => updateValueField(valueSettingsOpen, { showAs: e.target.value })}
                                    >
                                        <option value="NORMAL">No Calculation</option>
                                        <option value="PCT_GRAND">% of Grand Total</option>
                                        <option value="PCT_COL">% of Column Total</option>
                                        <option value="PCT_ROW">% of Row Total</option>
                                    </select>
                                </div>
                                <div className="flex justify-end pt-2 border-t">
                                    <button className="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300" onClick={() => setValueSettingsOpen(null)}>OK</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Slicer Selection Modal */}
                    {slicerModalOpen && (
                        <div className="fixed inset-0 bg-black/30 z-50 flex items-center justify-center">
                            <div className="bg-white rounded-lg shadow-xl p-6 w-80 text-sm">
                                <h3 className="font-bold mb-4 border-b pb-2">Insert Slicers</h3>
                                <div className="h-60 overflow-y-auto border p-2 mb-4 rounded bg-gray-50">
                                    {Object.keys(data[0]).filter(k => k!=='id').map(field => (
                                        <label key={field} className="flex items-center space-x-2 mb-1 cursor-pointer hover:bg-gray-100 p-1 rounded">
                                            <input 
                                                type="checkbox" 
                                                checked={tempSlicerSelection.includes(field)}
                                                onChange={() => {
                                                    setTempSlicerSelection(prev => 
                                                        prev.includes(field) ? prev.filter(f => f !== field) : [...prev, field]
                                                    );
                                                }}
                                            />
                                            <span>{field}</span>
                                        </label>
                                    ))}
                                </div>
                                <div className="flex justify-end space-x-2">
                                    <button onClick={() => setSlicerModalOpen(false)} className="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Cancel</button>
                                    <button onClick={confirmSlicers} className="px-3 py-1 bg-blue-600 text-white rounded hover:bg-blue-700">OK</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Top N Modal */}
                    {topNModalOpen && (
                        <div className="fixed inset-0 bg-black/30 z-50 flex items-center justify-center">
                            <div className="bg-white rounded-lg shadow-xl p-6 w-96">
                                <h3 className="font-bold mb-4 text-lg border-b pb-2">Top 10 Filter ({pivotConfig.rows[0] || 'Rows'})</h3>
                                <div className="flex items-center space-x-2 mb-6">
                                    <span className="text-sm">Show</span>
                                    <select 
                                        className="border p-1 rounded text-sm" 
                                        value={topNInput.mode} 
                                        onChange={e => setTopNInput({...topNInput, mode: e.target.value})}
                                    >
                                        <option value="Top">Top</option>
                                        <option value="Bottom">Bottom</option>
                                    </select>
                                    <input 
                                        type="number" 
                                        className="border p-1 w-16 text-center rounded text-sm" 
                                        value={topNInput.n} 
                                        onChange={e => setTopNInput({...topNInput, n: e.target.value})} 
                                    />
                                    <select 
                                        className="border p-1 rounded text-sm" 
                                        value={topNInput.type} 
                                        onChange={e => setTopNInput({...topNInput, type: e.target.value})}
                                    >
                                        <option value="Items">Items</option>
                                        <option value="Percent">Percent</option>
                                        <option value="Sum">Sum</option>
                                    </select>
                                    <span className="text-sm">by</span>
                                    <select 
                                        className="border p-1 rounded text-sm max-w-[100px]" 
                                        value={topNInput.field} 
                                        onChange={e => setTopNInput({...topNInput, field: e.target.value})}
                                    >
                                        {pivotConfig.values.map(v => (
                                            <option key={v.field} value={v.field}>{v.field}</option>
                                        ))}
                                        <option value="Amount">Amount</option>
                                    </select>
                                </div>
                                <div className="flex justify-end space-x-2">
                                    <button onClick={() => setTopNModalOpen(false)} className="px-4 py-2 text-sm bg-gray-200 rounded hover:bg-gray-300">Cancel</button>
                                    <button onClick={applyTopN} className="px-4 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700">OK</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Calculated Field Modal */}
                    {calcFieldModalOpen && (
                        <div className="fixed inset-0 bg-black/30 z-50 flex items-center justify-center">
                            <div className="bg-white rounded-lg shadow-xl p-6 w-96">
                                <h3 className="font-bold mb-4 text-lg border-b pb-2">Insert Calculated Field</h3>
                                <div className="mb-4">
                                    <label className="block text-xs font-bold mb-1 uppercase text-gray-500">Name</label>
                                    <input type="text" className="w-full border p-2 rounded text-sm" placeholder="e.g. Tax" value={newFieldName} onChange={e => setNewFieldName(e.target.value)} />
                                </div>
                                <div className="mb-6">
                                    <label className="block text-xs font-bold mb-1 uppercase text-gray-500">Formula</label>
                                    <input type="text" className="w-full border p-2 rounded text-sm font-mono" placeholder="e.g. Amount * 0.1" value={newFieldFormula} onChange={e => setNewFieldFormula(e.target.value)} />
                                    <p className="text-[10px] text-gray-400 mt-1">Use exact field names (case sensitive)</p>
                                </div>
                                <div className="flex justify-end space-x-2">
                                    <button onClick={() => setCalcFieldModalOpen(false)} className="px-4 py-2 text-sm bg-gray-200 rounded hover:bg-gray-300">Cancel</button>
                                    <button onClick={addCalculatedField} className="px-4 py-2 text-sm bg-green-600 text-white rounded hover:bg-green-700">Add</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Instructor Login Modal */}
                    {instructorLoginOpen && (
                        <div className="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center backdrop-blur-sm">
                            <div className="bg-white rounded-lg shadow-2xl p-6 w-80">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="font-bold text-gray-800">Instructor Access</h3>
                                    <button onClick={() => setInstructorLoginOpen(false)} className="text-gray-400 hover:text-gray-600"><Icons.X size={18}/></button>
                                </div>
                                <p className="text-xs text-gray-500 mb-4">Enter the instructor password to reveal answers in the scenario sidebar.</p>
                                <input 
                                    type="password" 
                                    className="w-full border p-2 rounded mb-4" 
                                    placeholder="Password" 
                                    value={instructorPassword}
                                    onChange={e => setInstructorPassword(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && submitInstructorLogin()}
                                />
                                <button onClick={submitInstructorLogin} className="w-full py-2 bg-[#107C41] text-white rounded font-bold hover:bg-green-800 transition-colors">Login</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ExcelSimulator />);
    </script>
</body>
</html>
