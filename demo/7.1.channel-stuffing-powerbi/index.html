<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Auditor's Lens - Fraud Detection Suite</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom scrollbar for dark theme consistency */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICONS (Replaced Lucide imports with inline SVG components) ---
        const IconBase = ({ children, className, ...props }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width="24" height="24" 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className} 
                {...props}
            >
                {children}
            </svg>
        );

        const Activity = (props) => <IconBase {...props}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></IconBase>;
        const TrendingUp = (props) => <IconBase {...props}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></IconBase>;
        const AlertTriangle = (props) => <IconBase {...props}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></IconBase>;
        const Search = (props) => <IconBase {...props}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></IconBase>;
        const BookOpen = (props) => <IconBase {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></IconBase>;
        const CheckCircle = (props) => <IconBase {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconBase>;
        const ArrowRight = (props) => <IconBase {...props}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></IconBase>;
        const PieChart = (props) => <IconBase {...props}><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></IconBase>;
        const ClipboardCheck = (props) => <IconBase {...props}><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></IconBase>;
        const XCircle = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></IconBase>;
        const HelpCircle = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></IconBase>;
        const Download = (props) => <IconBase {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></IconBase>;
        const Monitor = (props) => <IconBase {...props}><rect width="20" height="14" x="2" y="3" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></IconBase>;
        const Database = (props) => <IconBase {...props}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></IconBase>;


        // --- DATA CONSTANTS ---

        const CSV_HEADER = "Week,Revenue,Cash_Collected,Returns,Accounts_Receivable,Notes";
        const CSV_DATA_ROWS = [
          "1,5510,5235,110,10165,", "2,5539,5262,111,10331,", "3,5586,5307,112,10499,", "4,5648,5366,113,10668,", "5,5721,5435,114,10840,",
          "6,5800,5510,116,11014,", "7,5883,5589,118,11190,", "8,5965,5667,119,11369,", "9,6044,5742,121,11550,", "10,6115,5809,122,11734,",
          "11,6175,5866,124,11919,", "12,6221,5910,124,12106,", "13,6251,5938,125,12294,End Q1 Year 1", "14,6263,5950,125,12482,", "15,6257,5944,125,12670,",
          "16,6234,5922,125,12857,", "17,6195,5885,124,13043,", "18,6142,5835,123,13227,", "19,6078,5774,122,13409,", "20,6005,5705,120,13589,",
          "21,5927,5631,119,13767,", "22,5848,5556,117,13942,", "23,5772,5483,115,14115,", "24,5702,5417,114,14286,", "25,5642,5360,113,14455,",
          "26,5594,5314,112,14623,End Q2 Year 1", "27,5561,5283,111,14790,", "28,5545,5268,111,14956,", "29,5548,5271,111,15122,", "30,5569,5291,111,15289,",
          "31,5608,5328,112,15457,", "32,5662,5379,113,15627,", "33,5730,5444,115,15798,", "34,5808,5518,116,15972,", "35,5894,5599,118,16149,",
          "36,5983,5684,120,16328,", "37,6072,5768,121,16510,", "38,6157,5849,123,16695,", "39,6234,5922,125,16882,End Q3 Year 1", "40,6301,5986,126,17071,",
          "41,6355,6037,127,17262,", "42,6395,6075,128,17454,", "43,6421,6100,128,17647,", "44,6431,6109,129,17840,", "45,6427,6106,129,18032,",
          "46,6410,6090,128,18224,", "47,6383,6064,128,18415,", "48,6347,6030,127,18605,", "49,6306,5991,126,18794,", 
          "50,22173,3326,443,37198,**FRAUD BEGINS**", "51,22113,3317,442,55552,**MASSIVE SPIKE**", "52,22057,3309,441,73859,**YEAR END PUSH**", 
          "53,2542,2415,9120,64866,**VACUUM & RETURNS**", "54,2563,2435,8450,56544,**HIGH RETURNS**", "55,2589,2460,9800,46873,**HIGH RETURNS**", 
          "56,2621,2490,8200,38804,**HIGH RETURNS**", "57,2658,2525,53,38884,Demand Vacuum", "58,2699,2564,54,38965,", "59,2744,2607,55,39047,", "60,2792,2652,56,39131,",
          "61,7036,6684,141,39342,Normalizing", "62,7079,6725,142,39554,", "63,7116,6760,142,39768,", "64,7145,6788,143,39982,", "65,7166,6808,143,40197,"
        ];

        // Combine for download
        const FULL_CSV_CONTENT = [CSV_HEADER, ...CSV_DATA_ROWS].join('\n');


        // --- HELPER COMPONENTS ---

        const Tooltip = ({ x, y, data, visible, visibleSeries }) => {
          if (!visible || !data) return null;
          return (
            <div 
              style={{ left: x + 10, top: y - 10 }} 
              className="absolute z-50 bg-black/90 backdrop-blur-sm text-white text-xs p-3 rounded-lg shadow-2xl pointer-events-none border border-cyan-500/30"
            >
              <div className="font-bold mb-2 border-b border-gray-700 pb-1 text-cyan-400">Week {data.week}</div>
              {visibleSeries.revenue && <div className="text-cyan-300 mb-1">Rev: ${data.revenue.toLocaleString()}</div>}
              {visibleSeries.cash && <div className="text-lime-300 mb-1">Cash: ${data.cash.toLocaleString()}</div>}
              {visibleSeries.returns && <div className="text-fuchsia-300 mb-1">Ret: ${data.returns.toLocaleString()}</div>}
              {visibleSeries.ar && <div className="text-amber-300 border-t border-gray-700 mt-1 pt-1">AR: ${data.ar.toLocaleString()}</div>}
            </div>
          );
        };

        const AuditorChart = ({ data, highlight, visibleSeries }) => {
          const [hoverData, setHoverData] = useState(null);
          const [mousePos, setMousePos] = useState({ x: 0, y: 0 });

          const width = 800;
          const height = 300;
          const padding = 40;
          const graphWidth = width - padding * 2;
          const graphHeight = height - padding * 2;

          // Calculate Max for scaling based on visible data
          const maxVal = Math.max(
            ...data.map(d => Math.max(
              visibleSeries.revenue ? d.revenue : 0, 
              visibleSeries.cash ? d.cash : 0, 
              visibleSeries.ar ? d.ar : 0, 
              visibleSeries.returns ? d.returns * 5 : 0
            ))
          ) || 10000;

          const getX = (index) => padding + (index / (data.length - 1)) * graphWidth;
          const getY = (val) => height - padding - (val / maxVal) * graphHeight;

          // Generate Path Strings
          const makePath = (key) => {
            return data.map((d, i) => 
              `${i === 0 ? 'M' : 'L'} ${getX(i)},${getY(d[key])}`
            ).join(' ');
          };

          const handleMouseMove = (e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Find closest data point
            const index = Math.min(
              data.length - 1, 
              Math.max(0, Math.round(((x - padding) / graphWidth) * (data.length - 1)))
            );
            
            setHoverData(data[index]);
            setMousePos({ x, y });
          };

          return (
            <div className="relative w-full overflow-hidden bg-gray-900 rounded-lg shadow-inner border border-gray-800">
              <Tooltip x={mousePos.x} y={mousePos.y} data={hoverData} visible={!!hoverData} visibleSeries={visibleSeries} />
              
              <svg 
                viewBox={`0 0 ${width} ${height}`} 
                className="w-full h-auto cursor-crosshair"
                onMouseMove={handleMouseMove}
                onMouseLeave={() => setHoverData(null)}
              >
                {/* Grid Lines */}
                {[0, 0.25, 0.5, 0.75, 1].map(tick => (
                  <line 
                    key={tick} 
                    x1={padding} 
                    y1={height - padding - (tick * graphHeight)} 
                    x2={width - padding} 
                    y2={height - padding - (tick * graphHeight)} 
                    stroke="#374151" 
                    strokeWidth="1" 
                    strokeDasharray="4 4"
                  />
                ))}

                {/* Legend */}
                <g transform={`translate(${padding}, 10)`}>
                  {visibleSeries.revenue && (
                    <g>
                      <circle cx="0" cy="0" r="4" fill="#06b6d4" />
                      <text x="10" y="4" fontSize="10" fill="#a5f3fc" fontWeight="bold">Revenue</text>
                    </g>
                  )}
                  
                  {visibleSeries.cash && (
                    <g transform="translate(80, 0)">
                      <circle cx="0" cy="0" r="4" fill="#84cc16" />
                      <text x="10" y="4" fontSize="10" fill="#d9f99d" fontWeight="bold">Cash</text>
                    </g>
                  )}

                  {visibleSeries.ar && (
                    <g transform="translate(190, 0)">
                      <circle cx="0" cy="0" r="4" fill="#f59e0b" />
                      <text x="10" y="4" fontSize="10" fill="#fde68a" fontWeight="bold">AR</text>
                    </g>
                  )}

                  {visibleSeries.returns && (
                    <g transform="translate(320, 0)">
                      <circle cx="0" cy="0" r="4" fill="#d946ef" />
                      <text x="10" y="4" fontSize="10" fill="#f5d0fe" fontWeight="bold">Returns (5x)</text>
                    </g>
                  )}
                </g>

                {/* Highlight Regions */}
                {highlight === 'spike' && (
                  <rect x={getX(46)} y={padding} width={getX(54) - getX(46)} height={graphHeight} fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" strokeDasharray="4 2" />
                )}
                {highlight === 'drop' && (
                  <rect x={getX(52)} y={padding} width={getX(60) - getX(52)} height={graphHeight} fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" strokeDasharray="4 2" />
                )}
                {highlight === 'ar' && (
                   <rect x={getX(40)} y={padding} width={getX(60) - getX(40)} height={graphHeight} fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" strokeDasharray="4 2"/>
                )}
                {highlight === 'returns' && (
                   <rect x={getX(53)} y={padding} width={getX(60) - getX(53)} height={graphHeight} fill="rgba(217, 70, 239, 0.15)" stroke="#d946ef" strokeDasharray="4 2"/>
                )}

                {/* Data Lines */}
                {visibleSeries.ar && <path d={makePath('ar')} fill="none" stroke="#f59e0b" strokeWidth="2" strokeDasharray="4 4" opacity="0.8" />}
                {visibleSeries.cash && <path d={makePath('cash')} fill="none" stroke="#84cc16" strokeWidth="2" />}
                {visibleSeries.revenue && <path d={makePath('revenue')} fill="none" stroke="#06b6d4" strokeWidth="3" filter="drop-shadow(0 0 4px rgba(6,182,212,0.5))" />}
                {visibleSeries.returns && <path d={makePath('returns')} fill="none" stroke="#d946ef" strokeWidth="2" />}

                {/* Axes Labels */}
                <text x={width/2} y={height - 10} textAnchor="middle" fontSize="12" fill="#6b7280">Time (Weeks)</text>
                <text x={10} y={height/2} transform={`rotate(-90, 10, ${height/2})`} textAnchor="middle" fontSize="12" fill="#6b7280">Amount ($)</text>
              </svg>
            </div>
          );
        };

        // --- GAME LOGIC ---

        const GAME_STAGES = [
          {
            id: 0,
            title: "Client Engagement",
            desc: "You have been assigned to audit 'HyperGrowth Inc.'. Management claims they had a record-breaking Q4 due to 'market dominance'. Your job is to verify this.",
            task: "Review the initial Revenue Chart provided by the client.",
            actionButton: "Start Audit",
            visibleSeries: { revenue: true, cash: false, ar: false, returns: false },
            question: null,
          },
          {
            id: 1,
            title: "Procedure 1: Trend Analysis",
            desc: "The Q4 revenue looks incredibly high. However, looking at a single quarter can be misleading. We need to check the 'Cut-off' period.",
            task: "Extend the analysis to include Q1 of the following year.",
            actionButton: "Analyze Next Quarter Data",
            visibleSeries: { revenue: true, cash: false, ar: false, returns: false },
            highlight: 'drop',
            question: {
              text: "Look at the chart after Week 52. What happens to the revenue in the new year?",
              options: [
                { id: 'a', text: "It continues to grow steadily.", correct: false },
                { id: 'b', text: "It remains flat.", correct: false },
                { id: 'c', text: "It collapses significantly below normal levels.", correct: true }
              ],
              explanation: "Correct! The massive drop in Q1 suggests the company 'borrowed' sales from the future to stuff Q4. This is a classic 'Demand Vacuum'."
            }
          },
          {
            id: 2,
            title: "Procedure 2: Cash Realization",
            desc: "Revenue is an accrual concept. It doesn't mean cash is in the bank. If these sales are real, the company should be collecting cash.",
            task: "Overlay the Cash Collections and Accounts Receivable (AR) data.",
            actionButton: "Perform Cash Flow Reconciliation",
            visibleSeries: { revenue: true, cash: true, ar: true, returns: false },
            highlight: 'ar',
            question: {
              text: "Compare the Green Line (Cash) with the Blue Line (Revenue) during the Q4 spike.",
              options: [
                { id: 'a', text: "Cash collection increased perfectly with Revenue.", correct: false },
                { id: 'b', text: "Revenue spiked, but Cash remained flat and AR exploded.", correct: true },
                { id: 'c', text: "AR decreased significantly.", correct: false }
              ],
              explanation: "Correct! 'Revenue without Cash' is the #1 red flag. The skyrocketing AR (Orange dotted line) means they shipped goods but haven't been paid."
            }
          },
          {
            id: 3,
            title: "Procedure 3: Returns & Rights",
            desc: "Why haven't they been paid? Maybe the distributors can't sell the product. Let's check if products are coming back.",
            task: "Examine the Sales Return Ledger for the subsequent period.",
            actionButton: "Inspect Returns Log",
            visibleSeries: { revenue: true, cash: true, ar: true, returns: true },
            highlight: 'returns',
            question: {
              text: "What does the Pink Line (Returns) indicate in weeks 53-56?",
              options: [
                { id: 'a', text: "Returns are at normal historical levels (2%).", correct: false },
                { id: 'b', text: "There is a massive surge in returns immediately after year-end.", correct: true },
                { id: 'c', text: "No returns were recorded.", correct: false }
              ],
              explanation: "Correct! Distributors are sending the unsold 'stuffed' inventory back. The company likely had a secret 'side agreement' allowing full returns."
            }
          },
          {
            id: 4,
            title: "Final Audit Opinion",
            desc: "You have gathered all the evidence. It's time to issue your conclusion to the Audit Partner.",
            task: "Select the specific type of fraud occurring here.",
            actionButton: "Submit Final Report",
            visibleSeries: { revenue: true, cash: true, ar: true, returns: true },
            question: {
              text: "Based on the Q1 drop, AR ballooning, and subsequent returns, what is the primary scheme?",
              options: [
                { id: 'a', text: "Lapping (Theft of Cash)", correct: false },
                { id: 'b', text: "Channel Stuffing (Revenue Timing Fraud)", correct: true },
                { id: 'c', text: "Expense Understatement", correct: false }
              ],
              explanation: "Excellent work. You identified Channel Stuffing. The company inflated earnings by forcing inventory into the channel, only to have it returned later."
            }
          }
        ];

        // --- MAIN APP ---

        const App = () => {
          const [activeTab, setActiveTab] = useState('learn'); // learn, simulate, data, powerbi
          const [score, setScore] = useState(0);
          const [currentStage, setCurrentStage] = useState(0);
          const [data, setData] = useState([]);
          const [showExplanation, setShowExplanation] = useState(false);
          const [selectedOption, setSelectedOption] = useState(null);
          const [isStageComplete, setIsStageComplete] = useState(false);

          // Load Data
          useEffect(() => {
            // Parsing the static CSV string into objects for the game
            const parsedData = CSV_DATA_ROWS.map(row => {
              const cols = row.split(',');
              return {
                week: parseInt(cols[0]),
                revenue: parseInt(cols[1]),
                cash: parseInt(cols[2]),
                returns: parseInt(cols[3]),
                ar: parseInt(cols[4])
              };
            });
            setData(parsedData);
          }, []);

          // --- HANDLERS ---
          const handleOptionSelect = (optionId) => {
            if (isStageComplete) return;
            setSelectedOption(optionId);
            
            const stage = GAME_STAGES[currentStage];
            const isCorrect = stage.question.options.find(o => o.id === optionId).correct;
            
            if (isCorrect) setScore(s => s + 100);
            else setScore(s => Math.max(0, s - 25));
            
            setIsStageComplete(true);
            setShowExplanation(true);
          };

          const nextStage = () => {
            setCurrentStage(prev => prev + 1);
            setSelectedOption(null);
            setShowExplanation(false);
            setIsStageComplete(false);
          };

          const resetGame = () => {
            setCurrentStage(0);
            setScore(0);
            setSelectedOption(null);
            setShowExplanation(false);
            setIsStageComplete(false);
          };

          const downloadCSV = () => {
            const blob = new Blob([FULL_CSV_CONTENT], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'channel_stuffing_audit_data.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          };

          return (
            <div className="min-h-screen bg-gray-950 text-gray-100 font-sans pb-12 selection:bg-cyan-500 selection:text-black">
              
              {/* HEADER */}
              <header className="bg-gray-900 text-white p-6 shadow-xl sticky top-0 z-40 border-b border-gray-800">
                <div className="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center">
                  <div className="flex items-center space-x-3 mb-4 md:mb-0">
                    <div className="bg-cyan-600 p-2 rounded-lg shadow-lg shadow-cyan-500/20">
                      <Activity className="w-6 h-6 text-white" />
                    </div>
                    <div>
                      <h1 className="text-2xl font-bold tracking-tight text-white">The Auditor's Lens</h1>
                      <p className="text-cyan-400 text-sm font-medium">Interactive Fraud Detection Suite</p>
                    </div>
                  </div>
                  
                  <div className="flex items-center space-x-6">
                    {activeTab === 'simulate' && (
                      <div className="flex flex-col items-end">
                        <span className="text-xs text-gray-400 uppercase tracking-wider">Score</span>
                        <span className={`text-2xl font-bold font-mono ${score > 0 ? 'text-green-400' : 'text-gray-600'}`}>
                          {score} pts
                        </span>
                      </div>
                    )}
                    
                    <nav className="flex space-x-1 bg-gray-800 p-1 rounded-lg border border-gray-700">
                      {[
                        { id: 'learn', label: 'Concept', icon: BookOpen },
                        { id: 'simulate', label: 'Case Study', icon: Search },
                        { id: 'data', label: 'Data Center', icon: Database },
                        { id: 'powerbi', label: 'Power BI Lab', icon: Monitor }
                      ].map((tab) => (
                        <button
                          key={tab.id}
                          onClick={() => setActiveTab(tab.id)}
                          className={`px-3 py-2 rounded-md text-sm font-bold transition-all flex items-center ${
                            activeTab === tab.id 
                              ? 'bg-gradient-to-r from-cyan-600 to-blue-600 text-white shadow-lg' 
                              : 'text-gray-400 hover:text-white hover:bg-gray-700'
                          }`}
                        >
                          <tab.icon className="w-4 h-4 mr-2" />
                          {tab.label}
                        </button>
                      ))}
                    </nav>
                  </div>
                </div>
              </header>

              <main className="max-w-6xl mx-auto p-6">
                
                {/* --- TAB: CONCEPT --- */}
                {activeTab === 'learn' && (
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-8 animate-in fade-in duration-500">
                    <div className="md:col-span-2 space-y-8">
                      <section className="bg-gray-900 p-8 rounded-xl shadow-lg border border-gray-800 relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-32 h-32 bg-cyan-500/10 rounded-full blur-3xl -mr-16 -mt-16"></div>
                        <div className="flex items-center space-x-3 mb-4 relative z-10">
                          <BookOpen className="w-6 h-6 text-cyan-500" />
                          <h2 className="text-2xl font-bold text-white">What is Channel Stuffing?</h2>
                        </div>
                        <p className="text-lg leading-relaxed text-gray-300 mb-6 relative z-10">
                          Channel stuffing happens when a company pushes more product to distributors or retailers than they can actually sell, usually right before quarter- or year-end, to inflate reported revenue.
                        </p>
                        <div className="bg-amber-900/20 border-l-4 border-amber-500 p-4 rounded-r-lg relative z-10">
                          <h3 className="font-bold text-amber-400 mb-1">Key Idea for Students</h3>
                          <p className="text-amber-200/80">It looks like a sale on paper, but demand hasn't increased. It is <span className="font-bold text-amber-100">revenue timing manipulation</span>, not real performance.</p>
                        </div>
                      </section>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <section className="bg-gray-900 p-6 rounded-xl shadow-lg border border-gray-800">
                          <h3 className="font-bold text-lg mb-4 flex items-center text-white">
                            <TrendingUp className="w-5 h-5 mr-2 text-green-500" />
                            Why Companies Do It
                          </h3>
                          <ul className="space-y-3">
                            {['Hit earnings targets/expectations', 'Trigger bonuses/stock comp', 'Avoid covenant violations', 'Smooth declining demand'].map((item, i) => (
                              <li key={i} className="flex items-start text-gray-400 text-sm">
                                <span className="w-1.5 h-1.5 bg-gray-600 rounded-full mt-2 mr-2 flex-shrink-0"></span>
                                {item}
                              </li>
                            ))}
                          </ul>
                        </section>

                        <section className="bg-gray-900 p-6 rounded-xl shadow-lg border border-gray-800">
                          <h3 className="font-bold text-lg mb-4 flex items-center text-white">
                            <AlertTriangle className="w-5 h-5 mr-2 text-rose-500" />
                            Why It's Risky
                          </h3>
                          <ul className="space-y-3">
                            {['Risks & rewards haven\'t transferred', 'Collection is uncertain', 'Hidden side agreements exist', 'Violates accrual accounting'].map((item, i) => (
                              <li key={i} className="flex items-start text-gray-400 text-sm">
                                <span className="w-1.5 h-1.5 bg-gray-600 rounded-full mt-2 mr-2 flex-shrink-0"></span>
                                {item}
                              </li>
                            ))}
                          </ul>
                        </section>
                      </div>
                    </div>

                    <div className="space-y-6">
                      <div className="bg-gray-900 p-6 rounded-xl border border-gray-800 shadow-lg">
                        <h3 className="font-bold text-cyan-400 mb-4 uppercase tracking-wider text-xs">Red Flags Checklist</h3>
                        <div className="space-y-4">
                          {[
                            { title: "Sales Spike", desc: "Unusual surge at period-end" },
                            { title: "AR Growth", desc: "Receivables growing faster than sales" },
                            { title: "Returns Spike", desc: "High returns in subsequent period" },
                            { title: "Inventory Buildup", desc: "Distributors holding excess stock" },
                            { title: "Unusual Terms", desc: "Extended payment terms or side letters" }
                          ].map((flag, i) => (
                            <div key={i} className="flex items-start group">
                              <div className="bg-gray-800 group-hover:bg-cyan-900 transition-colors p-1.5 rounded shadow-sm mr-3 text-cyan-500 font-bold text-xs">{i + 1}</div>
                              <div>
                                <div className="font-semibold text-gray-200 text-sm group-hover:text-cyan-400 transition-colors">{flag.title}</div>
                                <div className="text-gray-500 text-xs">{flag.desc}</div>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                      
                      <button 
                        onClick={() => {
                          setActiveTab('simulate');
                          resetGame();
                        }}
                        className="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white p-4 rounded-xl shadow-lg shadow-cyan-900/20 transition-all flex items-center justify-center font-bold"
                      >
                        Start Case Study <ArrowRight className="ml-2 w-5 h-5" />
                      </button>
                    </div>
                  </div>
                )}

                {/* --- TAB: SIMULATE (GAME) --- */}
                {activeTab === 'simulate' && (
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 animate-in slide-in-from-right duration-500">
                    
                    {/* INSTRUCTIONS */}
                    <div className="lg:col-span-4 space-y-6">
                      <div className="flex space-x-1 mb-2 bg-gray-900 p-1 rounded-full">
                        {GAME_STAGES.map((stage, idx) => (
                          <div 
                            key={idx} 
                            className={`h-2 flex-1 rounded-full transition-all duration-500 ${
                              idx < currentStage ? 'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]' : 
                              idx === currentStage ? 'bg-cyan-500 shadow-[0_0_8px_rgba(6,182,212,0.6)]' : 'bg-gray-700'
                            }`} 
                          />
                        ))}
                      </div>

                      <div className="bg-gray-900 p-6 rounded-xl shadow-xl border border-gray-800 relative">
                        <div className="absolute inset-0 bg-gradient-to-b from-cyan-500/5 to-transparent rounded-xl pointer-events-none"></div>
                        <div className="flex items-center justify-between mb-4 relative z-10">
                          <h2 className="text-lg font-bold text-white">{GAME_STAGES[currentStage].title}</h2>
                          <span className="bg-gray-800 text-cyan-400 text-xs font-bold px-2 py-1 rounded border border-gray-700">
                            Step {currentStage + 1} of 5
                          </span>
                        </div>
                        
                        <p className="text-gray-400 text-sm mb-6 leading-relaxed relative z-10">
                          {GAME_STAGES[currentStage].desc}
                        </p>

                        <div className="bg-cyan-900/20 border-l-4 border-cyan-500 p-4 rounded-r-lg mb-6 relative z-10">
                          <h4 className="text-xs font-bold text-cyan-300 uppercase tracking-wide mb-1">Current Task</h4>
                          <p className="text-cyan-100/90 text-sm font-medium">{GAME_STAGES[currentStage].task}</p>
                        </div>

                        {currentStage === 0 ? (
                          <button 
                            onClick={nextStage}
                            className="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg font-bold shadow-lg transition-all flex justify-center items-center relative z-10"
                          >
                            {GAME_STAGES[currentStage].actionButton} <ArrowRight className="ml-2 w-4 h-4" />
                          </button>
                        ) : (
                          <div className="space-y-3 relative z-10">
                            <div className="flex items-center text-white font-bold text-sm mb-2">
                              <HelpCircle className="w-4 h-4 mr-2 text-cyan-400" />
                              Analysis Question:
                            </div>
                            <p className="text-sm text-gray-300 italic mb-2">"{GAME_STAGES[currentStage].question.text}"</p>
                            
                            <div className="space-y-2">
                              {GAME_STAGES[currentStage].question.options.map((opt) => (
                                <button
                                  key={opt.id}
                                  onClick={() => handleOptionSelect(opt.id)}
                                  disabled={isStageComplete}
                                  className={`w-full p-3 text-left text-sm rounded-lg border transition-all ${
                                    isStageComplete && opt.correct 
                                      ? 'border-green-500 bg-green-900/20 text-green-300'
                                      : isStageComplete && selectedOption === opt.id && !opt.correct
                                      ? 'border-rose-500 bg-rose-900/20 text-rose-300'
                                      : selectedOption === opt.id
                                      ? 'border-cyan-500 bg-cyan-900/20 text-white'
                                      : 'border-gray-700 bg-gray-800 text-gray-400 hover:border-cyan-500 hover:text-white'
                                  }`}
                                >
                                  <div className="flex items-center">
                                    {isStageComplete && opt.correct && <CheckCircle className="w-4 h-4 mr-2 text-green-500 flex-shrink-0" />}
                                    {isStageComplete && selectedOption === opt.id && !opt.correct && <XCircle className="w-4 h-4 mr-2 text-rose-500 flex-shrink-0" />}
                                    {opt.text}
                                  </div>
                                </button>
                              ))}
                            </div>

                            {showExplanation && (
                              <div className="mt-4 animate-in fade-in slide-in-from-top-2">
                                <div className={`p-4 rounded-lg mb-4 text-sm border ${
                                  selectedOption && GAME_STAGES[currentStage].question.options.find(o => o.id === selectedOption).correct
                                  ? 'bg-green-900/20 border-green-800 text-green-200' 
                                  : 'bg-gray-800 border-gray-700 text-gray-300'
                                }`}>
                                  <div className="font-bold mb-1 flex items-center">
                                    <ClipboardCheck className="w-4 h-4 mr-2" /> Senior Auditor's Note:
                                  </div>
                                  {GAME_STAGES[currentStage].question.explanation}
                                </div>
                                
                                {currentStage < GAME_STAGES.length - 1 ? (
                                  <button 
                                    onClick={nextStage}
                                    className="w-full py-3 bg-gray-700 hover:bg-gray-600 text-white rounded-lg font-bold shadow-lg transition-all border border-gray-600"
                                  >
                                    Proceed to Next Procedure
                                  </button>
                                ) : (
                                  <button 
                                    onClick={resetGame}
                                    className="w-full py-3 bg-green-600 hover:bg-green-500 text-white rounded-lg font-bold shadow-lg transition-all"
                                  >
                                    Audit Complete! Restart?
                                  </button>
                                )}
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    </div>

                    {/* DASHBOARD */}
                    <div className="lg:col-span-8 space-y-6">
                      <div className="bg-gray-900 p-5 rounded-xl shadow-xl border border-gray-800 h-full flex flex-col relative">
                        <div className="flex justify-between items-center mb-6">
                          <h2 className="font-bold text-white flex items-center">
                            <PieChart className="w-5 h-5 mr-2 text-gray-500" />
                            Financial Data Visualization
                          </h2>
                          <div className="flex space-x-4 text-xs">
                            <div className={`flex items-center transition-opacity ${GAME_STAGES[currentStage].visibleSeries.revenue ? 'opacity-100' : 'opacity-30'}`}>
                              <div className="w-3 h-3 rounded-full bg-cyan-500 mr-1 shadow-[0_0_5px_#06b6d4]"></div> <span className="text-gray-300">Revenue</span>
                            </div>
                            <div className={`flex items-center transition-opacity ${GAME_STAGES[currentStage].visibleSeries.cash ? 'opacity-100' : 'opacity-30'}`}>
                              <div className="w-3 h-3 rounded-full bg-lime-500 mr-1 shadow-[0_0_5px_#84cc16]"></div> <span className="text-gray-300">Cash</span>
                            </div>
                            <div className={`flex items-center transition-opacity ${GAME_STAGES[currentStage].visibleSeries.ar ? 'opacity-100' : 'opacity-30'}`}>
                              <div className="w-3 h-3 rounded-full bg-amber-500 mr-1 shadow-[0_0_5px_#f59e0b]"></div> <span className="text-gray-300">AR</span>
                            </div>
                            <div className={`flex items-center transition-opacity ${GAME_STAGES[currentStage].visibleSeries.returns ? 'opacity-100' : 'opacity-30'}`}>
                              <div className="w-3 h-3 rounded-full bg-fuchsia-500 mr-1 shadow-[0_0_5px_#d946ef]"></div> <span className="text-gray-300">Returns</span>
                            </div>
                          </div>
                        </div>

                        <div className="flex-grow flex items-center justify-center bg-gray-950 rounded-lg border border-gray-800 p-2 shadow-inner">
                          <AuditorChart 
                            data={data} 
                            highlight={GAME_STAGES[currentStage].highlight} 
                            visibleSeries={GAME_STAGES[currentStage].visibleSeries}
                          />
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* --- TAB: DATA CENTER --- */}
                {activeTab === 'data' && (
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-8 animate-in fade-in">
                    <div className="md:col-span-1 space-y-6">
                      <div className="bg-gray-900 p-6 rounded-xl border border-gray-800 shadow-lg">
                        <div className="flex items-center mb-4">
                          <Database className="w-6 h-6 text-lime-400 mr-3" />
                          <h2 className="text-xl font-bold text-white">Practice Data</h2>
                        </div>
                        <p className="text-gray-400 text-sm mb-6">
                          This dataset contains 104 weeks (2 years) of financial records used in the Case Study. 
                          Download it to practice your own analysis in Excel, Power BI, or Tableau.
                        </p>
                        <button 
                          onClick={downloadCSV}
                          className="w-full bg-lime-600 hover:bg-lime-500 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center transition-all shadow-lg shadow-lime-900/20"
                        >
                          <Download className="w-5 h-5 mr-2" />
                          Download CSV File
                        </button>
                      </div>
                      
                      <div className="bg-gray-900 p-6 rounded-xl border border-gray-800">
                        <h3 className="text-sm font-bold text-gray-300 mb-3">Dataset Specs</h3>
                        <ul className="space-y-2 text-xs text-gray-500">
                          <li className="flex justify-between"><span>Format:</span> <span className="text-gray-300">CSV (Comma Separated)</span></li>
                          <li className="flex justify-between"><span>Rows:</span> <span className="text-gray-300">104 Weeks</span></li>
                          <li className="flex justify-between"><span>Columns:</span> <span className="text-gray-300">Revenue, Cash, Returns, AR</span></li>
                          <li className="flex justify-between"><span>Scenario:</span> <span className="text-gray-300">Year-End Channel Stuffing</span></li>
                        </ul>
                      </div>
                    </div>

                    <div className="md:col-span-2">
                      <div className="bg-gray-900 rounded-xl border border-gray-800 overflow-hidden shadow-lg">
                        <div className="p-4 border-b border-gray-800 bg-gray-950 flex justify-between items-center">
                            <h3 className="font-mono text-sm text-cyan-400">Preview: channel_stuffing_audit_data.csv</h3>
                            <span className="text-xs text-gray-500">Showing first 10 & fraud weeks</span>
                        </div>
                        <div className="overflow-x-auto">
                          <table className="w-full text-xs text-left">
                            <thead className="bg-gray-800 text-gray-400 uppercase font-mono">
                              <tr>
                                <th className="p-3">Week</th>
                                <th className="p-3">Revenue</th>
                                <th className="p-3">Cash</th>
                                <th className="p-3">Returns</th>
                                <th className="p-3">AR</th>
                                <th className="p-3">Notes</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-800 font-mono text-gray-300">
                              {/* First 5 rows */}
                              {[0, 1, 2, 3, 4].map(i => {
                                const cols = CSV_DATA_ROWS[i].split(',');
                                return (
                                  <tr key={i} className="hover:bg-gray-800/50">
                                    {cols.map((c, idx) => <td key={idx} className="p-3">{c}</td>)}
                                  </tr>
                                );
                              })}
                              <tr><td colSpan="6" className="p-3 text-center text-gray-600 bg-gray-950">... (Skipping to Fraud Event) ...</td></tr>
                              {/* Fraud rows */}
                              {[49, 50, 51, 52, 53, 54].map(i => {
                                const cols = CSV_DATA_ROWS[i].split(',');
                                return (
                                  <tr key={i} className="bg-rose-900/10 hover:bg-rose-900/20">
                                    {cols.map((c, idx) => <td key={idx} className={`p-3 ${idx===5 ? 'text-rose-400 font-bold':''}`}>{c}</td>)}
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* --- TAB: POWER BI GUIDE --- */}
                {activeTab === 'powerbi' && (
                  <div className="max-w-4xl mx-auto animate-in fade-in">
                    <div className="bg-gray-900 border border-gray-800 rounded-xl p-8 shadow-xl mb-8">
                      <div className="flex items-center mb-6">
                        <Monitor className="w-8 h-8 text-amber-400 mr-4" />
                        <div>
                          <h2 className="text-2xl font-bold text-white">Power BI Lab Guide</h2>
                          <p className="text-gray-400">Follow these steps to recreate the specific fraud detection visualizations.</p>
                        </div>
                      </div>

                      <div className="space-y-8">
                        
                        {/* Step 1 */}
                        <div className="flex">
                          <div className="flex-shrink-0 mr-4">
                            <div className="w-8 h-8 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center font-bold text-cyan-400">1</div>
                          </div>
                          <div className="flex-grow">
                            <h3 className="text-lg font-bold text-white mb-2">Get Data</h3>
                            <p className="text-gray-400 text-sm mb-2">Import the CSV file you downloaded from the Data Center.</p>
                            <div className="bg-black/50 p-3 rounded border border-gray-800 text-sm font-mono text-gray-300">
                                Home &gt; Get Data &gt; Text/CSV &gt; Select "channel_stuffing_audit_data.csv"
                            </div>
                          </div>
                        </div>

                        {/* Step 2 */}
                        <div className="flex">
                          <div className="flex-shrink-0 mr-4">
                            <div className="w-8 h-8 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center font-bold text-cyan-400">2</div>
                          </div>
                          <div className="flex-grow">
                            <h3 className="text-lg font-bold text-white mb-2">Visualize the "Sales Spike"</h3>
                            <p className="text-gray-400 text-sm mb-2">Create a line chart to spot the Week 50-52 anomaly.</p>
                            <ul className="list-disc list-inside text-sm text-gray-400 space-y-1 ml-2">
                                <li>Select <strong>Line Chart</strong> visual.</li>
                                <li>Drag <strong>Week</strong> to X-Axis.</li>
                                <li>Drag <strong>Revenue</strong> to Y-Axis.</li>
                                <li>Format visual: Change line color to <span className="text-cyan-400">Cyan</span>.</li>
                            </ul>
                          </div>
                        </div>

                        {/* Step 3 */}
                        <div className="flex">
                          <div className="flex-shrink-0 mr-4">
                            <div className="w-8 h-8 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center font-bold text-cyan-400">3</div>
                          </div>
                          <div className="flex-grow">
                            <h3 className="text-lg font-bold text-white mb-2">The "Cash Gap" Analysis (DAX)</h3>
                            <p className="text-gray-400 text-sm mb-2">We need to see if cash follows revenue. Create a DAX measure:</p>
                            <div className="bg-gray-950 p-4 rounded border border-gray-700 text-sm font-mono text-green-400 mb-3 overflow-x-auto">
                                Cash Collection % = DIVIDE(SUM(Data[Cash_Collected]), SUM(Data[Revenue]))
                            </div>
                            <p className="text-gray-400 text-sm mb-2">Then, use a <strong>Line and Clustered Column Chart</strong>:</p>
                            <ul className="list-disc list-inside text-sm text-gray-400 space-y-1 ml-2">
                                <li><strong>Column Y-Axis:</strong> Revenue</li>
                                <li><strong>Line Y-Axis:</strong> Accounts_Receivable (or your new measure)</li>
                                <li>Observe the divergence at Week 52.</li>
                            </ul>
                          </div>
                        </div>

                        {/* Step 4 */}
                        <div className="flex">
                          <div className="flex-shrink-0 mr-4">
                            <div className="w-8 h-8 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center font-bold text-cyan-400">4</div>
                          </div>
                          <div className="flex-grow">
                            <h3 className="text-lg font-bold text-white mb-2">The "Returns" Validation</h3>
                            <p className="text-gray-400 text-sm mb-2">Confirm the goods came back in Q1.</p>
                            <ul className="list-disc list-inside text-sm text-gray-400 space-y-1 ml-2">
                                <li>Create an <strong>Area Chart</strong>.</li>
                                <li><strong>X-Axis:</strong> Week.</li>
                                <li><strong>Y-Axis:</strong> Returns.</li>
                                <li><strong>Filter:</strong> Filter 'Week' to show is greater than 45 and less than 65.</li>
                                <li>Format: Change color to <span className="text-fuchsia-400">Magenta</span>.</li>
                            </ul>
                          </div>
                        </div>

                      </div>
                    </div>
                  </div>
                )}

              </main>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
