<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power BI Lab: The Master of Coin's Audit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --got-dark: #080a0e;
            --got-gold: #c5a059;
            --got-red: #6b1d1f;
            --got-steel: #4a5568;
            --parchment: #fdf6e3;
            --sidebar-width: 340px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000; 
            overflow: hidden; 
            margin: 0;
            padding: 0;
            position: relative;
        }

        /* Animated Dynamic Background Layers */
        .dynamic-bg-layer {
            position: fixed;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            z-index: 1; 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            animation: cinematicPan 40s infinite alternate ease-in-out;
            filter: brightness(0.6) contrast(1.1) sepia(0.3) hue-rotate(-5deg);
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            pointer-events: none;
        }

        .dynamic-bg-layer.active {
            opacity: 1;
        }

        @keyframes cinematicPan {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.05) translate(-1.5%, -1.5%); }
        }

        h1, h2, h3, h4, h5, .medieval-font {
            font-family: 'Cinzel Decorative', 'Cinzel', serif;
        }

        .standard-cinzel {
            font-family: 'Cinzel', serif;
        }

        /* Layout */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
            z-index: 10; 
        }

        .sidebar {
            width: var(--sidebar-width);
            background-color: rgba(8, 10, 14, 0.75); 
            backdrop-filter: blur(8px);
            color: #e5e7eb;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 0.3s ease;
            z-index: 40;
            border-right: 1px solid rgba(197, 160, 89, 0.3);
            box-shadow: 5px 0 25px rgba(0,0,0,0.9);
        }

        .resizer {
            width: 6px;
            background-color: transparent;
            cursor: col-resize;
            flex-shrink: 0;
            transition: background-color 0.2s;
            z-index: 30;
            border-left: 1px solid rgba(197, 160, 89, 0.1);
            border-right: 1px solid rgba(197, 160, 89, 0.1);
        }

        .resizer:hover, .resizer:active {
            background-color: var(--got-gold);
        }

        .main-content {
            flex-grow: 1;
            background-color: rgba(245, 240, 230, 0.85); 
            backdrop-filter: blur(6px); 
            display: flex;
            flex-direction: column;
            position: relative;
            height: 100vh;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.6);
        }

        /* Sidebar Nav */
        .nav-item {
            padding: 0.85rem 1.25rem;
            cursor: pointer;
            border-left: 4px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #9ca3af;
        }

        .nav-item:hover {
            background-color: rgba(197, 160, 89, 0.15);
            color: white;
        }

        .nav-item.active {
            background-color: rgba(197, 160, 89, 0.3);
            border-left-color: var(--got-gold);
            color: var(--got-gold);
            font-weight: 700;
            text-shadow: 0 0 10px rgba(197, 160, 89, 0.6);
        }

        .nav-icon {
            width: 24px;
            text-align: center;
        }

        /* Content Styling */
        .step-container {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .step-container.active {
            display: block;
        }

        .objective-box {
            background-color: var(--parchment);
            border: 2px solid #d4c4a8;
            border-radius: 4px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 4px 4px 15px rgba(0,0,0,0.15), inset 0 0 30px rgba(197, 160, 89, 0.05);
            position: relative;
        }
        
        .objective-box::before {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 1px solid rgba(107, 29, 31, 0.25);
            pointer-events: none;
        }

        .task-box {
            background-color: #ffffff;
            border-left: 4px solid var(--got-steel);
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 0 0.5rem 0.5rem 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        /* Dragon Animation */
        .dragon-container {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: center;
        }

        @keyframes dragonFlyHover {
            0% { transform: translate(var(--startX), var(--startY)) scale(0.5); opacity: 0; animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
            15% { transform: translate(var(--midX), var(--midY)) scale(var(--targetScale)); opacity: 1; }
            85% { transform: translate(var(--midX), var(--midY)) scale(var(--targetScale)); opacity: 1; animation-timing-function: cubic-bezier(0.36, 0, 0.66, -0.56); }
            100% { transform: translate(var(--endX), var(--endY)) scale(0.5); opacity: 0; }
        }
        
        @keyframes dragonFlyPass {
            0% { transform: translate(var(--startX), var(--startY)) scale(var(--targetScale)); opacity: 0; animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
            20% { opacity: 1; }
            50% { transform: translate(var(--midX), var(--midY)) scale(calc(var(--targetScale) + 0.3)); opacity: 1; animation-timing-function: cubic-bezier(0.32, 0, 0.67, 0); }
            80% { opacity: 1; }
            100% { transform: translate(var(--endX), var(--endY)) scale(var(--targetScale)); opacity: 0; }
        }

        .dragon-wrapper {
            position: relative;
            color: var(--got-dark);
            filter: drop-shadow(0 15px 20px rgba(0,0,0,0.7));
            animation: glideBob 1.5s ease-in-out infinite alternate;
        }

        @keyframes glideBob {
            0% { transform: scaleX(var(--flip)) translateY(-15px) rotate(calc(-3deg * var(--flip))); }
            100% { transform: scaleX(var(--flip)) translateY(15px) rotate(calc(3deg * var(--flip))); }
        }

        .dragon-rider {
            position: absolute;
            top: -25px;
            left: 35px;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            color: var(--got-gold);
        }
        
        .dragon-icon {
            font-size: 6rem;
        }

        .dragon-fire {
            position: absolute;
            top: 35px; 
            left: 80px; 
            color: #ff4500;
            font-size: 4rem;
            transform-origin: left center;
            opacity: 0;
            filter: drop-shadow(0 0 20px #ff0000);
            z-index: -1;
        }

        @keyframes breathFire {
            0% { opacity: 0; transform: rotate(15deg) scale(0.2) translateX(0); }
            30% { opacity: 1; transform: rotate(15deg) scale(1.5) translateX(20px); }
            80% { opacity: 1; transform: rotate(15deg) scale(2.5) translateX(40px); }
            100% { opacity: 0; transform: rotate(15deg) scale(0) translateX(60px); }
        }

        .dragon-quote {
            background: var(--parchment);
            border: 2px solid var(--got-gold);
            padding: 1rem 1.25rem;
            border-radius: 8px;
            font-family: 'Cinzel Decorative', serif;
            font-size: 0.95rem;
            font-weight: 900;
            color: var(--got-red);
            margin-top: 15px;
            text-align: center;
            opacity: 0;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            position: relative;
            line-height: 1.4;
            width: 320px;
        }
        
        .dragon-quote::after {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 10px 10px 10px;
            border-style: solid;
            border-color: transparent transparent var(--got-gold) transparent;
        }
        
        @keyframes showQuote {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Crown Animation */
        .crown-container {
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            color: var(--got-gold);
            font-size: 10rem;
            filter: drop-shadow(0 0 30px rgba(197, 160, 89, 0.8));
            animation: dropCrown 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            pointer-events: none;
            text-align: center;
        }
        
        .crown-text {
            font-family: 'Cinzel Decorative', serif;
            font-size: 2.5rem;
            color: white;
            margin-top: 1rem;
            text-shadow: 0 4px 8px rgba(0,0,0,0.9);
            opacity: 0;
            animation: fadeInText 1s 1.5s forwards;
        }

        @keyframes dropCrown {
            0% { top: -200px; transform: translateX(-50%) scale(0.5) rotate(-20deg); opacity: 0; }
            40% { top: 35%; transform: translateX(-50%) scale(1.2) rotate(10deg); opacity: 1; }
            60% { top: 35%; transform: translateX(-50%) scale(0.9) rotate(-5deg); }
            100% { top: 35%; transform: translateX(-50%) scale(1) rotate(0deg); opacity: 1; filter: drop-shadow(0 0 80px rgba(197, 160, 89, 1)); }
        }
        
        @keyframes fadeInText {
            to { opacity: 1; }
        }

        /* Mobile specific */
        .mobile-header {
            display: none;
            background-color: rgba(12, 14, 20, 0.95);
            color: var(--got-gold);
            padding: 1rem;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--got-gold);
        }

        .mobile-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 35;
        }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .mobile-header { display: flex; }
            .sidebar {
                position: fixed; top: 0; left: 0;
                height: 100%; width: 85%; max-width: 320px;
                transform: translateX(-100%);
            }
            .sidebar.mobile-open { transform: translateX(0); }
            .mobile-overlay.mobile-open { display: block; }
            .resizer { display: none; }
            .main-content { height: calc(100vh - 64px); }
            #bottom-nav-bar { position: sticky; bottom: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #e5e0d8; border-left: 1px solid #d4c4a8; }
        ::-webkit-scrollbar-thumb { background: var(--got-gold); }
        ::-webkit-scrollbar-thumb:hover { background: var(--got-red); }
    </style>
</head>
<body>

<!-- The Animated Cinematic Background Layers for smooth crossfade -->
<div id="bg-layer-1" class="dynamic-bg-layer active"></div>
<div id="bg-layer-2" class="dynamic-bg-layer"></div>

<div class="app-container">
    
    <!-- Mobile Header -->
    <div class="mobile-header">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-dragon text-2xl"></i>
            <h1 class="font-bold text-xl medieval-font tracking-wider">Master of Coin</h1>
        </div>
        <button id="mobileMenuBtn" class="p-2 focus:outline-none hover:text-white transition">
            <i class="fa-solid fa-bars text-xl"></i>
        </button>
    </div>

    <!-- Mobile Overlay -->
    <div id="mobileOverlay" class="mobile-overlay"></div>

    <!-- Sidebar Navigation -->
    <div class="sidebar" id="sidebar">
        <div class="p-8 border-b border-gray-800 hidden md:block text-center relative overflow-hidden">
            <i class="fa-solid fa-shield-halved absolute text-8xl text-gray-800 opacity-20 top-4 left-1/2 transform -translate-x-1/2 -z-10"></i>
            <div class="flex flex-col items-center gap-3 text-white mb-2 z-10">
                <i class="fa-solid fa-dragon text-[var(--got-gold)] text-5xl drop-shadow-md"></i>
                <h1 class="text-2xl font-bold tracking-widest text-[var(--got-gold)] uppercase medieval-font">Master of Coin</h1>
            </div>
            <p class="text-xs text-gray-400 font-semibold uppercase tracking-widest mt-3 border-t border-gray-700 pt-3 standard-cinzel">The Iron Bank Audit</p>
        </div>
        
        <div class="p-4 border-b border-gray-700 md:hidden flex justify-between items-center bg-gray-900">
            <span class="font-bold text-[#c5a059] medieval-font tracking-widest">REALM MAP</span>
            <button id="closeMenuBtn" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-2xl"></i></button>
        </div>

        <div class="flex-grow overflow-y-auto py-4" id="nav-container">
            <!-- Nav Items Injected via JS -->
        </div>

        <div class="p-4 border-t border-gray-800 text-xs text-gray-500 text-center uppercase tracking-widest bg-black standard-cinzel">
            Powered by the Iron Bank
        </div>
    </div>

    <!-- Resizer -->
    <div class="resizer" id="dragMe"></div>

    <!-- Main Content Area -->
    <div class="main-content" id="main-content">
        <div class="flex-grow overflow-y-auto w-full pb-8">
            <div class="max-w-4xl mx-auto p-6 md:p-12" id="content-container">
                <!-- Step Content Injected via JS -->
            </div>
        </div>
        
        <!-- Navigation Buttons -->
        <div class="bg-white border-t border-gray-300 p-4 flex justify-between px-6 md:px-12 z-20 shadow-[0_-4px_15px_rgba(0,0,0,0.1)] shrink-0 w-full" id="bottom-nav-bar">
            <button id="prevBtn" class="px-5 py-2.5 rounded border-2 border-gray-300 text-gray-800 hover:bg-gray-100 hover:border-gray-500 font-bold flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed transition uppercase tracking-wider text-sm standard-cinzel">
                <i class="fa-solid fa-arrow-left"></i> Retreat
            </button>
            <div class="text-sm text-[var(--got-red)] font-bold self-center hidden sm:block medieval-font tracking-widest text-lg" id="step-counter">Scroll 1 of X</div>
            <button id="nextBtn" class="px-5 py-2.5 rounded bg-[var(--got-red)] text-white hover:bg-[#8b0000] font-bold flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed transition-colors uppercase tracking-wider text-sm shadow-md standard-cinzel">
                Advance <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>
</div>

<script>
    // --- Seeded PRNG for Deterministic Data Generation ---
    function seededRandom(seed) {
        let m = 0x80000000; 
        let a = 1103515245;
        let c = 12345;
        let state = seed;
        return function() {
            state = (a * state + c) % m;
            return state / (m - 1);
        }
    }
    const rng = seededRandom(42); 

    // Store quotes for non-repeating random selection
    let availableQuotes = [];
    const allQuotes = [
        "Dracarys on these messy datasets!",
        "I eat badly formatted Excel files for breakfast.",
        "Your schema is a mess, but I'll help you this once.",
        "I burned the Iron Bank's interest rates. You're welcome.",
        "A Lannister always pays his debts, but a Maester always checks data types.",
        "Are you sure you don't want to just burn the scrolls?",
        "If only the Night King knew how to merge tables...",
        "Even Balerion the Black Dread feared a many-to-many relationship.",
        "I've seen White Walkers move faster than your data model.",
        "A true dragon rides the winds of optimized DAX.",
        "Mother of Dragons, Breaker of Chains, and Cleaner of Columns!",
        "The King in the North remembers... to remove duplicates.",
        "Chaos isn't a pit. Chaos is a flat table with no dimensions.",
        "You know nothing, Jon Snow... about Star Schemas.",
        "Hold the door! And hold your dimensional keys securely!",
        "Valar Dohaeris: All men must serve... a clean data model.",
        "Fuzzy matching? Magic exists even in Power Query."
    ];

    // --- Cinematic Background Images for Each Step ---
    const bgImages = [
        "https://images.unsplash.com/photo-1605806616949-1e87b487cb2a?q=80&w=2000&auto=format&fit=crop", // 0: Decree
        "https://images.unsplash.com/photo-1532012197267-da84d127e765?q=80&w=2000&auto=format&fit=crop", // 1: Download
        "https://images.unsplash.com/photo-1533900298318-6b8da08a523e?q=80&w=2000&auto=format&fit=crop", // 2: Goods
        "https://images.unsplash.com/photo-1584854583196-03716a4e1d52?q=80&w=2000&auto=format&fit=crop", // 3: Houses
        "https://images.unsplash.com/photo-1506784365847-bbad939e9335?q=80&w=2000&auto=format&fit=crop", // 4: Date
        "https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?q=80&w=2000&auto=format&fit=crop", // 5: Routes / Map
        "https://images.unsplash.com/photo-1590297621421-4f11b23835f8?q=80&w=2000&auto=format&fit=crop", // 6: Unpivot Levies (New)
        "https://images.unsplash.com/photo-1611081109311-66c3fb84cd79?q=80&w=2000&auto=format&fit=crop", // 7: Fact Prep
        "https://images.unsplash.com/photo-1531214159280-079b95d26139?q=80&w=2000&auto=format&fit=crop", // 8: Fuzzy Merge
        "https://images.unsplash.com/photo-1535406208535-14edd4a180ff?q=80&w=2000&auto=format&fit=crop", // 9: Normal Merges
        "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=2000&auto=format&fit=crop", // 10: Outliers
        "https://images.unsplash.com/photo-1590502123902-613d94121703?q=80&w=2000&auto=format&fit=crop", // 11: Cleanup
        "https://images.unsplash.com/photo-1618588507085-c79565432917?q=80&w=2000&auto=format&fit=crop", // 12: Stamp
        "https://images.unsplash.com/photo-1549887534-1541e9326642?q=80&w=2000&auto=format&fit=crop", // 13: Close & Apply
        "https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=2000&auto=format&fit=crop", // 14: Star Schema
        "https://images.unsplash.com/photo-1599839619722-39751411ea63?q=80&w=2000&auto=format&fit=crop"  // 15: Complete
    ];

    // --- Embedded Excel Ledger Generator ---
    function downloadLedger() {
        if (typeof XLSX === 'undefined') {
            alert('Loading ledger generation scrolls... please try again in a moment.');
            return;
        }
        
        const houses = [
            { House_ID: 1, House_Region: "Stark - The North" },
            { House_ID: 2, House_Region: "Lannister - The Westerlands" },
            { House_ID: 3, House_Region: "Targaryen - Dragonstone" },
            { House_ID: 4, House_Region: "Baratheon - The Stormlands" },
            { House_ID: 5, House_Region: "Tyrell - The Reach" },
            { House_ID: 6, House_Region: "Martell - Dorne" },
            { House_ID: 7, House_Region: "Greyjoy - The Iron Islands" }
        ];

        // New Dataset for Unpivot feature
        const levies = [
            { House_ID: 1, Infantry: 15000, Cavalry: 3000, Artillery: 0 },
            { House_ID: 2, Infantry: 35000, Cavalry: 10000, Artillery: 500 },
            { House_ID: 3, Infantry: 8000, Cavalry: 1000, Artillery: 3 }, 
            { House_ID: 4, Infantry: 20000, Cavalry: 5000, Artillery: 100 },
            { House_ID: 5, Infantry: 60000, Cavalry: 20000, Artillery: 200 },
            { House_ID: 6, Infantry: 25000, Cavalry: 15000, Artillery: 50 },
            { House_ID: 7, Infantry: 10000, Cavalry: 500, Artillery: 0 }
        ];

        const goods = [
            { Item_ID: 101, Item_Name: "ironwood shields", Category: "Military" },
            { Item_ID: 102, Item_Name: "valyrian steel blades", Category: "Military" },
            { Item_ID: 102, Item_Name: "valyrian steel swords", Category: "Military" }, 
            { Item_ID: 103, Item_Name: "dornish wine", Category: "Consumables" },
            { Item_ID: 104, Item_Name: "dragon eggs", Category: "Mythical" }, 
            { Item_ID: 105, Item_Name: "dragonglass daggers", Category: "Military" },
            { Item_ID: 105, Item_Name: "dragonglass", Category: "Military" }, 
            { Item_ID: 106, Item_Name: "golden cloaks", Category: "Apparel" }
        ];

        // Clean registry for Fuzzy Matching
        const guilds = [
            { Guild_ID: 1, Guild_Name: "Iron Bank" },
            { Guild_ID: 2, Guild_Name: "Spicers Guild" },
            { Guild_ID: 3, Guild_Name: "Alchemists Guild" },
            { Guild_ID: 4, Guild_Name: "Faceless Men" }
        ];

        const routes = ["Kings Landing to Braavos", "Winterfell to White Harbor", "Sunspear to Volantis", "Lannisport to Pyke"];
        const weatherOptions = ["Clear Skies", "Heavy Storm", "Winter Snows", "Thick Fog"];
        const noteOptions = ["Paid in Full", "Delayed by Pirates", "Goods damaged", "Routine trade", "Escorted by Gold Cloaks"];

        const transactions = [];
        const start = new Date(2023, 0, 1);
        const end = new Date(2023, 11, 31);
        
        // Generate exactly 550 rows using deterministic RNG
        for(let i=1; i<=550; i++) {
            let isOutlier = rng() < 0.02;  
            let isTypo = rng() < 0.6; // High chance of typo for fuzzy match
            let isNullDate = rng() < 0.04; // Add occasional null dates for the cleansing step
            
            // Format dates strictly to English (US) format: M/D/YYYY for the parsing lab
            let randomDate = new Date(start.getTime() + rng() * (end.getTime() - start.getTime()));
            let dateStr = isNullDate ? null : `${randomDate.getMonth() + 1}/${randomDate.getDate()}/${randomDate.getFullYear()}`;
            
            let item = goods[Math.floor(rng() * goods.length)];
            let house = houses[Math.floor(rng() * houses.length)];
            let qty = Math.floor(rng() * 100) + 1;
            let price = isOutlier ? (Math.floor(rng() * 50000) + 20000) : (Math.floor(rng() * 500) + 10);
            
            let route = routes[Math.floor(rng() * routes.length)];
            let weather = weatherOptions[Math.floor(rng() * weatherOptions.length)];
            let note = noteOptions[Math.floor(rng() * noteOptions.length)];

            // Messy Guild Names
            let trueGuild = guilds[Math.floor(rng() * guilds.length)].Guild_Name;
            let messyGuild = trueGuild;
            if (isTypo) {
                if (trueGuild === "Iron Bank") messyGuild = rng() > 0.5 ? "Irn Bank" : "The Iron Bank";

    window.revealHint = function(btn) {

            availableQuotes = [...allQuotes].sort(() => Math.random() - 0.5);
        }
        const quote = availableQuotes.pop();

        const numDragons = 2; // Limit to exactly 2 dragons

        for (let i = 0; i < numDragons; i++) {
            const container = document.createElement('div');
            container.className = 'dragon-container';
            
            const isMainDragon = (i === 0); 
            
            const fromLeft = Math.random() > 0.5;
            const startX = fromLeft ? '-30vw' : '110vw';
            const endX = fromLeft ? '120vw' : '-40vw';
            const flip = fromLeft ? 1 : -1;

            if (isMainDragon) {
                container.style.animation = `dragonFlyHover 4.5s ease-in-out forwards`;
                container.style.setProperty('--midX', 'calc(50vw - 160px)'); 
                container.style.setProperty('--midY', '30vh'); 
                container.style.setProperty('--targetScale', '1.5');
            } else {
                const duration = 2.5 + Math.random() * 1.5;
                const delay = Math.random() * 0.5;
                container.style.animation = `dragonFlyPass ${duration}s ${delay}s ease-in-out forwards`;
                container.style.setProperty('--midX', '50vw');
                container.style.setProperty('--midY', (Math.random() * 40 + 10) + 'vh');
                container.style.setProperty('--targetScale', (0.5 + Math.random() * 0.8).toString());
            }

            container.style.setProperty('--startX', startX);
            container.style.setProperty('--startY', Math.floor(Math.random() * 80) + 'vh');
            container.style.setProperty('--endX', endX);
            container.style.setProperty('--endY', Math.floor(Math.random() * 80) + 'vh');
            container.style.setProperty('--flip', flip);

            const hasRider = Math.random() > 0.4;
            let riderHtml = '';
            if (hasRider) {
                const isFemale = Math.random() > 0.5;
                // Using standard font-awesome icons, clean aesthetics
                const riderIcon = isFemale ? 'fa-person-dress' : 'fa-person';
                riderHtml = `
                    <div class="dragon-rider">
                        <i class="fa-solid ${riderIcon}" style="font-size: 2.2rem;"></i>
                        <i class="fa-solid fa-khanda" style="font-size: 1.2rem; margin-left: -5px; color: #fff;"></i>
                    </div>`;
            }

            let innerHtml = `
                <div class="dragon-wrapper">
                    ${riderHtml}
                    <i class="fa-solid fa-dragon dragon-icon"></i>
                    ${isMainDragon ? '<i class="fa-solid fa-fire dragon-fire" style="animation: breathFire 1.2s 0.8s forwards;"></i>' : ''}
                </div>
            `;

            if (isMainDragon) {
                innerHtml += `<div class="dragon-quote" style="animation: showQuote 0.4s 0.8s forwards;">${quote}</div>`;
            }

            container.innerHTML = innerHtml;
            document.body.appendChild(container);

            setTimeout(() => {
                if (container.parentNode) container.parentNode.removeChild(container);
            }, 4500);
        }

        btn.style.display = 'none';
        const hintBox = btn.nextElementSibling;
        hintBox.classList.remove('hidden');
        
        setTimeout(() => {
            hintBox.classList.add('active');
        }, 800);
    };

                <div class="nav-icon"><i class="${step.icon}"></i></div>
                <div class="truncate flex-1">${step.id}. ${step.title}</div>

                }
            });
            navContainer.appendChild(navItem);
        });

    function renderContent() {
        contentContainer.innerHTML = '';
        labSteps.forEach((step, index) => {
            const stepDiv = document.createElement('div');
            stepDiv.className = 'step-container';
            stepDiv.id = `step-${index}`;
            stepDiv.innerHTML = step.content;
            contentContainer.appendChild(stepDiv);
        });
    }

    function showStep(index) {
        document.querySelectorAll('#content-container > .step-container').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        
        document.getElementById(`step-${index}`).classList.add('active');
        document.getElementById(`nav-${index}`).classList.add('active');
        
        document.getElementById(`nav-${index}`).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        document.querySelector('.main-content').scrollTop = 0;

        currentStep = index;
        updateButtons();
        
        // Seamless cinematic crossfade transition using dual layers
        if (currentBgLayer === 1) {
            bgLayer2.style.backgroundImage = `url('${bgImages[index]}')`;
            bgLayer2.classList.add('active');
            bgLayer1.classList.remove('active');
            currentBgLayer = 2;
        } else {
            bgLayer1.style.backgroundImage = `url('${bgImages[index]}')`;
            bgLayer1.classList.add('active');
            bgLayer2.classList.remove('active');
            currentBgLayer = 1;
        }

    function toggleMobileMenu() {
        sidebar.classList.toggle('mobile-open');
        mobileOverlay.classList.toggle('mobile-open');
    }

    function setupResizer() {
        let x = 0; let w = 0;

        const mouseDownHandler = function(e) {
            x = e.clientX;
            const sidebarRect = sidebar.getBoundingClientRect();
            w = sidebarRect.width;

            document.addEventListener('mousemove', mouseMoveHandler);
            document.addEventListener('mouseup', mouseUpHandler);
            document.body.style.userSelect = 'none';
        };

        const mouseMoveHandler = function(e) {
            const dx = e.clientX - x;
            let newWidth = w + dx;
            
            if (newWidth < 240) newWidth = 240;
            if (newWidth > 600) newWidth = 600;
            
            sidebar.style.width = `${newWidth}px`;
            document.documentElement.style.setProperty('--sidebar-width', `${newWidth}px`);
        };

        const mouseUpHandler = function() {
            document.removeEventListener('mousemove', mouseMoveHandler);
            document.removeEventListener('mouseup', mouseUpHandler);
            document.body.style.userSelect = '';
        };

        resizer.addEventListener('mousedown', mouseDownHandler);

        window.addEventListener('resize', () => {
            if (window.innerWidth <= 768) {
                sidebar.style.width = ''; 
            }
        });
    }

    init();
</script>
</body>
</html>
